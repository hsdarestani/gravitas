  <!-- The theme is set before the first paint. Reading it from script after
       the stylesheet has applied shows one frame of the wrong theme. -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('gravitas-theme'); } catch (e) { /* storage denied */ }
      var system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', saved || system);
    })();
  </script>

  <style>
    /* A selected page/folder node is the active destination. Do not also
       paint its top-level module row as selected. */
    .ws[data-node-route] .ws-tree > .ws-node > .ws-node__row[aria-current="page"] {
      background: transparent;
      color: var(--g-text-muted);
      font-weight: inherit;

<body>

          </svg>
        </button>
      </div>

      <nav class="ws-crumbs" id="ws-crumbs" aria-label="Breadcrumb"></nav>

      <div class="ws-topbar__actions">

        <button class="theme-toggle" id="ws-theme" type="button" aria-pressed="false" aria-label="Switch colour theme" title="Switch colour theme">

            <g transform="translate(1.476 -1.425)"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></g>

            <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/>

  <noscript>
    <div class="ws-alert" style="margin:24px">
      <p class="ws-alert__title">The workspace needs JavaScript</p>
      <p>It is an editor and a live view of your projects, so there is no meaningful version to render on the server. The public site at <a href="/">gravitasplus.com</a> works without it.</p>
    </div>

  <script type="module">
    import { start } from '/assets/ws/ws-app.js?v=20260914-1';
    import { platform } from '/assets/ws/ws-platform.js?v=20260914-7';
    import { RESEARCH_SECTIONS } from '/assets/ws/ws-nav.js?v=20260913-3';
    import { installFiveLayer } from '/assets/ws/ws-five-layer.js?v=20260918-fix1';
    import { installNextcloudNativeRouter } from '/assets/ws/ws-nextcloud-native.js?v=20260914-2';
    import { installNotesPerformance } from '/assets/ws/ws-notes-performance.js?v=20260917-1';
    import { installNextcloudSsoBridge } from '/assets/ws/ws-nextcloud-sso.js?v=20260915-1';
    import { installLiveKms } from '/assets/ws/ws-kms-live.js?v=20260915-1';
    import { installResearchWorkspaceActions } from '/assets/ws/ws-research-actions.js?v=20260915-1';
    import { installResearchProjectActions } from '/assets/ws/ws-project-actions.js?v=20260916-1';
    import { installCoreContentActions } from '/assets/ws/ws-core-content-actions.js?v=20260915-1';
    import { installWorkspaceTaskDeckFixes } from '/assets/ws/ws-task-deck-fixes.js?v=20260915-1';
    import { installTaskDeckMirror } from '/assets/ws/ws-task-deck-mirror.js?v=20260915-1';
    import { installSpaceWorkspaceIntegration } from '/assets/ws/ws-space-integration.js?v=20260917-1';

    function isNodeRoute(path = location.pathname) {
      return path === '/workspace/folder' || path.startsWith('/workspace/folder/')
        || path === '/workspace/page' || path.startsWith('/workspace/page/');
    }

    // Generic page/folder routes are editor tree nodes, not the Research
    // Folder module. Both ws-app and this shell import the same module URL,
    // so mutating these section matchers fixes index + breadcrumbs together.
    const editorSection = RESEARCH_SECTIONS.find((section) => section.id === 'res-editor');
    const folderSection = RESEARCH_SECTIONS.find((section) => section.id === 'res-folders');
    if (editorSection && folderSection) {
      const editorMatch = editorSection.match;
      const folderMatch = folderSection.match;
      editorSection.match = (path) => isNodeRoute(path) || editorMatch(path);
      folderSection.match = (path) => !isNodeRoute(path) && folderMatch(path);
    }

    function syncNodeRouteState() {
      const root = document.getElementById('ws');
      if (root) root.toggleAttribute('data-node-route', isNodeRoute());
    }
    syncNodeRouteState();
    addEventListener('ws:navigate', syncNodeRouteState);
    addEventListener('popstate', syncNodeRouteState);

    function waitForPlatform() {
      if (platform.settled) return Promise.resolve();
      return new Promise((resolve) => {
        const started = performance.now();
        const tick = () => {
          if (platform.settled || performance.now() - started > 15000) resolve();
          else setTimeout(tick, 16);
        };
        tick();
      });
    }

    async function bootWorkspace() {
      // Normalize the legacy Research/Editor alias before any route owner paints
      // it. The Notes performance layer then keeps remote reconciliation off
      // the critical first-paint path.
      installNotesPerformance();

      // Own the two legacy KMS routes before ws-app gets its first chance to
      // draw the old local/sample renderer. installLiveKms schedules its live
      // account-backed render in the same task, so seeded content never makes
      // it to a browser paint. The SSO wrapper is also installed before any
      // native-app launcher can open a raw Nextcloud URL.
      installLiveKms();
      installNextcloudSsoBridge();

      // start() paints the shell synchronously and then waits on account
      // bootstrap before fetching the heavier page tree. Install the layered
      // navigation as soon as that entitlement bootstrap settles instead of
      // making menus wait for every page to hydrate. The old boot path also
      // called loadBootstrap() a second time here; that redundant request is
      // intentionally gone.
      const workspaceReady = start();
      await waitForPlatform();
      installFiveLayer();
      installNextcloudNativeRouter();
      installResearchWorkspaceActions();
      installResearchProjectActions();
      installCoreContentActions();
      installWorkspaceTaskDeckFixes();
      installTaskDeckMirror();
      installSpaceWorkspaceIntegration();
      await workspaceReady;
      // start() may finish by rendering a legacy route after an overlay was
      // installed. Re-run route owners once with the fully hydrated tree.
      dispatchEvent(new CustomEvent('ws:navigate'));
    }

    if (window.GravitasIcons) bootWorkspace();
    else addEventListener('load', bootWorkspace, { once: true });
  </script>
  <script type="module" src="/assets/ws/ws-actionable-ui.js?v=20260915-1"></script>
  <script src="/assets/production-bridge.js?v=up-f706806e3a02-g1df6ff09-rl2" defer></script>
</body>
