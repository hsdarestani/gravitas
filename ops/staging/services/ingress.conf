# Dedicated staging-services host only. Include from the corresponding HTTPS
# server location blocks after installing the staging DNS/TLS configuration.
# forum-staging.graviquest.com -> http://127.0.0.1:18882
# learn-staging.graviquest.com, studio-staging.graviquest.com,
# apps.learn-staging.graviquest.com -> http://127.0.0.1:8182
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
add_header X-Robots-Tag "noindex, nofollow" always;
