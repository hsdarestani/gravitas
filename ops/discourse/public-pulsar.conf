# Only the already-public chat endpoint. No credentials or private API proxy.
location = /gq-pulsar/ask/ {
    limit_except POST { deny all; }
    client_max_body_size 24k;
    proxy_pass http://127.0.0.1:8000/api/pulsar/ask/;
    proxy_set_header Host graviquest.com;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
}
