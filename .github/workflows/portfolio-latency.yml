name: Research Portfolio Latency
on:
  push:
    branches: [fix/research-portfolio-loading-20261016]
    paths: ['.github/workflows/portfolio-latency.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      HOST: ${{ secrets.DEPLOY_HOST }}
      LOGIN: ${{ secrets.DEPLOY_USER }}
      PORT: ${{ secrets.DEPLOY_PORT }}
    steps:
      - uses: actions/checkout@v4
      - name: Read project API timings and worker health
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/latency
          chmod 600 ~/.ssh/latency
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/latency -p "${PORT:-22}" -o BatchMode=yes -o ConnectTimeout=10)
          TARGET="${LOGIN:-deploy}"
          if ! ssh "${OPTS[@]}" "$TARGET@$HOST" true 2>/dev/null; then TARGET=root; fi
          scp -i ~/.ssh/latency -P "${PORT:-22}" ops/portfolio_latency.py "$TARGET@$HOST:/tmp/gq-latency-$GITHUB_RUN_ID.py"
          ssh "${OPTS[@]}" "$TARGET@$HOST" "sudo -u gravitas bash -c 'set -a; . /etc/gravitas/backend.env; set +a; export PYTHONPATH=/opt/gravitas-backend DJANGO_SETTINGS_MODULE=gravitas_backend.settings; timeout 60 /opt/gravitas-backend/.venv/bin/python /tmp/gq-latency-$GITHUB_RUN_ID.py'; rm -f /tmp/gq-latency-$GITHUB_RUN_ID.py"
          ssh "${OPTS[@]}" "$TARGET@$HOST" "sudo journalctl -u gravitas-backend --since '15 minutes ago' --no-pager | rg 'WORKER TIMEOUT|Booting worker|Listening at|Error handling request|canonical_storage_unavailable' | tail -25 || true"
