name: Deploy Gravitas to Strato

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gravitas-production
  cancel-in-progress: true

env:
  DOMAIN: gravitasplus.com
  DEPLOY_PATH: /var/www/gravitas

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}" || { echo "Missing DEPLOY_HOST"; exit 1; }
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || { echo "Missing DEPLOY_SSH_KEY"; exit 1; }

          CONFIGURED_USER="${{ secrets.DEPLOY_USER }}"
          DEPLOY_PORT="${{ secrets.DEPLOY_PORT }}"
          [ -n "$CONFIGURED_USER" ] || CONFIGURED_USER="deploy"
          [ -n "$DEPLOY_PORT" ] || DEPLOY_PORT="22"

          echo "CONFIGURED_USER=$CONFIGURED_USER" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$DEPLOY_PORT" >> "$GITHUB_ENV"

      - name: Prepare SSH and resolve login user
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/gravitas_deploy
          chmod 600 ~/.ssh/gravitas_deploy
          ssh-keygen -y -f ~/.ssh/gravitas_deploy >/dev/null
          ssh-keyscan -p "$DEPLOY_PORT" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          SSH_OPTS=(-i ~/.ssh/gravitas_deploy -p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=10)
          HOST="${{ secrets.DEPLOY_HOST }}"

          if ssh "${SSH_OPTS[@]}" "$CONFIGURED_USER@$HOST" true 2>/dev/null; then
            EFFECTIVE_USER="$CONFIGURED_USER"
          elif [ "$CONFIGURED_USER" != "root" ] && ssh "${SSH_OPTS[@]}" "root@$HOST" true 2>/dev/null; then
            EFFECTIVE_USER="root"
            echo "Configured DEPLOY_USER could not authenticate; using root for bootstrap."
          else
            echo "SSH authentication failed. DEPLOY_SSH_KEY must match the public key installed on the Strato VM."
            exit 1
          fi

          echo "DEPLOY_USER=$EFFECTIVE_USER" >> "$GITHUB_ENV"

      - name: Bootstrap production server
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/gravitas_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@${{ secrets.DEPLOY_HOST }}" \
            bash -s -- "$DOMAIN" "$DEPLOY_PATH" "$DEPLOY_PORT" <<'REMOTE'
          set -euo pipefail

          DOMAIN="$1"
          DEPLOY_PATH="$2"
          SSH_PORT="$3"

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif sudo -n true 2>/dev/null; then
            SUDO="sudo"
          else
            echo "Deployment user must be root or have passwordless sudo."
            exit 1
          fi

          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update -y
          $SUDO apt-get install -y \
            nginx rsync ufw certbot python3-certbot-nginx ca-certificates curl \
            postgresql postgresql-contrib fail2ban unattended-upgrades

          $SUDO systemctl enable --now postgresql

          if ! $SUDO -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='gravitas'" | grep -q 1; then
            $SUDO -u postgres createdb gravitas
          fi

          cat > /tmp/20auto-upgrades <<'EOF'
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          EOF
          $SUDO mv /tmp/20auto-upgrades /etc/apt/apt.conf.d/20auto-upgrades
          $SUDO chmod 644 /etc/apt/apt.conf.d/20auto-upgrades

          cat > /tmp/gravitas-fail2ban.local <<'EOF'
          [sshd]
          enabled = true
          maxretry = 5
          findtime = 10m
          bantime = 1h
          backend = systemd
          EOF
          $SUDO mv /tmp/gravitas-fail2ban.local /etc/fail2ban/jail.d/gravitas.local
          $SUDO systemctl enable --now fail2ban
          $SUDO fail2ban-client reload

          $SUDO mkdir -p "$DEPLOY_PATH"
          $SUDO chown -R "$(id -un):$(id -gn)" "$DEPLOY_PATH"

          cat > /tmp/gravitas-backup.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          BACKUP_DIR=/var/backups/gravitas
          STAMP=$(date +%Y%m%d-%H%M%S)
          mkdir -p "$BACKUP_DIR"
          tar -czf "$BACKUP_DIR/site-$STAMP.tar.gz" -C /var/www gravitas
          sudo -u postgres pg_dump -Fc gravitas > "$BACKUP_DIR/db-$STAMP.dump"
          find "$BACKUP_DIR" -type f -mtime +14 -delete
          EOF
          $SUDO mv /tmp/gravitas-backup.sh /usr/local/sbin/gravitas-backup
          $SUDO chmod 750 /usr/local/sbin/gravitas-backup

          cat > /tmp/gravitas-backup.service <<'EOF'
          [Unit]
          Description=Gravitas daily backup
          After=postgresql.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/gravitas-backup
          EOF
          $SUDO mv /tmp/gravitas-backup.service /etc/systemd/system/gravitas-backup.service

          cat > /tmp/gravitas-backup.timer <<'EOF'
          [Unit]
          Description=Run Gravitas backup daily

          [Timer]
          OnCalendar=*-*-* 03:30:00
          Persistent=true
          RandomizedDelaySec=15m

          [Install]
          WantedBy=timers.target
          EOF
          $SUDO mv /tmp/gravitas-backup.timer /etc/systemd/system/gravitas-backup.timer
          $SUDO systemctl daemon-reload
          $SUDO systemctl enable --now gravitas-backup.timer

          CERT_DIR="/etc/letsencrypt/live/$DOMAIN"
          if $SUDO test -f "$CERT_DIR/fullchain.pem" && $SUDO test -f "$CERT_DIR/privkey.pem"; then
            cat > /tmp/gravitas-nginx.conf <<NGINX
          server {
              listen 80;
              listen [::]:80;
              server_name $DOMAIN;
              return 301 https://\$host\$request_uri;
          }

          server {
              listen 443 ssl;
              listen [::]:443 ssl;
              server_name $DOMAIN;

              root $DEPLOY_PATH;
              index index.html;

              ssl_certificate $CERT_DIR/fullchain.pem;
              ssl_certificate_key $CERT_DIR/privkey.pem;
              include /etc/letsencrypt/options-ssl-nginx.conf;
              ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

              location / {
                  try_files \$uri \$uri/ /index.html;
              }

              location ~ /\\. {
                  deny all;
              }

              add_header X-Content-Type-Options "nosniff" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              add_header X-Frame-Options "SAMEORIGIN" always;
          }
          NGINX
          else
            cat > /tmp/gravitas-nginx.conf <<NGINX
          server {
              listen 80;
              listen [::]:80;
              server_name $DOMAIN;

              root $DEPLOY_PATH;
              index index.html;

              location / {
                  try_files \$uri \$uri/ /index.html;
              }

              location ~ /\\. {
                  deny all;
              }

              add_header X-Content-Type-Options "nosniff" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
              add_header X-Frame-Options "SAMEORIGIN" always;
          }
          NGINX
          fi

          $SUDO mv /tmp/gravitas-nginx.conf /etc/nginx/sites-available/gravitas
          $SUDO ln -sfn /etc/nginx/sites-available/gravitas /etc/nginx/sites-enabled/gravitas
          $SUDO rm -f /etc/nginx/sites-enabled/default

          $SUDO nginx -t
          $SUDO systemctl enable --now nginx
          $SUDO systemctl reload nginx

          $SUDO ufw allow "$SSH_PORT/tcp"
          $SUDO ufw allow 80/tcp
          $SUDO ufw allow 443/tcp
          $SUDO ufw --force enable
          REMOTE

      - name: Deploy repository
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            -e "ssh -i ~/.ssh/gravitas_deploy -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@${{ secrets.DEPLOY_HOST }}:$DEPLOY_PATH/"

      - name: Ensure SSL and reload Nginx
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/gravitas_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@${{ secrets.DEPLOY_HOST }}" \
            bash -s -- "$DOMAIN" <<'REMOTE'
          set -euo pipefail
          DOMAIN="$1"

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          if ! $SUDO test -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem"; then
            $SUDO certbot --nginx \
              -d "$DOMAIN" \
              --non-interactive \
              --agree-tos \
              --register-unsafely-without-email \
              --redirect
          fi

          $SUDO nginx -t
          $SUDO systemctl reload nginx
          REMOTE

      - name: Verify infrastructure
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_HOST }}"
          ssh -i ~/.ssh/gravitas_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo systemctl is-active postgresql
          sudo systemctl is-active fail2ban
          sudo systemctl is-active gravitas-backup.timer
          sudo -u postgres psql -d gravitas -tAc 'SELECT 1' | grep -q 1
          sudo /usr/local/sbin/gravitas-backup
          test -n "$(sudo find /var/backups/gravitas -maxdepth 1 -type f -name 'db-*.dump' -print -quit)"
          echo infrastructure-checks-passed
          REMOTE

      - name: Verify production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 3 \
            -H "Host: $DOMAIN" \
            "http://${{ secrets.DEPLOY_HOST }}/" >/dev/null
          echo "HTTP server check passed."

          curl -4 -fsSL --retry 6 --retry-delay 3 --connect-timeout 8 --max-time 20 \
            "https://$DOMAIN/" >/dev/null
          echo "HTTPS production check passed: https://$DOMAIN/"
