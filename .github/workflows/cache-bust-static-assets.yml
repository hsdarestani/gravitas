name: One-time cache bust synced frontend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-bust-static-assets.yml'

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version CSS and JS asset URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          VERSION = '20260819-3cbfde2'
          pattern = re.compile(r'(?P<url>assets/[A-Za-z0-9_./-]+\.(?:css|js))(?:\?v=[A-Za-z0-9_.-]+)?')

          changed = 0
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              new = pattern.sub(lambda m: m.group('url') + '?v=' + VERSION, text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed += 1
          print(f'cache-busted {changed} HTML files')
          PY

          rm -f .github/workflows/cache-bust-static-assets.yml

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Cache-bust synced frontend CSS and JS'
          git push origin HEAD:main
