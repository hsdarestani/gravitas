name: Community and Discourse validation
on:
  push:
    branches: [feat/discourse-community]
    paths: ['backend/**', 'discourse/**', 'ops/discourse/**', 'assets/forum-live.*', '.github/workflows/forum-validation.yml']
  pull_request:
    paths: ['backend/core/forum*', 'backend/core/test_forum.py', 'discourse/**', 'ops/discourse/**', 'assets/forum-live.*', '.github/workflows/forum-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r backend/requirements.txt
      - name: Check integration and existing account workflows
        env:
          PYTHONPATH: backend
          DJANGO_SETTINGS_MODULE: gravitas_backend.test_settings
        run: |
          python -m django test core.test_forum core.test_auth_account_flows core.test_auth_logout_flow core.test_email_verification core.test_oidc_sso --noinput
          python -m django makemigrations core --check --dry-run
          python -m django check
          node --check assets/forum-live.js
          node --check assets/production-bridge-core.js
          node --check assets/site.js
          bash -n ops/discourse/stage.sh
          bash -n ops/discourse/launch.sh
          bash -n ops/discourse/storage.sh
          python -m py_compile ops/discourse/storage.py
          ruby -c ops/discourse/storage-plugin.rb
          ruby -c ops/discourse/bootstrap.rb
          ruby -c ops/discourse/verify_native.rb
          python -m unittest discover -s ops/discourse -p 'test_*.py'
  internal-staging:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[stage-discourse]')
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: gravitas-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated loopback-only Discourse after capacity checks
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          INSTALL_LOCAL_S3: ${{ contains(github.event.head_commit.message, '[install-storage]') && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/forum
          chmod 600 ~/.ssh/forum
          PORT="${SSH_PORT:-22}"; LOGIN="${SSH_USER:-deploy}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/forum -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15)
          if ! ssh "${OPTS[@]}" "$LOGIN@$SSH_HOST" true; then LOGIN=root; fi
          REMOTE="/tmp/graviquest-forum-$GITHUB_SHA"
          ssh "${OPTS[@]}" "$LOGIN@$SSH_HOST" "mkdir -p '$REMOTE'"
          tar -czf "$RUNNER_TEMP/forum.tgz" ops/discourse discourse/theme backend/core/forum_content.py assets/logos assets/fonts/DMSans.ttf assets/fonts/DMMono-Regular.ttf assets/fonts/Literata-latin.woff2
          scp -i ~/.ssh/forum -P "$PORT" "$RUNNER_TEMP/forum.tgz" "$LOGIN@$SSH_HOST:$REMOTE/source.tgz"
          ssh "${OPTS[@]}" "$LOGIN@$SSH_HOST" "tar -xzf '$REMOTE/source.tgz' -C '$REMOTE' && sudo env GQ_INSTALL_LOCAL_S3='$INSTALL_LOCAL_S3' bash '$REMOTE/ops/discourse/stage.sh' '$REMOTE'"
      - name: Install pinned browser acceptance dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/forum-browser" --no-audit --no-fund playwright@1.65.0
          "$RUNNER_TEMP/forum-browser/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/forum-browser/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Verify native branded UI on desktop and mobile through SSH
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          GQ_BROWSER_OUTPUT: ${{ runner.temp }}/forum-screenshots
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"; LOGIN="${SSH_USER:-deploy}"
          OPTS=(-i ~/.ssh/forum -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10 -o ExitOnForwardFailure=yes)
          if ! ssh "${OPTS[@]}" "$LOGIN@$SSH_HOST" true; then LOGIN=root; fi
          ssh "${OPTS[@]}" -f -N -L 18881:127.0.0.1:18880 "$LOGIN@$SSH_HOST"
          node ops/discourse/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discourse-native-screenshots
          path: ${{ runner.temp }}/forum-screenshots
          if-no-files-found: ignore
          retention-days: 14
