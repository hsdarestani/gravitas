name: Recover GraviQuest Backend Health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-recover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Separate recovery from deployment's queued jobs. Deployment protects
  # its checkpoint; recovery runs only when explicitly invoked by this file.
  group: gravitas-backend-health-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: SSH into production and recover unhealthy backend
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST"
          PORT="${SSH_PORT:-22}"
          USER="${SSH_USER:-deploy}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/recover
          chmod 600 ~/.ssh/recover
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/recover -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10)
          if ! ssh "${OPTS[@]}" "$USER@$SSH_HOST" true 2>/dev/null; then
            if [ "$USER" != root ] && ssh "${OPTS[@]}" "root@$SSH_HOST" true 2>/dev/null; then
              USER=root
            else
              echo "Could not authenticate to production" >&2
              exit 1
            fi
          fi
          ssh "${OPTS[@]}" "$USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo "Checking production backend service"
          sudo -n systemctl daemon-reload
          if ! sudo -n systemctl is-active --quiet gravitas-backend.service; then
            echo "Backend inactive: starting service"
            sudo -n systemctl reset-failed gravitas-backend.service || true
            sudo -n systemctl start gravitas-backend.service
          fi
          sudo -n systemctl enable gravitas-backend.service >/dev/null
          sudo -n systemctl is-active --quiet gravitas-backend.service
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --silent --show-error --fail --max-time 5 -H "X-Forwarded-Proto: https" \
                 http://127.0.0.1:8000/api/health/ 2>/dev/null | grep -q '"status": "ok"'; then
              break
            fi
            if [ "$attempt" = 8 ]; then
              echo "Backend health remains unavailable" >&2
              exit 1
            fi
            sleep 3
          done
          if ! curl --silent --show-error --fail --max-time 10 \
            --resolve graviquest.com:443:127.0.0.1 \
            https://graviquest.com/api/health/ | grep -q '"status": "ok"'; then
            echo "Nginx end-to-end health failed" >&2
            exit 1
          fi
          echo "Backend systemd active, localhost Django and Nginx HTTPS health both OK"
          REMOTE

  pulsar-inventory-hotfix:
    name: Apply isolated Pulsar project inventory fix, backed up and rollback-protected
    needs: recover
    if: >-
      ${{ github.repository == 'hsdarestani/gravitas' && github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[apply-pulsar-inventory-hotfix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: gravitas-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight and isolated backend-only hotfix
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=c990adcbb07b10ad438e6f68c6f278a86b8e292a
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          test -n "$SSH_KEY" && test -n "$SSH_HOST"
          PORT="$SSH_PORT"; [ -n "$PORT" ] || PORT=22
          LOGIN="$SSH_USER"; [ -n "$LOGIN" ] || LOGIN=deploy
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/pulsar-inventory
          chmod 600 ~/.ssh/pulsar-inventory
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "HOTFIX_RUNNER_STAGE=ssh_auth_probe"
          if ! ssh -i ~/.ssh/pulsar-inventory -p "$PORT" -o BatchMode=yes "$LOGIN@$SSH_HOST" 'sudo -n true' 2>/dev/null; then
            if ssh -i ~/.ssh/pulsar-inventory -p "$PORT" -o BatchMode=yes "root@$SSH_HOST" true 2>/dev/null; then
              LOGIN=root
            else
              echo "::error::SSH/sudo unavailable. Nothing changed."
              exit 1
            fi
          fi
          echo "HOTFIX_RUNNER_STAGE=ssh_authenticated"
          STAGE="/tmp/gravitas-pulsar-task-$GITHUB_RUN_ID"
          ssh -i ~/.ssh/pulsar-inventory -p "$PORT" -o BatchMode=yes "$LOGIN@$SSH_HOST" "install -d -m 700 '$STAGE'"
          echo "HOTFIX_RUNNER_STAGE=stage_created"
          for file in telegram_pulsar.py task_notifications.py; do
            git show "$BASE_SHA:backend/core/$file" > "$RUNNER_TEMP/old-$file"
            python3 -m py_compile "backend/core/$file"
          done
          echo "HOTFIX_RUNNER_STAGE=base_commit_verified"
          scp -i ~/.ssh/pulsar-inventory -P "$PORT" -o BatchMode=yes \
            backend/core/telegram_pulsar.py backend/core/task_notifications.py "$LOGIN@$SSH_HOST:$STAGE/"
          echo "HOTFIX_RUNNER_STAGE=files_uploaded"
          OLD_TASK="$(sha256sum "$RUNNER_TEMP/old-telegram_pulsar.py" | cut -d' ' -f1)"
          OLD_NOTIF="$(sha256sum "$RUNNER_TEMP/old-task_notifications.py" | cut -d' ' -f1)"
          NEW_TASK="$(sha256sum backend/core/telegram_pulsar.py | cut -d' ' -f1)"
          NEW_NOTIF="$(sha256sum backend/core/task_notifications.py | cut -d' ' -f1)"
          echo "HOTFIX_RUNNER_STAGE=begin_remote"
          ssh -i ~/.ssh/pulsar-inventory -p "$PORT" -o BatchMode=yes "$LOGIN@$SSH_HOST" \
            "sudo -n bash -se -- '$GITHUB_RUN_ID' '$OLD_TASK' '$OLD_NOTIF' '$NEW_TASK' '$NEW_NOTIF'" <<'REMOTE'
          set -Eeuo pipefail
          RUN="$1"; OLD_TASK="$2"; OLD_NOTIF="$3"; NEW_TASK="$4"; NEW_NOTIF="$5"
          DIR=/opt/gravitas-backend/core
          PY=/opt/gravitas-backend/.venv/bin/python
          STAGE="/tmp/gravitas-pulsar-task-$RUN"
          BACKUP="/var/backups/gravitas/pulsar-inventory-$RUN"
          echo "HOTFIX_REMOTE_STAGE=entered"
          if [ ! -x "$PY" ]; then
            echo "::error::Preflight missing backend virtualenv python"
            echo "BACKEND_PYTHON_PRESENT=no"
            exit 1
          fi
          echo "BACKEND_PYTHON_PRESENT=yes"
          if ! systemctl is-active --quiet gravitas-backend.service; then
            echo "::error::Backend service not active. No production changes."
            exit 1
          fi
          echo "BACKEND_SERVICE_ACTIVE=yes"
          if ! curl -fsS --max-time 8 -H "X-Forwarded-Proto: https" http://127.0.0.1:8000/api/health/ |
               grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
            echo "::error::Backend local health baseline failed. No production changes."
            exit 1
          fi
          echo "HOTFIX_REMOTE_STAGE=health_baseline_passed"
          test "$(sha256sum "$DIR/telegram_pulsar.py" | cut -d' ' -f1)" = "$OLD_TASK" ||
            { echo "::error::Production Pulsar task service has changed. No write."; exit 1; }
          test "$(sha256sum "$DIR/task_notifications.py" | cut -d' ' -f1)" = "$OLD_NOTIF" ||
            { echo "::error::Production task notification module has changed. No write."; exit 1; }
          test "$(sha256sum "$STAGE/telegram_pulsar.py" | cut -d' ' -f1)" = "$NEW_TASK"
          test "$(sha256sum "$STAGE/task_notifications.py" | cut -d' ' -f1)" = "$NEW_NOTIF"
          echo "HOTFIX_REMOTE_STAGE=baseline_hashes_valid"
          install -d -m 700 "$BACKUP"
          cp -a "$DIR/telegram_pulsar.py" "$DIR/task_notifications.py" "$BACKUP/"
          echo "HOTFIX_REMOTE_STAGE=backups_created"
          modified=0
          rollback() {
            status=$?
            trap - ERR
            if [ "$modified" = 1 ]; then
              cp -a "$BACKUP/telegram_pulsar.py" "$BACKUP/task_notifications.py" "$DIR/"
              systemctl reload gravitas-backend.service || true
              echo "::warning::Production task hotfix rolled back to verified backups."
            fi
            exit "$status"
          }
          trap rollback ERR
          for file in telegram_pulsar.py task_notifications.py; do
            install -o "$(stat -c %u "$DIR/$file")" -g "$(stat -c %g "$DIR/$file")" \
              -m "$(stat -c %a "$DIR/$file")" "$STAGE/$file" "$DIR/$file.new"
          done
          modified=1
          mv -f "$DIR/telegram_pulsar.py.new" "$DIR/telegram_pulsar.py"
          mv -f "$DIR/task_notifications.py.new" "$DIR/task_notifications.py"
          echo "HOTFIX_REMOTE_STAGE=files_swapped"
          "$PY" -m py_compile "$DIR/telegram_pulsar.py" "$DIR/task_notifications.py"
          (
            set -a
            . /etc/gravitas/backend.env
            set +a
            PYTHONPATH=/opt/gravitas-backend DJANGO_SETTINGS_MODULE=gravitas_backend.settings "$PY" -m django check
          )
          echo "HOTFIX_REMOTE_STAGE=django_checked"
          systemctl reload gravitas-backend.service
          healthy=0
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 8 -H "X-Forwarded-Proto: https" http://127.0.0.1:8000/api/health/ |
               grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              healthy=1
              break
            fi
            sleep 2
          done
          echo "HOTFIX_REMOTE_STAGE=reload_completed"
          test "$healthy" = 1
          curl -fsS --max-time 12 --resolve graviquest.com:443:127.0.0.1 https://graviquest.com/api/health/ |
            grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'
          test "$(sha256sum "$DIR/telegram_pulsar.py" | cut -d' ' -f1)" = "$NEW_TASK"
          test "$(sha256sum "$DIR/task_notifications.py" | cut -d' ' -f1)" = "$NEW_NOTIF"
          trap - ERR
          rm -rf -- "$STAGE"
          echo "PULSAR_INVENTORY_HOTFIX_APPLIED; backup preserved: $BACKUP"
          REMOTE

  pulsar-inventory-patch:
    name: Surgical Pulsar inventory patch, preserving production code
    needs: recover
    if: >-
      ${{ github.repository == 'hsdarestani/gravitas' && github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[apply-pulsar-inventory-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: gravitas-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded three-hunk patch with rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=c990adcbb07b10ad438e6f68c6f278a86b8e292a
          git fetch --no-tags --depth=1 origin "$BASE"
          git show "$BASE:backend/core/telegram_pulsar.py" > "$RUNNER_TEMP/original.py"
          python3 -m py_compile backend/core/telegram_pulsar.py
          set +e
          diff -u --label telegram_pulsar.py --label telegram_pulsar.py \
            "$RUNNER_TEMP/original.py" backend/core/telegram_pulsar.py > "$RUNNER_TEMP/inventory.patch"
          rc=$?
          set -e
          test "$rc" -eq 1 && test -s "$RUNNER_TEMP/inventory.patch"
          test -n "$SSH_KEY" && test -n "$SSH_HOST"
          PORT="$SSH_PORT"; [ -n "$PORT" ] || PORT=22
          LOGIN="$SSH_USER"; [ -n "$LOGIN" ] || LOGIN=deploy
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/inventory
          chmod 600 ~/.ssh/inventory
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          if ! ssh -i ~/.ssh/inventory -p "$PORT" -o BatchMode=yes "$LOGIN@$SSH_HOST" 'sudo -n true' 2>/dev/null; then
            if ssh -i ~/.ssh/inventory -p "$PORT" -o BatchMode=yes "root@$SSH_HOST" true 2>/dev/null; then
              LOGIN=root
            else
              echo "::error::SSH/sudo unavailable; no production changes."
              exit 1
            fi
          fi
          STAGE="/tmp/gravitas-inventory-patch-$GITHUB_RUN_ID"
          ssh -i ~/.ssh/inventory -p "$PORT" -o BatchMode=yes "$LOGIN@$SSH_HOST" "install -d -m 700 '$STAGE'"
          scp -i ~/.ssh/inventory -P "$PORT" -o BatchMode=yes "$RUNNER_TEMP/inventory.patch" "$LOGIN@$SSH_HOST:$STAGE/change.patch"
          ssh -i ~/.ssh/inventory -p "$PORT" -o BatchMode=yes "$LOGIN@$SSH_HOST" \
            "sudo -n bash -se -- '$GITHUB_RUN_ID'" <<'REMOTE'
          set -Eeuo pipefail
          RUN="$1"
          DEST=/opt/gravitas-backend/core/telegram_pulsar.py
          PY=/opt/gravitas-backend/.venv/bin/python
          STAGE="/tmp/gravitas-inventory-patch-$RUN"
          BACKUP="/var/backups/gravitas/pulsar-inventory-$RUN"
          test -x "$PY" && test -f "$DEST" && test -f "$STAGE/change.patch"
          systemctl is-active --quiet gravitas-backend.service
          curl -fsS --max-time 8 -H "X-Forwarded-Proto: https" http://127.0.0.1:8000/api/health/ |
            grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'
          # Patch to a disposable file only. An incompatible live version stops safely.
          patch --batch --fuzz=0 --forward -o "$STAGE/candidate.py" "$DEST" < "$STAGE/change.patch"
          grep -q "def _project_task_inventory" "$STAGE/candidate.py"
          grep -q "inventory = _requested_project_inventory(text)" "$STAGE/candidate.py"
          "$PY" -m py_compile "$STAGE/candidate.py"
          install -d -m 700 "$BACKUP"
          cp -a "$DEST" "$BACKUP/telegram_pulsar.py"
          modified=0
          rollback() {
            result=$?
            trap - ERR
            if [ "$modified" = 1 ]; then
              cp -a "$BACKUP/telegram_pulsar.py" "$DEST"
              systemctl reload gravitas-backend.service || true
              echo "::warning::Original Pulsar module restored after failed patch."
            fi
            exit "$result"
          }
          trap rollback ERR
          install -o "$(stat -c %u "$DEST")" -g "$(stat -c %g "$DEST")" \
            -m "$(stat -c %a "$DEST")" "$STAGE/candidate.py" "$DEST.new-$RUN"
          modified=1
          mv -f "$DEST.new-$RUN" "$DEST"
          (
            set -a
            . /etc/gravitas/backend.env
            set +a
            export PYTHONPATH=/opt/gravitas-backend
            export DJANGO_SETTINGS_MODULE=gravitas_backend.settings
            "$PY" -m django check
            "$PY" - <<'PY'
          import django
          django.setup()
          from core.telegram_pulsar import _requested_project_inventory
          assert _requested_project_inventory("Review tasks in Research Project #213") == (213, 1)
          assert _requested_project_inventory("/projecttasks 213 2") == (213, 2)
          print("PULSAR_INVENTORY_SMOKE_PASS")
          PY
          )
          systemctl reload gravitas-backend.service
          ready=0
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 8 -H "X-Forwarded-Proto: https" http://127.0.0.1:8000/api/health/ |
               grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              ready=1; break
            fi
            sleep 2
          done
          test "$ready" = 1
          curl -fsS --max-time 12 --resolve graviquest.com:443:127.0.0.1 https://graviquest.com/api/health/ |
            grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'
          trap - ERR
          rm -rf -- "$STAGE"
          echo "PULSAR_INVENTORY_PATCH_APPLIED; backup=$BACKUP"
          REMOTE
