name: Recover GraviQuest Backend Health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-recover.yml'
  workflow_dispatch:
  # A lightweight production safety net: detect a dead upstream even when
  # systemd still reports "active". This does not redeploy or touch databases.
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  # Separate recovery from deployment's queued jobs. Deployment protects
  # its checkpoint; recovery runs only when explicitly invoked by this file.
  group: gravitas-backend-health-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: SSH into production and recover unhealthy backend
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST"
          PORT="${SSH_PORT:-22}"
          USER="${SSH_USER:-deploy}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/recover
          chmod 600 ~/.ssh/recover
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/recover -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10)
          if ! ssh "${OPTS[@]}" "$USER@$SSH_HOST" true 2>/dev/null; then
            if [ "$USER" != root ] && ssh "${OPTS[@]}" "root@$SSH_HOST" true 2>/dev/null; then
              USER=root
            else
              echo "Could not authenticate to production" >&2
              exit 1
            fi
          fi
          ssh "${OPTS[@]}" "$USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo "Incident task716: checking local Django and HTTPS upstream health"
          echo "Pre-recovery backend / watchdog systemd state:"
          sudo -n systemctl show gravitas-backend.service \
            -p ActiveState -p SubState -p Result -p ExecMainStatus \
            -p ActiveEnterTimestamp -p InactiveEnterTimestamp -p NRestarts --no-pager
          sudo -n systemctl show gravitas-backend-health-watch.timer \
            -p ActiveState -p SubState -p NextElapseUSecRealtime --no-pager || true
          echo "Sanitized backend lifecycle journal counters from last 45m:"
          sudo -n journalctl -u gravitas-backend.service --since '45 minutes ago' --no-pager -o cat |
            python3 -c 'import sys,collections; needles=("stopping","stopped","starting","started","exited","sigterm","sigkill","worker timeout","worker failed","shutting down","handling signal","oom","out of memory","reloading","shutdown","failed"); c=collections.Counter(); [c.update([n for n in needles if n in line.lower()]) for line in sys.stdin]; print(dict(c))'
          echo "Sanitized health-watch journal counters from last 45m:"
          sudo -n journalctl -u gravitas-backend-health-watch.service --since '45 minutes ago' --no-pager -o cat |
            python3 -c 'import sys,collections; needles=("stopping","stopped","starting","started","failed","restart","recovery","timeout","inactive","active"); c=collections.Counter(); [c.update([n for n in needles if n in line.lower()]) for line in sys.stdin]; print(dict(c))'
          # Install a host-local watchdog: GitHub scheduled workflows are not
          # guaranteed to run on time, so production must self-heal on host.
          # The checkpoint owns a private flock while deliberately pausing
          # writers; never interrupt that consistency boundary.
          sudo -n tee /usr/local/sbin/gravitas-backend-health-watch >/dev/null <<'WATCH'
          #!/usr/bin/env bash
          set -euo pipefail
          checkpoint_busy() {
            local lock=/var/backups/gravitas-canonical/operation.lock
            if [ -f "$lock" ]; then
              ( flock -n 9 ) 9<"$lock" || return 0
            fi
            return 1
          }
          local_ok() {
            curl -fsS --max-time 5 -H 'X-Forwarded-Proto: https' \
              http://127.0.0.1:8000/api/health/ 2>/dev/null | grep -q '"status": "ok"'
          }
          proxy_ok() {
            curl -fsS --max-time 7 --resolve graviquest.com:443:127.0.0.1 \
              https://graviquest.com/api/health/ 2>/dev/null | grep -q '"status": "ok"'
          }
          if checkpoint_busy; then exit 0; fi
          if local_ok && proxy_ok; then exit 0; fi
          sleep 15
          if checkpoint_busy; then exit 0; fi
          if local_ok && proxy_ok; then exit 0; fi
          if ! local_ok; then
            logger -t gravitas-health-watch 'Repeated backend health failure; restarting Gunicorn service'
            systemctl reset-failed gravitas-backend.service || true
            systemctl restart gravitas-backend.service
          else
            logger -t gravitas-health-watch 'Backend healthy but reverse proxy failed; validating/reloading Nginx'
            nginx -t >/dev/null
            systemctl reload nginx.service
          fi
          if ! local_ok || ! proxy_ok; then
            logger -t gravitas-health-watch 'Health still failed after bounded recovery'
            exit 1
          fi
          logger -t gravitas-health-watch 'Healthy after guarded recovery'
          WATCH
          sudo -n chmod 750 /usr/local/sbin/gravitas-backend-health-watch
          sudo -n tee /etc/systemd/system/gravitas-backend-health-watch.service >/dev/null <<'UNIT'
          [Unit]
          Description=Check and conditionally recover GraviQuest backend health
          After=network-online.target nginx.service
          [Service]
          Type=oneshot
          User=root
          ExecStart=/usr/local/sbin/gravitas-backend-health-watch
          TimeoutStartSec=75
          UNIT
          sudo -n tee /etc/systemd/system/gravitas-backend-health-watch.timer >/dev/null <<'TIMER'
          [Unit]
          Description=GraviQuest backend health checks every two minutes
          [Timer]
          OnCalendar=*:0/2
          RandomizedDelaySec=5
          AccuracySec=10s
          Persistent=true
          Unit=gravitas-backend-health-watch.service
          [Install]
          WantedBy=timers.target
          TIMER
          sudo -n systemctl daemon-reload
          sudo -n systemctl enable --now gravitas-backend-health-watch.timer
          sudo -n systemctl is-active --quiet gravitas-backend-health-watch.timer
          echo "Host-local backend health watchdog installed and active"
          # The last fully verified frontend/backend deployment is #1172.
          # Seed the version marker once for safe future static-only deploys.
          if ! sudo -n test -s /etc/gravitas/last-successful-deploy-sha; then
            printf '%s\n' '1bea09c3d121baa391409f10578b179508ab3bac' | \
              sudo -n tee /etc/gravitas/last-successful-deploy-sha >/dev/null
            sudo -n chmod 644 /etc/gravitas/last-successful-deploy-sha
            echo 'Initialized deployed revision marker to verified production #1172'
          fi
          local_ok() {
            curl --silent --show-error --fail --max-time 5 \
              -H "X-Forwarded-Proto: https" http://127.0.0.1:8000/api/health/ \
              2>/dev/null | grep -q '"status": "ok"'
          }
          proxy_ok() {
            curl --silent --show-error --fail --max-time 8 \
              --resolve graviquest.com:443:127.0.0.1 \
              https://graviquest.com/api/health/ 2>/dev/null | grep -q '"status": "ok"'
          }
          if sudo -n systemctl is-active --quiet gravitas-backend.service \
             && local_ok && proxy_ok; then
            echo "Backend and HTTPS upstream already healthy; no restart needed"
            exit 0
          fi
          # A single slow health probe should not restart healthy workers.
          sleep 4
          if sudo -n systemctl is-active --quiet gravitas-backend.service \
             && local_ok && proxy_ok; then
            echo "Transient health failure cleared; backend left untouched"
            exit 0
          fi
          # Checkpoint backup holds this lock while writers are deliberately
          # paused. Never bring Gunicorn back during an atomic native snapshot.
          if sudo -n test -f /var/backups/gravitas-canonical/operation.lock && \
             ! sudo -n flock -n /var/backups/gravitas-canonical/operation.lock true; then
            echo "Native checkpoint in progress; defer recovery until snapshot resumes writers."
            exit 0
          fi
          echo "Repeated unhealthy backend or proxy detected; applying bounded recovery"
          sudo -n systemctl show gravitas-backend.service \
            -p ActiveState -p SubState -p NRestarts -p MainPID --no-pager
          sudo -n systemctl reset-failed gravitas-backend.service || true
          sudo -n systemctl restart gravitas-backend.service
          sudo -n systemctl enable gravitas-backend.service >/dev/null
          sudo -n systemctl is-active --quiet gravitas-backend.service
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --silent --show-error --fail --max-time 5 -H "X-Forwarded-Proto: https" \
                 http://127.0.0.1:8000/api/health/ 2>/dev/null | grep -q '"status": "ok"'; then
              break
            fi
            if [ "$attempt" = 8 ]; then
              echo "Backend health remains unavailable" >&2
              exit 1
            fi
            sleep 3
          done
          if ! proxy_ok; then
            echo "Backend local health is OK but HTTPS upstream is unhealthy"
            sudo -n nginx -t
            sudo -n systemctl reload nginx.service
            if ! proxy_ok; then
              echo "Nginx end-to-end health failed after reload" >&2
              exit 1
            fi
          fi
          echo "Backend systemd active, localhost Django and Nginx HTTPS health both OK"
          REMOTE
