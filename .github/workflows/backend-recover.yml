name: Recover GraviQuest Backend Health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-recover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Separate recovery from deployment's queued jobs. Deployment protects
  # its checkpoint; recovery runs only when explicitly invoked by this file.
  group: gravitas-backend-health-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: SSH into production and recover unhealthy backend
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST"
          PORT="${SSH_PORT:-22}"
          USER="${SSH_USER:-deploy}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/recover
          chmod 600 ~/.ssh/recover
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/recover -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10)
          if ! ssh "${OPTS[@]}" "$USER@$SSH_HOST" true 2>/dev/null; then
            if [ "$USER" != root ] && ssh "${OPTS[@]}" "root@$SSH_HOST" true 2>/dev/null; then
              USER=root
            else
              echo "Could not authenticate to production" >&2
              exit 1
            fi
          fi
          ssh "${OPTS[@]}" "$USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo "Checking production backend service"
          sudo -n systemctl daemon-reload
          if ! sudo -n systemctl is-active --quiet gravitas-backend.service; then
            echo "Backend inactive: starting service"
            sudo -n systemctl reset-failed gravitas-backend.service || true
            sudo -n systemctl start gravitas-backend.service
          fi
          sudo -n systemctl enable gravitas-backend.service >/dev/null
          sudo -n systemctl is-active --quiet gravitas-backend.service
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --silent --show-error --fail --max-time 5 -H "X-Forwarded-Proto: https" \
                 http://127.0.0.1:8000/api/health/ 2>/dev/null | grep -q '"status": "ok"'; then
              break
            fi
            if [ "$attempt" = 8 ]; then
              echo "Backend health remains unavailable" >&2
              exit 1
            fi
            sleep 3
          done
          if ! curl --silent --show-error --fail --max-time 10 \
            --resolve graviquest.com:443:127.0.0.1 \
            https://graviquest.com/api/health/ | grep -q '"status": "ok"'; then
            echo "Nginx end-to-end health failed" >&2
            exit 1
          fi
          echo "Backend systemd active, localhost Django and Nginx HTTPS health both OK"
          REMOTE

  pulsar-preview-hotfix:
    name: Pulsar report-preview ID hotfix with rollback
    needs: recover
    if: >-
      ${{ github.repository == 'hsdarestani/gravitas' && github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[apply-pulsar-preview-hotfix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: gravitas-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply one reporting module
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE=d8d083667cbe3f4a6accf173c5489f7d0e5d81a2
          FILE=telegram_work_reports.py
          git fetch --no-tags --depth=1 origin "$BASE"
          git show "$BASE:backend/core/$FILE" > "$RUNNER_TEMP/old-$FILE"
          python3 -m py_compile "backend/core/$FILE"
          OLD="$(sha256sum "$RUNNER_TEMP/old-$FILE" | cut -d' ' -f1)"
          NEW="$(sha256sum "backend/core/$FILE" | cut -d' ' -f1)"
          test -n "$SSH_KEY" && test -n "$SSH_HOST" && test "$OLD" != "$NEW"
          PORT="$SSH_PORT"; [ -n "$PORT" ] || PORT=22
          LOGIN="$SSH_USER"; [ -n "$LOGIN" ] || LOGIN=deploy
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/pulsar_preview
          chmod 600 ~/.ssh/pulsar_preview
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          if ! ssh -i ~/.ssh/pulsar_preview -p "$PORT" -o BatchMode=yes "$LOGIN@$SSH_HOST" 'sudo -n true' 2>/dev/null; then
            if ssh -i ~/.ssh/pulsar_preview -p "$PORT" -o BatchMode=yes "root@$SSH_HOST" true 2>/dev/null; then
              LOGIN=root
            else
              echo "::error::SSH/sudo denied before any changes"
              exit 1
            fi
          fi
          STAGE="/tmp/gravitas-report-preview-$GITHUB_RUN_ID"
          ssh -i ~/.ssh/pulsar_preview -p "$PORT" -o BatchMode=yes "$LOGIN@$SSH_HOST" "install -d -m 700 '$STAGE'"
          scp -i ~/.ssh/pulsar_preview -P "$PORT" -o BatchMode=yes \
            "backend/core/$FILE" "$LOGIN@$SSH_HOST:$STAGE/$FILE"
          ssh -i ~/.ssh/pulsar_preview -p "$PORT" -o BatchMode=yes "$LOGIN@$SSH_HOST" \
            "sudo -n bash -se -- '$GITHUB_RUN_ID' '$OLD' '$NEW'" <<'REMOTE'
          set -Eeuo pipefail
          RUN="$1"; OLD="$2"; NEW="$3"
          DIR=/opt/gravitas-backend/core
          FILE=telegram_work_reports.py
          PY=/opt/gravitas-backend/.venv/bin/python
          STAGE="/tmp/gravitas-report-preview-$RUN"
          BACKUP="/var/backups/gravitas/pulsar-preview-$RUN"
          test -x "$PY" && test -f "$DIR/$FILE" && test -f "$STAGE/$FILE"
          systemctl is-active --quiet gravitas-backend.service
          curl -fsS --max-time 8 -H "X-Forwarded-Proto: https" http://127.0.0.1:8000/api/health/ |
            grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'
          if [ "$(sha256sum "$DIR/$FILE" | cut -d' ' -f1)" != "$OLD" ]; then
            echo "::error::Live report module does not match verified baseline; no changes."
            exit 1
          fi
          test "$(sha256sum "$STAGE/$FILE" | cut -d' ' -f1)" = "$NEW"
          install -d -m 700 "$BACKUP"
          cp -a "$DIR/$FILE" "$BACKUP/$FILE"
          modified=0
          rollback() {
            result=$?
            trap - ERR
            if [ "$modified" = 1 ]; then
              cp -a "$BACKUP/$FILE" "$DIR/$FILE"
              systemctl reload gravitas-backend.service || true
              echo "::warning::Pulsar preview module restored after failed hotfix"
            fi
            exit "$result"
          }
          trap rollback ERR
          install -o "$(stat -c %u "$DIR/$FILE")" -g "$(stat -c %g "$DIR/$FILE")" \
            -m "$(stat -c %a "$DIR/$FILE")" "$STAGE/$FILE" "$DIR/$FILE.new-$RUN"
          modified=1
          mv -f "$DIR/$FILE.new-$RUN" "$DIR/$FILE"
          "$PY" -m py_compile "$DIR/$FILE"
          (
            set -a
            . /etc/gravitas/backend.env
            set +a
            export PYTHONPATH=/opt/gravitas-backend
            export DJANGO_SETTINGS_MODULE=gravitas_backend.settings
            "$PY" -m django check
            "$PY" -c "import django; django.setup(); from core.telegram_work_reports import preview,handle_report_message; assert callable(preview) and callable(handle_report_message); print('PULSAR_REPORT_PREVIEW_IMPORT_OK')"
          )
          systemctl reload gravitas-backend.service
          healthy=0
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 8 -H "X-Forwarded-Proto: https" http://127.0.0.1:8000/api/health/ |
               grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              healthy=1; break
            fi
            sleep 2
          done
          test "$healthy" = 1
          curl -fsS --max-time 12 --resolve graviquest.com:443:127.0.0.1 https://graviquest.com/api/health/ |
            grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'
          test "$(sha256sum "$DIR/$FILE" | cut -d' ' -f1)" = "$NEW"
          trap - ERR
          rm -rf -- "$STAGE"
          echo "PULSAR_REPORT_PREVIEW_HOTFIX_APPLIED; backup=$BACKUP"
          REMOTE
