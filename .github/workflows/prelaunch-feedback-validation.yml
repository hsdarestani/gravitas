name: Prelaunch Feedback Validation

on:
  pull_request:
    paths:
      - 'prelaunch-feedback.html'
      - 'assets/prelaunch-feedback.*'
      - 'assets/ws/ws-prelaunch-feedback.*'
      - 'assets/ws/ws-five-layer.js'
      - 'assets/ws/ws-admin.js'
      - 'assets/ws/ws-app.js'
      - 'workspace.html'
      - 'backend/core/models.py'
      - 'backend/core/prelaunch_feedback_api.py'
      - 'backend/core/urls.py'
      - 'backend/core/migrations/0106_prelaunch_feedback.py'
      - 'backend/core/test_prelaunch_feedback.py'
      - 'privacy.html'
      - 'scripts/test-prelaunch-feedback-browser.cjs'
      - '.github/workflows/prelaunch-feedback-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      DJANGO_SETTINGS_MODULE: gravitas_backend.test_settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -q -r backend/requirements.txt
      - name: Test anonymous feedback, CSRF, access, export
        run: python -m django test core.test_prelaunch_feedback --noinput
      - name: Verify migration model matches schema
        run: python -m django makemigrations core --check --dry-run
      - name: Validate page and admin JavaScript
        run: |
          node --input-type=module --check < assets/prelaunch-feedback.js
          node --input-type=module --check < assets/prelaunch-feedback-schema.js
          node --input-type=module --check < assets/ws/ws-prelaunch-feedback.js
          node --input-type=module --check < assets/ws/ws-five-layer.js
          node --input-type=module --check < assets/ws/ws-admin.js
      - name: Browser QA at 340, 390, 768 and 1363 pixels
        run: |
          npm install --prefix "$RUNNER_TEMP/gq-prelaunch-browser" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          NODE_PATH="$RUNNER_TEMP/gq-prelaunch-browser/node_modules" node scripts/test-prelaunch-feedback-browser.cjs
      - name: Verify all question categories and optional submission contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('prelaunch-feedback.html').read_text()
          schema = Path('assets/prelaunch-feedback-schema.js').read_text()
          backend = Path('backend/core/prelaunch_feedback_api.py').read_text()
          assert 'No sign-in required' in page
          assert ' required=' not in page and ' required>' not in page and ' required/>' not in page
          assert 'type="module" src="/assets/prelaunch-feedback.js' in page
          for letter in 'ABCDEFGHI':
              assert "letter:'" + letter + "'" in schema
          for key in ('site_works', 'goals_clear', 'findability',
                      'visual_attractiveness', 'video_watched',
                      'community_visited', 'return_likelihood',
                      'recommend_likelihood', 'one_change', 'contact_email'):
              assert "key:'" + key + "'" in schema
              assert "'" + key + "'" in backend
          print('A–I survey and optional anonymous submission contract verified.')
          PY
