name: Gravitas HQ V1 Validation

on:
  push:
    branches: [hq-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gravitas_hq_ci
          POSTGRES_USER: gravitas_hq_ci
          POSTGRES_PASSWORD: gravitas_hq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gravitas_hq_ci -d gravitas_hq_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: hq-ci-only
      DJANGO_DEBUG: '0'
      DJANGO_SETTINGS_MODULE: gravitas_backend.settings
      PYTHONPATH: backend
      DJANGO_DB_NAME: gravitas_hq_ci
      DJANGO_DB_USER: gravitas_hq_ci
      DJANGO_DB_PASSWORD: gravitas_hq_ci
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: '5432'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -q -r backend/requirements.txt
      - name: Generate HQ migration when needed
        run: django-admin makemigrations hq --noinput
      - name: Commit generated HQ migrations
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/hq/migrations; then
            echo 'HQ migrations already current.'
          else
            git config user.name 'Gravitas HQ CI'
            git config user.email 'actions@users.noreply.github.com'
            git add backend/hq/migrations
            git commit -m 'Version Gravitas HQ schema'
            git push origin HEAD:hq-v1
          fi
      - name: Apply database migrations
        run: django-admin migrate --noinput
      - name: Check migration drift
        run: django-admin makemigrations --check --dry-run --noinput
      - name: Validate Django configuration
        run: django-admin check
      - name: Collect static assets
        run: django-admin collectstatic --noinput
      - name: Smoke-test HQ access and pages
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.contrib.auth import get_user_model
          from django.test import Client
          from hq.models import Project, StrategyDocument

          User = get_user_model()
          admin = User.objects.create_superuser('hq-ci-admin', 'hq-ci@example.com', 'temporary-ci-password')
          client = Client(HTTP_HOST='testserver')
          client.force_login(admin)
          for path in ['/hq/', '/hq/strategy/', '/hq/projects/', '/hq/content/', '/hq/research/', '/hq/assets/', '/hq/team/']:
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code)
          StrategyDocument.objects.create(title='HQ Roadmap test', slug='hq-roadmap-test', kind='roadmap', status='active')
          Project.objects.create(name='HQ Project test', slug='hq-project-test', kind='product', status='active')
          assert client.get('/hq/').status_code == 200
          print('hq-v1-smoke-passed')
          PY
