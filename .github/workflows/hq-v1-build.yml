name: Gravitas HQ V1 Validation

on:
  push:
    branches: [hq-v1]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gravitas-hq-v1
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gravitas_hq_ci
          POSTGRES_USER: gravitas_hq_ci
          POSTGRES_PASSWORD: gravitas_hq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gravitas_hq_ci -d gravitas_hq_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: hq-ci-only
      DJANGO_DEBUG: '0'
      DJANGO_SETTINGS_MODULE: gravitas_backend.settings
      PYTHONPATH: backend
      DJANGO_DB_NAME: gravitas_hq_ci
      DJANGO_DB_USER: gravitas_hq_ci
      DJANGO_DB_PASSWORD: gravitas_hq_ci
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: '5432'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -q -r backend/requirements.txt
      - name: Generate HQ migration when needed
        run: django-admin makemigrations hq --noinput
      - name: Commit generated HQ migrations
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- backend/hq/migrations)" ]; then
            echo 'HQ migrations already current.'
          else
            git config user.name 'Gravitas HQ CI'
            git config user.email 'actions@users.noreply.github.com'
            git add 'backend/hq/migrations/*.py'
            git commit -m 'Version Gravitas HQ schema'
            git pull --rebase origin hq-v1
            git push origin HEAD:hq-v1
          fi
      - name: Apply database migrations
        run: django-admin migrate --noinput
      - name: Check migration drift
        run: django-admin makemigrations --check --dry-run --noinput
      - name: Validate Django configuration
        run: django-admin check
      - name: Collect static assets
        run: django-admin collectstatic --noinput
      - name: Create CI founder account
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.contrib.auth import get_user_model
          User = get_user_model()
          User.objects.create_superuser('hq-ci-admin', 'hq-ci@example.com', 'temporary-ci-password')
          print('hq-ci-founder-created')
          PY
      - name: Bootstrap HQ living strategy
        run: django-admin bootstrap_hq
      - name: Smoke-test HQ, RBAC and workflow pages
        run: |
          python - <<'PY'
          import django
          django.setup()

          from django.contrib.auth import get_user_model
          from django.test import Client
          from hq.models import ContentProduction, Project, SectionAccess, StrategyDocument, Task, TeamMember

          User = get_user_model()
          admin = User.objects.get(username='hq-ci-admin')
          founder = admin.hq_member
          assert founder.section_access.filter(level=SectionAccess.Level.MANAGE).count() == len(SectionAccess.Section.choices)
          assert StrategyDocument.objects.filter(slug='gravitas-strategy-roadmap', status='active').exists()
          assert Project.objects.filter(slug='gravitas-hq-v1').exists()
          episode = Project.objects.get(slug='episode-01-ai-scientific-hypothesis')
          production = ContentProduction.objects.get(project=episode)

          anonymous = Client(HTTP_HOST='testserver')
          response = anonymous.get('/hq/')
          assert response.status_code == 302 and '/hq/login/' in response.url
          assert anonymous.get('/hq/login/').status_code == 200

          client = Client(HTTP_HOST='testserver')
          client.force_login(admin)
          for path in ['/hq/', '/hq/strategy/', '/hq/projects/', '/hq/content/', '/hq/research/', '/hq/assets/', '/hq/team/']:
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code)

          Task.objects.create(project=episode, title='HQ CI editorial task', status=Task.Status.TODO, priority=Task.Priority.HIGH, assignee=founder)
          response = client.get(f'/hq/projects/{episode.slug}/')
          assert response.status_code == 200, response.status_code
          response = client.get(f'/hq/content/{production.pk}/')
          assert response.status_code == 200, response.status_code

          limited_user = User.objects.create_user(username='hq-limited', email='hq-limited@example.com', password='temporary-ci-password')
          limited_member = TeamMember.objects.create(user=limited_user, role_label='Video Editor')
          SectionAccess.objects.create(member=limited_member, section=SectionAccess.Section.DASHBOARD, level=SectionAccess.Level.VIEW)
          SectionAccess.objects.create(member=limited_member, section=SectionAccess.Section.PROJECTS, level=SectionAccess.Level.VIEW)
          limited = Client(HTTP_HOST='testserver')
          limited.force_login(limited_user)
          assert limited.get('/hq/').status_code == 200
          project_response = limited.get('/hq/projects/')
          assert project_response.status_code == 200
          assert limited.get('/hq/strategy/').status_code == 403
          assert not project_response.context['projects'].exists()

          print('hq-v1-rbac-workflow-smoke-passed')
          PY
