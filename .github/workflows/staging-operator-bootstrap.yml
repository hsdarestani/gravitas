name: GraviQuest Install Staging Operator
on:
  push:
    branches: [ops/staging-parity-host-evidence]
    paths:
      - .github/workflows/staging-operator-bootstrap.yml
      - ops/staging/install-operator.sh
permissions:
  contents: read
concurrency:
  group: gravitas-workspace-staging
  cancel-in-progress: false
jobs:
  evidence:
    if: github.repository == 'hsdarestani/gravitas' && github.actor == 'hsdarestani'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install the restricted staging-only operator without admitting a key
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          bash -n ops/staging/install-operator.sh
          bash -n ops/staging/release.sh
          test -n "$SSH_HOST" && test -n "$SSH_KEY"
          port="${SSH_PORT:-22}"
          login="${SSH_USER:-deploy}"
          umask 077
          credentials=$(mktemp -d)
          trap 'rm -rf "$credentials"' EXIT
          printf '%s\n' "$SSH_KEY" > "$credentials/key"
          ssh-keyscan -T 5 -p "$port" -H "$SSH_HOST" > "$credentials/known_hosts" 2>/dev/null
          unset SSH_KEY
          opts=(-i "$credentials/key" -p "$port" -o UserKnownHostsFile="$credentials/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10)
          if ! ssh "${opts[@]}" "$login@$SSH_HOST" true 2>/dev/null; then login=root; fi
          command='bash -c'
          if [ "$login" != root ]; then command='sudo -n bash -c'; fi
          remote=$(cat <<'REMOTE'
          set -euo pipefail
          umask 077
          source=$(mktemp -d)
          trap 'rm -rf -- "$source"' EXIT
          tar -xf - -C "$source"
          "$source/install-operator.sh"
          unit=gravitas-workspace-staging.service
          root=$(systemctl show "$unit" -p WorkingDirectory --value)
          [[ "$root" =~ ^/opt/gravitas-workspace-staging/releases/([a-f0-9]{40})/source/backend$ ]]
          revision=${BASH_REMATCH[1]}
          runuser -u gq-stage-deploy -- env SSH_ORIGINAL_COMMAND="inspect $revision $revision 1 verified-stage" /usr/local/lib/gravitas-staging/ssh-command
          if runuser -u gq-stage-deploy -- env SSH_ORIGINAL_COMMAND="shell $revision $revision 1 denied" /usr/local/lib/gravitas-staging/ssh-command; then
            echo 'A non-staging command bypassed the dispatcher.' >&2
            exit 1
          fi
          curl --noproxy '*' -fsS --max-time 8 --resolve graviquest.com:443:127.0.0.1 https://graviquest.com/api/health/ | grep -q '"database": "ok"'
          echo "Staging inspect succeeded and a non-staging command was denied."
          REMOTE
          )
          quoted=$(python3 -c 'import shlex,sys; print(shlex.quote(sys.argv[1]))' "$remote")
          archive=(install-operator.sh release.sh ssh-command check_target.py public_pages.py site_config.py)
          tar -c -C ops/staging "${archive[@]}" | ssh "${opts[@]}" "$login@$SSH_HOST" "$command $quoted"
