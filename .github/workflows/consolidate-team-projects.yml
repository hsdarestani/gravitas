name: Consolidate Reviewed Team Projects & Materials
on:
  push:
    branches: [codex/team-task-reconciliation-20261015]
    paths: ['ops/portfolio-plan.encrypted.json', 'ops/portfolio_reconciliation.py', '.github/workflows/consolidate-team-projects.yml']
concurrency:
  group: gravitas-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Activate canonical destinations, then consolidate reviewed task trees
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST"
          PORT="${SSH_PORT:-22}"
          REMOTE_USER="${SSH_USER:-deploy}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/reconciliation
          chmod 600 ~/.ssh/reconciliation
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/reconciliation -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          if ! ssh "${OPTS[@]}" "$REMOTE_USER@$SSH_HOST" true 2>/dev/null; then
            if [ "$REMOTE_USER" != root ] && ssh "${OPTS[@]}" "root@$SSH_HOST" true 2>/dev/null; then
              REMOTE_USER=root
            else
              echo 'Production SSH authentication failed' >&2
              exit 1
            fi
          fi
          ROOT=/var/lib/gravitas-source-migrations/team-docs-20261015-v1
          STEM="/tmp/graviquest-approved-$GITHUB_RUN_ID"
          scp -i ~/.ssh/reconciliation -P "$PORT" ops/reconciliation_transport.py "$REMOTE_USER@$SSH_HOST:$STEM-transport.py"
          scp -i ~/.ssh/reconciliation -P "$PORT" ops/portfolio_reconciliation.py "$REMOTE_USER@$SSH_HOST:$STEM-apply.py"
          scp -i ~/.ssh/reconciliation -P "$PORT" ops/portfolio-plan.encrypted.json "$REMOTE_USER@$SSH_HOST:$STEM-envelope.json"
          ssh "${OPTS[@]}" "$REMOTE_USER@$SSH_HOST" "bash -s -- '$STEM' '$ROOT'" <<'REMOTE'
          set -euo pipefail
          STEM="$1"
          ROOT="$2"
          test -f /opt/gravitas-backend/core/migrations/0067_historical_source_tasks_without_fake_deadlines.py
          SECRET="$(sudo awk -F= '/^DJANGO_SECRET_KEY=/{print $2}' /etc/gravitas/backend.env)"
          cd /opt/gravitas-backend
          sudo -u gravitas env DJANGO_SECRET_KEY="$SECRET" DJANGO_DEBUG=0 DJANGO_SETTINGS_MODULE=gravitas_backend.settings .venv/bin/python -m django migrate --check
          if ! sudo test -f "$ROOT/portfolio-plan.json"; then
            sudo -u gravitas .venv/bin/python "$STEM-transport.py" decrypt --envelope "$STEM-envelope.json" --output "$ROOT/portfolio-plan.json"
          fi
          sudo -u gravitas bash -c 'set -a; . /etc/gravitas/backend.env; set +a; export DJANGO_SETTINGS_MODULE=gravitas_backend.settings PYTHONPATH=/opt/gravitas-backend; exec /opt/gravitas-backend/.venv/bin/python "$@"' -- "$STEM-apply.py" --plan "$ROOT/portfolio-plan.json" --expected-sha 1b34c61c4bcba8c9a48f8274039740af568458b468c775e29e9caee5fd08fbe2
          rm -f "$STEM-transport.py" "$STEM-apply.py" "$STEM-envelope.json" "$STEM-notes.py"
          REMOTE
          echo 'Migration completed; retrieve evidence through the encrypted evidence export workflow.'
