name: Import current Gravitas+ site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-current-site.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone current public Gravitas+ site
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/desdevrad/gravitasplus.git /tmp/gravitas-source

      - name: Copy site into production repository
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/gravitas-source/ ./

      - name: Commit imported site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to import."
            exit 0
          fi
          git commit -m "Import current Gravitas+ website"
          git push origin main
