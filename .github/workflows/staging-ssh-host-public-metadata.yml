name: GraviQuest Staging Public SSH Host Metadata
on:
  push:
    branches: [ops/staging-parity-host-evidence]
    paths: [.github/workflows/staging-ssh-host-public-metadata.yml]
permissions:
  contents: read
jobs:
  public-host-key:
    if: github.repository == 'hsdarestani/gravitas' && github.actor == 'hsdarestani'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Compare the configured SSH endpoint to the recorded STRATO console fingerprint
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          if [ "$SSH_HOST" = 82.165.94.28 ]; then echo documented_endpoint_matches=true; else echo documented_endpoint_matches=false; fi
          if [ "$port" = 22 ]; then echo default_ssh_port=true; else echo default_ssh_port=false; fi
          ssh-keyscan -4 -T 7 -t ed25519 -p "$port" "$SSH_HOST" > host-public-key 2>/dev/null || { echo public_key_scan_failed; exit 1; }
          awk '$2 == "ssh-ed25519" {print $2 " " $3}' host-public-key | sort -u > candidates
          printf 'Unique Ed25519 host keys returned: '
          wc -l < candidates
          test "$(wc -l < candidates)" -eq 1
          ssh-keygen -lf candidates | awk '{print "observed_public_key_fingerprint=" $2}'
          ssh-keygen -lf candidates | awk '{print $2}' | grep -Fxq 'SHA256:nMIMs71U9EyJylPdawERsaIKMlihd14LzsSKSXC2wms'
          printf 'verified_public_host_key='
          cat candidates
