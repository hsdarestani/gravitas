name: Gravitas Production Auth E2E

on:
  workflow_run:
    workflows: ["Deploy Gravitas to Strato"]
    types: [completed]

permissions:
  contents: read

jobs:
  auth-e2e:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOMAIN: gravitasplus.com
    steps:
      - name: Verify production account lifecycle over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="auth-e2e-${{ github.run_id }}@example.com"
          PASSWORD='Production-E2E-Password-2026!'
          COOKIE_JAR="$RUNNER_TEMP/gravitas-auth-cookies.txt"
          REFERER="https://$DOMAIN/account.html"

          curl -4 -fsS -c "$COOKIE_JAR" "https://$DOMAIN/api/auth/csrf/" >/dev/null
          CSRF="$(awk '$6=="csrftoken" {print $7}' "$COOKIE_JAR" | tail -n1)"
          test -n "$CSRF"

          SIGNUP="$(curl -4 -fsS -b "$COOKIE_JAR" -c "$COOKIE_JAR" \
            -X POST "https://$DOMAIN/api/auth/signup/" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "X-CSRFToken: $CSRF" \
            -H "Referer: $REFERER" \
            --data "{\"name\":\"Production E2E\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"newsletter\":true}")"
          printf '%s' "$SIGNUP" | grep -q '"ok": true'
          curl -4 -fsS -b "$COOKIE_JAR" "https://$DOMAIN/api/auth/me/" | grep -q '"authenticated": true'

          CSRF="$(awk '$6=="csrftoken" {print $7}' "$COOKIE_JAR" | tail -n1)"
          curl -4 -fsS -b "$COOKIE_JAR" -c "$COOKIE_JAR" \
            -X POST "https://$DOMAIN/api/auth/logout/" \
            -H 'Content-Type: application/json' \
            -H "X-CSRFToken: $CSRF" \
            -H "Referer: $REFERER" \
            --data '{}' >/dev/null
          curl -4 -fsS -b "$COOKIE_JAR" "https://$DOMAIN/api/auth/me/" | grep -q '"authenticated": false'

          rm -f "$COOKIE_JAR"
          curl -4 -fsS -c "$COOKIE_JAR" "https://$DOMAIN/api/auth/csrf/" >/dev/null
          CSRF="$(awk '$6=="csrftoken" {print $7}' "$COOKIE_JAR" | tail -n1)"
          LOGIN="$(curl -4 -fsS -b "$COOKIE_JAR" -c "$COOKIE_JAR" \
            -X POST "https://$DOMAIN/api/auth/login/" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "X-CSRFToken: $CSRF" \
            -H "Referer: $REFERER" \
            --data "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"keep\":true}")"
          printf '%s' "$LOGIN" | grep -q '"ok": true'
          curl -4 -fsS -b "$COOKIE_JAR" "https://$DOMAIN/api/auth/me/" | grep -q '"authenticated": true'
          curl -4 -fsS "https://$DOMAIN/assets/site.js" | grep -q '/api/auth/signup/'
          echo "TEST_EMAIL=$EMAIL" >> "$GITHUB_ENV"

      - name: Remove production auth test data
        if: always() && env.TEST_EMAIL != ''
        shell: bash
        run: |
          set -euo pipefail
          USER="${{ secrets.DEPLOY_USER }}"; [ -n "$USER" ] || USER=deploy
          PORT="${{ secrets.DEPLOY_PORT }}"; [ -n "$PORT" ] || PORT=22
          HOST="${{ secrets.DEPLOY_HOST }}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -p "$PORT" "$USER@$HOST" \
            "sudo -u postgres psql -d gravitas -v ON_ERROR_STOP=1 -c \"DELETE FROM core_newslettersubscriber WHERE email = '$TEST_EMAIL'; DELETE FROM auth_user WHERE email = '$TEST_EMAIL';\"" >/dev/null
