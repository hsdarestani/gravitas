name: One-time local font fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-local-fonts.yml'

permissions:
  contents: write

jobs:
  fix-fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-host exact Gravitas fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/fonts

          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/dmsans/DMSans%5Bopsz%2Cwght%5D.ttf' -o assets/fonts/DMSans.ttf
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/dmsans/DMSans-Italic%5Bopsz%2Cwght%5D.ttf' -o assets/fonts/DMSans-Italic.ttf
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/dmsans/OFL.txt' -o assets/fonts/OFL-DMSans.txt

          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/dmmono/DMMono-Light.ttf' -o assets/fonts/DMMono-Light.ttf
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/dmmono/DMMono-Regular.ttf' -o assets/fonts/DMMono-Regular.ttf
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/dmmono/DMMono-Medium.ttf' -o assets/fonts/DMMono-Medium.ttf
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/dmmono/OFL.txt' -o assets/fonts/OFL-DMMono.txt

          cat > assets/local-fonts.css <<'CSS'
          /* Self-hosted copies of the exact Google Fonts families used by the Gravitas+ design. */
          @font-face {
            font-family: 'DM Sans';
            src: url('fonts/DMSans.ttf') format('truetype');
            font-style: normal;
            font-weight: 100 1000;
            font-display: swap;
          }
          @font-face {
            font-family: 'DM Sans';
            src: url('fonts/DMSans-Italic.ttf') format('truetype');
            font-style: italic;
            font-weight: 100 1000;
            font-display: swap;
          }
          @font-face {
            font-family: 'DM Mono';
            src: url('fonts/DMMono-Light.ttf') format('truetype');
            font-style: normal;
            font-weight: 300;
            font-display: swap;
          }
          @font-face {
            font-family: 'DM Mono';
            src: url('fonts/DMMono-Regular.ttf') format('truetype');
            font-style: normal;
            font-weight: 400;
            font-display: swap;
          }
          @font-face {
            font-family: 'DM Mono';
            src: url('fonts/DMMono-Medium.ttf') format('truetype');
            font-style: normal;
            font-weight: 500;
            font-display: swap;
          }
          CSS

          python3 <<'PY'
          from pathlib import Path
          import re

          local = '<link rel="stylesheet" href="assets/local-fonts.css?v=20260819-local1">'
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              # Remove remote Google Fonts loading so production cannot fall back to Roboto/system
              # because of a blocked or partitioned third-party font request.
              text = re.sub(r'\n?<link rel="preconnect" href="https://fonts\.googleapis\.com">', '', text)
              text = re.sub(r'\n?<link rel="preconnect" href="https://fonts\.gstatic\.com" crossorigin>', '', text)
              text = re.sub(r'\n?<link href="https://fonts\.googleapis\.com/css2\?[^\"]+" rel="stylesheet">', '', text)
              if 'assets/local-fonts.css' not in text:
                  marker = '<link rel="stylesheet" href="assets/gravitas.css'
                  pos = text.find(marker)
                  if pos != -1:
                      text = text[:pos] + local + '\n' + text[pos:]
                  else:
                      text = text.replace('</head>', local + '\n</head>')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit local fonts and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/force-local-fonts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Self-host DM Sans and DM Mono for production parity'
          git push origin HEAD:main
