name: Fix frontend parity after deploy

on:
  workflow_run:
    workflows: ["Deploy Gravitas to Strato"]
    types: [completed]

permissions:
  contents: write

jobs:
  parity:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Permanently align frontend assets and hero stats in repository
        shell: bash
        run: |
          set -euo pipefail
          TOKEN='20260819-parity2'
          find . -maxdepth 1 -type f -name '*.html' -print0 | while IFS= read -r -d '' f; do
            sed -E -i "s#assets/(gravitas|site|hero|chat)\\.(css|js)(\\?v=[^\"']*)?#assets/\\1.\\2?v=${TOKEN}#g" "$f"
          done

          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old = '''        <p class="lp-hero__credit">
          <span>New topic monthly</span>
          <span><span class="g-nums">312K</span> subscribers</span>
          <span><a href="community.html#join">4,100 members</a></span>
        </p>'''
          new = '''        <p class="lp-hero__credit">
          <span>New topic monthly</span>
          <span class="lp-hero__literal-sep" aria-hidden="true">•</span>
          <span><span class="g-nums">312K</span> subscribers</span>
          <span class="lp-hero__literal-sep" aria-hidden="true">•</span>
          <span><a href="community.html#join">4,100 members</a></span>
        </p>'''
          if old in s:
              s = s.replace(old, new, 1)

          marker = 'id="hero-stat-parity"'
          if marker not in s:
              css = '''<style id="hero-stat-parity">
.lp-hero__credit > span + span::before { content: none !important; }
.lp-hero__credit .lp-hero__literal-sep {
  display: inline-flex !important;
  align-items: center;
  width: auto !important;
  height: auto !important;
  color: var(--g-border-strong);
  line-height: 1;
  font-size: .9em;
  flex: none;
}
.lp-hero__credit a {
  text-decoration-line: underline !important;
  text-decoration-color: var(--g-border-strong) !important;
  text-underline-offset: .14em;
}
</style>
'''
              s = s.replace('</head>', css + '</head>', 1)

          p.write_text(s)
          PY

          if git diff --quiet; then
            echo 'Repository frontend already matches parity rules.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.html'
            git commit -m 'Match hero stats and refresh frontend assets'
            git push origin HEAD:main
          fi

      - name: Patch deployed HTML after deploy completes
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          CONFIGURED_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT_SECRET: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          USER="${CONFIGURED_USER:-deploy}"
          PORT="${DEPLOY_PORT_SECRET:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/gravitas_deploy
          chmod 600 ~/.ssh/gravitas_deploy
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          SSH_OPTS=(-i ~/.ssh/gravitas_deploy -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10)
          if ssh "${SSH_OPTS[@]}" "$USER@$DEPLOY_HOST" true 2>/dev/null; then
            EFFECTIVE_USER="$USER"
          elif [ "$USER" != "root" ] && ssh "${SSH_OPTS[@]}" "root@$DEPLOY_HOST" true 2>/dev/null; then
            EFFECTIVE_USER="root"
          else
            echo 'SSH authentication failed.'
            exit 1
          fi
          TOKEN='20260819-parity2'
          ssh "${SSH_OPTS[@]}" "$EFFECTIVE_USER@$DEPLOY_HOST" "TOKEN='$TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /var/www/gravitas
          find . -maxdepth 1 -type f -name '*.html' -print0 | while IFS= read -r -d '' f; do
            sed -E -i "s#assets/(gravitas|site|hero|chat)\\.(css|js)(\\?v=[^\"']*)?#assets/\\1.\\2?v=${TOKEN}#g" "$f"
          done

          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old = '''        <p class="lp-hero__credit">
          <span>New topic monthly</span>
          <span><span class="g-nums">312K</span> subscribers</span>
          <span><a href="community.html#join">4,100 members</a></span>
        </p>'''
          new = '''        <p class="lp-hero__credit">
          <span>New topic monthly</span>
          <span class="lp-hero__literal-sep" aria-hidden="true">•</span>
          <span><span class="g-nums">312K</span> subscribers</span>
          <span class="lp-hero__literal-sep" aria-hidden="true">•</span>
          <span><a href="community.html#join">4,100 members</a></span>
        </p>'''
          if old in s:
              s = s.replace(old, new, 1)

          if 'id="hero-stat-parity"' not in s:
              css = '''<style id="hero-stat-parity">
.lp-hero__credit > span + span::before { content: none !important; }
.lp-hero__credit .lp-hero__literal-sep {
  display: inline-flex !important;
  align-items: center;
  width: auto !important;
  height: auto !important;
  color: var(--g-border-strong);
  line-height: 1;
  font-size: .9em;
  flex: none;
}
.lp-hero__credit a {
  text-decoration-line: underline !important;
  text-decoration-color: var(--g-border-strong) !important;
  text-underline-offset: .14em;
}
</style>
'''
              s = s.replace('</head>', css + '</head>', 1)

          p.write_text(s)
          PY

          grep -q 'assets/hero.css?v=20260819-parity2' index.html
          grep -q 'lp-hero__literal-sep' index.html
          grep -q 'hero-stat-parity' index.html
          echo 'Production hero stats now match reference markup and styling.'
          REMOTE
