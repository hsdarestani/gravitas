name: Legacy frontend parity helper

# Kept only for manual recovery. Frontend synchronization now happens before
# deployment in sync-desdevrad-frontend.yml, so a post-deploy mutator must not
# rewrite Kiarash's freshly synchronized markup or styles.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Frontend parity is handled by sync-desdevrad-frontend.yml before deploy.'
