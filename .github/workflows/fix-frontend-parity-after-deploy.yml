name: Fix frontend parity after deploy

on:
  workflow_run:
    workflows: ["Deploy Gravitas to Strato"]
    types: [completed]

permissions:
  contents: write

jobs:
  parity:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest desdevrad frontend delta safely
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_REPO='desdevrad/gravitasplus'
          FALLBACK_BASE='6e4c285f11be08d77239ad26af744e3b9398beb1'
          UPSTREAM_SHA="$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" refs/heads/main | awk '{print $1}')"
          PREV_SHA="$(cat .upstream-gravitasplus 2>/dev/null || true)"
          [ -n "$PREV_SHA" ] || PREV_SHA="$FALLBACK_BASE"
          test -n "$UPSTREAM_SHA"

          RAW="https://raw.githubusercontent.com/${UPSTREAM_REPO}/${UPSTREAM_SHA}"
          PREV_RAW="https://raw.githubusercontent.com/${UPSTREAM_REPO}/${PREV_SHA}"
          echo "Upstream: ${PREV_SHA} -> ${UPSTREAM_SHA}"

          curl -fsSL "${RAW}/assets/site.css" -o /tmp/new-site.css
          curl -fsSL "${RAW}/assets/site.js"  -o /tmp/new-site.js
          curl -fsSL "${PREV_RAW}/assets/site.css" -o /tmp/base-site.css
          curl -fsSL "${PREV_RAW}/assets/site.js"  -o /tmp/base-site.js

          CUR_CSS="$(git hash-object assets/site.css)"
          CUR_JS="$(git hash-object assets/site.js)"
          BASE_CSS="$(git hash-object /tmp/base-site.css)"
          BASE_JS="$(git hash-object /tmp/base-site.js)"
          NEW_CSS="$(git hash-object /tmp/new-site.css)"
          NEW_JS="$(git hash-object /tmp/new-site.js)"

          if [ "$CUR_CSS" != "$BASE_CSS" ] && [ "$CUR_CSS" != "$NEW_CSS" ]; then
            echo "assets/site.css diverged locally; keeping production copy because the reviewed parity layer is active."
          else
            cp /tmp/new-site.css assets/site.css
          fi
          if [ "$CUR_JS" != "$BASE_JS" ] && [ "$CUR_JS" != "$NEW_JS" ]; then
            echo "assets/site.js diverged locally; keeping production copy because the reviewed parity bridge is active."
          else
            cp /tmp/new-site.js assets/site.js
          fi

          mkdir -p assets/thumbnails
          python3 - "$UPSTREAM_REPO" "$UPSTREAM_SHA" <<'PY'
          import json, pathlib, sys, urllib.request
          repo, sha = sys.argv[1:]
          api = f'https://api.github.com/repos/{repo}/contents/assets/thumbnails?ref={sha}'
          req = urllib.request.Request(api, headers={
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'gravitas-production-sync',
          })
          try:
              with urllib.request.urlopen(req) as response:
                  items = json.load(response)
          except Exception as exc:
              print('thumbnail listing unavailable:', exc)
              items = []
          out = pathlib.Path('assets/thumbnails')
          for item in items:
              if item.get('type') != 'file':
                  continue
              name = item.get('name', '')
              if pathlib.Path(name).suffix.lower() not in {'.webp', '.jpg', '.jpeg', '.png'}:
                  continue
              url = item.get('download_url')
              if not url:
                  continue
              print('thumbnail:', name)
              urllib.request.urlretrieve(url, out / name)
          PY

          printf '%s\n' "$UPSTREAM_SHA" > .upstream-gravitasplus

      - name: Refresh asset URLs and preserve hero parity
        shell: bash
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TOKEN="${DEPLOYED_SHA:-$(git rev-parse HEAD)}"
          TOKEN="rev-${TOKEN:0:12}"

          find . -maxdepth 1 -type f -name '*.html' -print0 | while IFS= read -r -d '' f; do
            sed -E -i "s#assets/(gravitas|site|hero|chat|production-bridge)\\.(css|js)(\\?v=[^\"']*)?#assets/\\1.\\2?v=${TOKEN}#g" "$f"
          done

          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          old = '''        <p class="lp-hero__credit">
          <span>New topic monthly</span>
          <span><span class="g-nums">312K</span> subscribers</span>
          <span><a href="community.html#join">4,100 members</a></span>
        </p>'''
          new = '''        <p class="lp-hero__credit">
          <span>New topic monthly</span>
          <span class="lp-hero__literal-sep" aria-hidden="true">•</span>
          <span><span class="g-nums">312K</span> subscribers</span>
          <span class="lp-hero__literal-sep" aria-hidden="true">•</span>
          <span><a href="community.html#join">4,100 members</a></span>
        </p>'''
          if old in s:
              s = s.replace(old, new, 1)

          if 'id="hero-stat-parity"' not in s:
              css = '''<style id="hero-stat-parity">
.lp-hero__credit > span + span::before { content: none !important; }
.lp-hero__credit .lp-hero__literal-sep {
  display: inline-flex !important;
  align-items: center;
  width: auto !important;
  height: auto !important;
  color: var(--g-border-strong);
  line-height: 1;
  font-size: .9em;
  flex: none;
}
.lp-hero__credit a {
  text-decoration-line: underline !important;
  text-decoration-color: var(--g-border-strong) !important;
  text-underline-offset: .14em;
}
</style>
'''
              s = s.replace('</head>', css + '</head>', 1)

          p.write_text(s)
          PY

          echo "CACHE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Commit synchronized frontend to main
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo 'Repository already synchronized.'
            exit 0
          fi
          git config user.name 'Hossein Darestani'
          git config user.email '45485005+hsdarestani@users.noreply.github.com'
          git add -- '*.html' assets/site.css assets/site.js assets/thumbnails .upstream-gravitasplus
          git commit -m "Sync frontend from desdevrad/gravitasplus $(cat .upstream-gravitasplus | cut -c1-12)"
          git push origin HEAD:main

      - name: Patch synchronized frontend on production server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          CONFIGURED_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT_SECRET: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          USER="${CONFIGURED_USER:-deploy}"
          PORT="${DEPLOY_PORT_SECRET:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/gravitas_deploy
          chmod 600 ~/.ssh/gravitas_deploy
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          SSH_OPTS=(-i ~/.ssh/gravitas_deploy -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10)

          if ssh "${SSH_OPTS[@]}" "$USER@$DEPLOY_HOST" true 2>/dev/null; then
            EFFECTIVE_USER="$USER"
          elif [ "$USER" != "root" ] && ssh "${SSH_OPTS[@]}" "root@$DEPLOY_HOST" true 2>/dev/null; then
            EFFECTIVE_USER="root"
          else
            echo 'SSH authentication failed.'
            exit 1
          fi

          ssh "${SSH_OPTS[@]}" "$EFFECTIVE_USER@$DEPLOY_HOST" 'mkdir -p /var/www/gravitas/assets/thumbnails'
          rsync -az -e "ssh -i ~/.ssh/gravitas_deploy -p $PORT" -- *.html "$EFFECTIVE_USER@$DEPLOY_HOST:/var/www/gravitas/"
          rsync -az -e "ssh -i ~/.ssh/gravitas_deploy -p $PORT" \
            assets/site.css assets/site.js assets/production-bridge.js assets/upstream-4cb9c0.css assets/brand.js \
            "$EFFECTIVE_USER@$DEPLOY_HOST:/var/www/gravitas/assets/"
          rsync -az -e "ssh -i ~/.ssh/gravitas_deploy -p $PORT" assets/thumbnails/ "$EFFECTIVE_USER@$DEPLOY_HOST:/var/www/gravitas/assets/thumbnails/"

          ssh "${SSH_OPTS[@]}" "$EFFECTIVE_USER@$DEPLOY_HOST" \
            "grep -q 'assets/site.css?v=${CACHE_TOKEN}' /var/www/gravitas/index.html && \
             grep -q 'assets/production-bridge.js?v=${CACHE_TOKEN}' /var/www/gravitas/index.html && \
             test -f /var/www/gravitas/assets/upstream-4cb9c0.css"

          echo "Production frontend synchronized with upstream and cache-busted as ${CACHE_TOKEN}."
