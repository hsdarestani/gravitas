name: GraviQuest Activate Staging Public Routes
on:
  push:
    branches: [ops/staging-parity-host-evidence]
    paths:
      - .github/workflows/staging-public-routes-activation.yml
      - ops/staging/expose-public-pages.sh
      - ops/staging/public_pages.py
permissions:
  contents: read
concurrency:
  group: gravitas-workspace-staging
  cancel-in-progress: false
jobs:
  evidence:
    if: github.repository == 'hsdarestani/gravitas' && github.actor == 'hsdarestani'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Add public paths and keep the exact current Workspace V2 QA revision
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          bash -n ops/staging/expose-public-pages.sh
          test -n "$SSH_HOST" && test -n "$SSH_KEY"
          port="${SSH_PORT:-22}"
          login="${SSH_USER:-deploy}"
          umask 077
          credentials=$(mktemp -d)
          trap 'rm -rf "$credentials"' EXIT
          printf '%s\n' "$SSH_KEY" > "$credentials/key"
          ssh-keyscan -T 5 -p "$port" -H "$SSH_HOST" > "$credentials/known_hosts" 2>/dev/null
          unset SSH_KEY
          opts=(-i "$credentials/key" -p "$port" -o UserKnownHostsFile="$credentials/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10)
          if ! ssh "${opts[@]}" "$login@$SSH_HOST" true 2>/dev/null; then login=root; fi
          command='bash -c'
          if [ "$login" != root ]; then command='sudo -n bash -c'; fi
          remote=$(cat <<'REMOTE'
          set -euo pipefail
          umask 077
          source=$(mktemp -d)
          trap 'rm -rf -- "$source"' EXIT
          tar -xf - -C "$source"
          "$source/expose-public-pages.sh" c98c7ac358ae2869aa739751ab894f055cc56efa
          REMOTE
          )
          quoted=$(python3 -c 'import shlex,sys; print(shlex.quote(sys.argv[1]))' "$remote")
          archive=(expose-public-pages.sh public_pages.py site_config.py)
          tar -c -C ops/staging "${archive[@]}" | ssh "${opts[@]}" "$login@$SSH_HOST" "$command $quoted"
