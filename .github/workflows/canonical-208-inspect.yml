name: Inspect GRV-000208 Canonical Journal

on:
  push:
    branches: [feature/project-command-center-20261013]
    paths: ['.github/workflows/canonical-208-inspect.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      HOST: ${{ secrets.DEPLOY_HOST }}
      LOGIN: ${{ secrets.DEPLOY_USER }}
      PORT: ${{ secrets.DEPLOY_PORT }}
    steps:
      - name: Verify read-only inspection host credentials
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/inspect_project208
          chmod 600 ~/.ssh/inspect_project208
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts

      - name: Inspect the exact failed native transaction (never apply)
        run: |
          set -euo pipefail
          OPTS=(-i ~/.ssh/inspect_project208 -p "${PORT:-22}" -o BatchMode=yes -o ConnectTimeout=10)
          TARGET="${LOGIN:-deploy}"
          if ! ssh "${OPTS[@]}" "$TARGET@$HOST" true 2>/dev/null; then
            ssh "${OPTS[@]}" "root@$HOST" true
            TARGET=root
          fi
          ssh "${OPTS[@]}" "$TARGET@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          BACKEND=/opt/gravitas-backend
          test -x "$BACKEND/.venv/bin/python"
          test -f /etc/gravitas/backend.env
          echo 'Inspecting GRV-000208, transaction 8f5cea56-3c4e-4365-a8ad-2d0106d063f5'
          sudo -u gravitas env PYTHONPATH="$BACKEND" DJANGO_SETTINGS_MODULE=gravitas_backend.settings \
            bash -c 'set -a; . /etc/gravitas/backend.env; set +a; exec "$1" -m django recover_canonical_transaction 208 8f5cea56-3c4e-4365-a8ad-2d0106d063f5' \
            bash "$BACKEND/.venv/bin/python"
          REMOTE
          echo 'Read-only journal comparison without revealing file contents:'
          ssh "${OPTS[@]}" "$TARGET@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          BACKEND=/opt/gravitas-backend
          sudo -u gravitas env PYTHONPATH="$BACKEND" DJANGO_SETTINGS_MODULE=gravitas_backend.settings \
            bash -c 'set -a; . /etc/gravitas/backend.env; set +a; "$1" -' bash "$BACKEND/.venv/bin/python" <<'PY'
          import json
          import uuid
          import django
          django.setup()
          from core.models import ResearchProject
          from core import cloud
          from core.canonical_projects import dav_read
          from core.canonical_models import CanonicalWriteCommit
          project = ResearchProject.objects.get(pk=208)
          transaction_id = uuid.UUID('8f5cea56-3c4e-4365-a8ad-2d0106d063f5')
          root = cloud.project_mountpoint(project)
          path = root + '/06_Archive/CanonicalTransactions/' + str(transaction_id) + '.json'
          journal = dav_read(path)
          if not journal:
              raise RuntimeError('native_journal_missing')
          manifest = json.loads(journal['content'])
          if manifest.get('project_id') != project.pk or manifest.get('batch_id') != str(transaction_id):
              raise RuntimeError('journal_identity_mismatch')
          print('commit_witness=', CanonicalWriteCommit.objects.filter(pk=transaction_id).exists())
          print('operations=', len(manifest['operations']))
          for i, op in enumerate(manifest['operations']):
              target = op['path']
              if not target.startswith(root + '/') or '/06_Archive/CanonicalTransactions/' in target:
                  raise RuntimeError('unsafe_target_path')
              if op.get('kind') == 'acl':
                  from core.canonical_acl import read_acl, normalize
                  current = read_acl(target)
                  prior = (op.get('before') or {}).get('rules', [])
                  expected = (op.get('written') or {}).get('rules', [])
                  print('op', i, 'kind=acl', 'restored=', bool(op.get('restored')),
                        'unchanged_rules=', current['rules'] == normalize(prior),
                        'written_rules=', current['rules'] == normalize(expected))
              else:
                  current = dav_read(target)
                  before = op.get('before')
                  old_identity = bool(current and before and current.get('file_id') and current.get('file_id') == before.get('file_id'))
                  old_content = bool(current and before and current.get('content') == before.get('content'))
                  written_etag = bool(current and op.get('written_etag') and current.get('etag') == op.get('written_etag'))
                  current_matches_new = bool(current and op.get('content') is not None and current.get('content') == op.get('content'))
                  print('op', i, 'kind=', op.get('kind'), 'restored=', bool(op.get('restored')),
                        'not_written=', bool(op.get('not_written')),
                        'old_identity=', old_identity, 'original_bytes=', old_content,
                        'written_etag=', written_etag, 'new_bytes=', current_matches_new,
                        'currently_missing=', current is None)
          PY
          REMOTE
          echo 'Read-only inspection complete. No recovery was attempted.'
