name: GraviQuest Read-only Production Diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'ops/readonly_runtime_diagnostics.py'
      - '.github/workflows/readonly-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Publish diagnostic run link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context="gravitas/diagnostics" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Anonymized read-only diagnostics are running" > /dev/null || true
      - uses: actions/checkout@v4
      - name: Validate diagnostic script and report current schema leaf
        run: |
          python3 -m py_compile ops/readonly_runtime_diagnostics.py
          python3 - <<'PY'
          from pathlib import Path
          entries = sorted(p.name for p in Path('backend/core/migrations').glob('[0-9]*.py'))
          print('Current core migration filenames:', entries[-8:])
          import subprocess
          result = subprocess.run(['git', 'grep', '-l', 'initiative', '--', 'backend/core/*.py'], capture_output=True, text=True)
          print('Core Python files referencing Initiative:', result.stdout.splitlines()[:60])
          PY
      - name: Capture anonymized production runtime signals
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST"
          PORT="${SSH_PORT:-22}"
          USER="${SSH_USER:-deploy}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/diagnose
          chmod 600 ~/.ssh/diagnose
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/diagnose -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10)
          if ! ssh "${OPTS[@]}" "$USER@$SSH_HOST" true 2>/dev/null; then
            if [ "$USER" != root ] && ssh "${OPTS[@]}" "root@$SSH_HOST" true 2>/dev/null; then
              USER=root
            else
              echo "Could not authenticate to production" >&2
              exit 1
            fi
          fi
          REMOTE=/tmp/gravitas-diagnostics-$GITHUB_RUN_ID.py
          scp -i ~/.ssh/diagnose -P "$PORT" ops/readonly_runtime_diagnostics.py "$USER@$SSH_HOST:$REMOTE"
          ssh "${OPTS[@]}" "$USER@$SSH_HOST" "python3 '$REMOTE'; rm -f '$REMOTE'"

      - name: Publish read-only diagnostics result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ job.status }}" in
            success) STATE=success ;;
            failure) STATE=failure ;;
            *) STATE=error ;;
          esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" -f context="gravitas/diagnostics" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Read-only production diagnostic job: $STATE" > /dev/null || true

  php-hotfix-apply:
    name: Patch production Nextcloud PHP with verified backup
    needs: collect
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[apply-php-security-hotfix]') && needs.collect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: gravitas-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Prepare safe SSH access
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST"
          PORT="$(printf '%s' "$SSH_PORT")"; [ -n "$PORT" ] || PORT=22
          USER="$(printf '%s' "$SSH_USER")"; [ -n "$USER" ] || USER=deploy
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/security-key
          chmod 600 ~/.ssh/security-key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          if ! ssh -i ~/.ssh/security-key -p "$PORT" -o BatchMode=yes "$USER@$SSH_HOST" 'sudo -n true' 2>/dev/null; then
            if [ "$USER" != root ] && ssh -i ~/.ssh/security-key -p "$PORT" -o BatchMode=yes "root@$SSH_HOST" 'true' 2>/dev/null; then
              USER=root
            else
              echo "::error::SSH/sudo unavailable; production unchanged."
              exit 1
            fi
          fi
          echo "SECURITY_HOST=$SSH_HOST" >> "$GITHUB_ENV"
          echo "SECURITY_USER=$USER" >> "$GITHUB_ENV"
          echo "SECURITY_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Patch Nextcloud with app-only backup and strict completion marker
        shell: bash
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/nextcloud-php-security-result.log"
          ssh -i ~/.ssh/security-key -p "$SECURITY_PORT" -o BatchMode=yes \
            "$SECURITY_USER@$SECURITY_HOST" \
            "sudo bash -s -- '$GITHUB_RUN_ID'" <<'PATCH' | tee "$LOG"
          set -Eeuo pipefail
          RUN_ID="$1"
          exec 9>/run/gravitas-nextcloud-security.lock
          flock -n 9
          OLD_NAME="gravitas-nextcloud-before-php-fix-$RUN_ID"
          BACKUP="/var/backups/gravitas-nextcloud/security-$RUN_ID"
          test "$(docker inspect -f '{{.State.Running}}' gravitas-nextcloud)" = true
          test "$(docker inspect -f '{{.State.Running}}' gravitas-nextcloud-db)" = true
          test "$(docker inspect -f '{{.Config.Image}}' gravitas-nextcloud)" = nextcloud:stable-apache
          OLD_PHP="$(docker exec gravitas-nextcloud php -r 'echo PHP_VERSION;')"
          OLD_NC="$(docker exec -u www-data gravitas-nextcloud php occ status --output=json | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])')"
          echo "RUNNING_BEFORE php=$OLD_PHP nextcloud=$OLD_NC"
          if php_v="$OLD_PHP" python3 - <<'PY'
          import os,sys
          sys.exit(0 if tuple(map(int,os.environ["php_v"].split("."))) >= (8,5,12) else 1)
          PY
          then
            echo "ALREADY_PATCHED php=$OLD_PHP"
            exit 0
          fi
          # The pulled image is checked in a disposable container first.
          docker pull nextcloud:stable-apache >/dev/null
          NEW_IMAGE="$(docker image inspect -f '{{.Id}}' nextcloud:stable-apache)"
          NEW_PHP="$(docker run --rm --entrypoint php nextcloud:stable-apache -r 'echo PHP_VERSION;')"
          NEW_NC="$(docker run --rm --entrypoint php nextcloud:stable-apache -r 'include "/usr/src/nextcloud/version.php"; echo implode(".", $OC_Version);')"
          echo "CANDIDATE php=$NEW_PHP nextcloud=$NEW_NC"
          new_php="$NEW_PHP" old_nc="$OLD_NC" new_nc="$NEW_NC" python3 - <<'PY'
          import os,sys
          v=tuple(map(int,os.environ["new_php"].split(".")))
          a=tuple(map(int,os.environ["old_nc"].split(".")))
          b=tuple(map(int,os.environ["new_nc"].split(".")))
          if v < (8,5,12) or a[0] != b[0] or b < a:
              sys.exit("Unsafe or incompatible candidate; running service untouched")
          PY
          VOLUME="$(docker volume inspect gravitas_nextcloud_html -f '{{.Mountpoint}}')"
          test -d "$VOLUME"
          test "$(df -Pk / | awk 'END {print $4}')" -gt 15728640

          # Stop writers while snapshotting database and entire native volume.
          TIMERS=""
          for u in gravitas-nextcloud-cron.timer gravitas-nextcloud-backup.timer gravitas-nextcloud-mirror.timer gravitas-nextcloud-notes-mirror.timer; do
            if systemctl is-active --quiet "$u"; then
              systemctl stop "$u"
              TIMERS="$TIMERS $u"
            fi
          done
          STATE=pre_backup
          resume_timers() {
            for u in $TIMERS; do systemctl start "$u" || true; done
          }
          on_failure() {
            status="$?"
            trap - ERR
            echo "::error::PHP hotfix failed at state=$STATE; recovering"
            if [ "$STATE" = swapped ]; then
              docker stop gravitas-nextcloud >/dev/null 2>&1 || true
              docker rm gravitas-nextcloud >/dev/null 2>&1 || true
              if [ -s "$BACKUP/nextcloud.dump" ] && [ -s "$BACKUP/html.tar" ]; then
                echo "RESTORING_PRECHANGE_DATA"
                docker exec gravitas-nextcloud-db psql -U nextcloud -d postgres -c \
                  "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'nextcloud' AND pid <> pg_backend_pid();" >/dev/null || true
                docker exec -i gravitas-nextcloud-db pg_restore -U nextcloud -d nextcloud \
                  --clean --if-exists --exit-on-error < "$BACKUP/nextcloud.dump" || true
                # Source volume remains mounted to stopped container.
                find "$VOLUME" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + || true
                tar --acls --xattrs --numeric-owner -xf "$BACKUP/html.tar" -C "$VOLUME" || true
              fi
              docker rename "$OLD_NAME" gravitas-nextcloud || true
              docker start gravitas-nextcloud >/dev/null || true
            elif [ "$STATE" = renamed ]; then
              docker rename "$OLD_NAME" gravitas-nextcloud || true
              docker start gravitas-nextcloud >/dev/null || true
            fi
            if docker inspect gravitas-nextcloud >/dev/null 2>&1; then
              docker exec -u www-data gravitas-nextcloud php occ maintenance:mode --off >/dev/null 2>&1 || true
            fi
            resume_timers
            exit "$status"
          }
          trap on_failure ERR
          docker exec -u www-data gravitas-nextcloud php occ maintenance:mode --on >/dev/null
          install -d -m 700 "$BACKUP"
          docker exec gravitas-nextcloud-db pg_dump -U nextcloud -Fc nextcloud > "$BACKUP/nextcloud.dump"
          tar --acls --xattrs --numeric-owner -cf "$BACKUP/html.tar" -C "$VOLUME" .
          chmod 600 "$BACKUP/nextcloud.dump" "$BACKUP/html.tar"
          pg_restore --list "$BACKUP/nextcloud.dump" >/dev/null
          tar -tf "$BACKUP/html.tar" >/dev/null
          test -s "$BACKUP/nextcloud.dump" && test -s "$BACKUP/html.tar"
          STATE=backed_up
          echo "BACKUP_VERIFIED (native files and database; root-private)"

          docker stop gravitas-nextcloud >/dev/null
          docker rename gravitas-nextcloud "$OLD_NAME"
          STATE=renamed
          set -a
          . /etc/gravitas/nextcloud.env
          set +a
          docker run -d --name gravitas-nextcloud --restart unless-stopped \
            --network gravitas-nextcloud -p 127.0.0.1:8081:80 \
            -e POSTGRES_HOST=gravitas-nextcloud-db \
            -e POSTGRES_DB=nextcloud -e POSTGRES_USER=nextcloud \
            -e POSTGRES_PASSWORD="$NC_DB_PASSWORD" \
            -e REDIS_HOST=gravitas-nextcloud-redis \
            -e NEXTCLOUD_ADMIN_USER="$NC_ADMIN_USER" \
            -e NEXTCLOUD_ADMIN_PASSWORD="$NC_ADMIN_PASSWORD" \
            -e NEXTCLOUD_TRUSTED_DOMAINS=graviquest.com \
            -e TRUSTED_PROXIES=172.16.0.0/12 \
            -e OVERWRITEHOST=graviquest.com -e OVERWRITEPROTOCOL=https \
            -e OVERWRITEWEBROOT=/nextcloud \
            -e OVERWRITECLIURL=https://graviquest.com/nextcloud \
            -v gravitas_nextcloud_html:/var/www/html "$NEW_IMAGE" >/dev/null
          STATE=swapped
          READY=0
          for i in $(seq 1 90); do
            if docker exec -u www-data gravitas-nextcloud php occ status --output=json 2>/dev/null \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("installed") and not d.get("needsDbUpgrade") else 1)' 2>/dev/null; then
              READY=1; break
            fi
            sleep 3
          done
          test "$READY" -eq 1
          ACTUAL_PHP="$(docker exec gravitas-nextcloud php -r 'echo PHP_VERSION;')"
          test "$ACTUAL_PHP" = "$NEW_PHP"
          for app in groupfolders notes deck; do
            docker exec -u www-data gravitas-nextcloud php occ app:list --enabled \
              | grep -E "^[[:space:]]*-[[:space:]]+$app:" >/dev/null
          done
          docker exec -u www-data gravitas-nextcloud php occ maintenance:mode --off >/dev/null
          curl -fsS --max-time 20 http://127.0.0.1:8081/status.php \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("installed") and not d.get("maintenance")'
          STATE=verified
          trap - ERR
          resume_timers
          echo "PATCH_APPLIED php=$ACTUAL_PHP nextcloud=$NEW_NC"
          echo "Restorable backup: $BACKUP"
          echo "Previous stopped container: $OLD_NAME"
          PATCH
          # Fail-closed: a healthy URL must not be mistaken for a patched runtime.
          grep -Eq '^(PATCH_APPLIED|ALREADY_PATCHED) php=8\.5\.(1[2-9]|[2-9][0-9])' "$LOG"

      - name: Public endpoint health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 https://cloud.graviquest.com/status.php \
            | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d.get("installed") and not d.get("maintenance"); print("Public Nextcloud health passed")'
