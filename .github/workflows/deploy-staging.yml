name: Deploy Gravitas Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gravitas-staging
  cancel-in-progress: true

env:
  DOMAIN: staging.gravitasplus.com
  DEPLOY_PATH: /var/www/gravitas-staging
  BACKEND_PATH: /opt/gravitas-backend-staging
  BACKEND_PORT: '8001'
  DB_NAME: gravitas_staging

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          USER="${{ secrets.DEPLOY_USER }}"; [ -n "$USER" ] || USER=deploy
          PORT="${{ secrets.DEPLOY_PORT }}"; [ -n "$PORT" ] || PORT=22
          echo "DEPLOY_USER=$USER" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$PORT" >> "$GITHUB_ENV"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$PORT" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -p "$PORT" -o BatchMode=yes "$USER@${{ secrets.DEPLOY_HOST }}" true

      - name: Bootstrap staging
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/key -p "$DEPLOY_PORT" "$DEPLOY_USER@${{ secrets.DEPLOY_HOST }}" bash -s -- "$DOMAIN" "$DEPLOY_PATH" "$BACKEND_PATH" "$BACKEND_PORT" "$DB_NAME" <<'REMOTE'
          set -euo pipefail
          DOMAIN="$1"; WEB="$2"; APP="$3"; PORT="$4"; DB="$5"
          sudo apt-get update -y
          sudo apt-get install -y nginx postgresql python3-venv certbot python3-certbot-nginx apache2-utils openssl rsync
          sudo systemctl enable --now nginx postgresql
          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='gravitas'" | grep -q 1; then sudo -u postgres createuser gravitas; fi
          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='$DB'" | grep -q 1; then sudo -u postgres createdb -O gravitas "$DB"; fi
          sudo mkdir -p "$WEB" "$APP" /etc/gravitas
          sudo chown -R "$USER:$USER" "$WEB"
          sudo chown -R gravitas:gravitas "$APP"
          if [ ! -f /etc/gravitas/staging.env ]; then
            SECRET="$(openssl rand -hex 32)"
            sudo tee /etc/gravitas/staging.env >/dev/null <<EOF
          DJANGO_SECRET_KEY=$SECRET
          DJANGO_DEBUG=0
          DJANGO_DB_NAME=$DB
          DJANGO_DB_USER=gravitas
          DJANGO_ALLOWED_HOSTS=$DOMAIN,127.0.0.1,localhost
          DJANGO_CSRF_TRUSTED_ORIGINS=https://$DOMAIN
          DJANGO_SESSION_COOKIE_NAME=gravitas_staging_sessionid
          DJANGO_CSRF_COOKIE_NAME=gravitas_staging_csrftoken
          EOF
            sudo chown root:gravitas /etc/gravitas/staging.env
            sudo chmod 640 /etc/gravitas/staging.env
          fi
          if [ ! -f /etc/gravitas/staging-access-credentials ]; then
            PASS="$(openssl rand -base64 18 | tr -d '\n' | tr '/+' 'Aa')"
            sudo htpasswd -bc /etc/nginx/.htpasswd-gravitas-staging staging "$PASS" >/dev/null
            printf 'username=staging\npassword=%s\n' "$PASS" | sudo tee /etc/gravitas/staging-access-credentials >/dev/null
            sudo chmod 600 /etc/gravitas/staging-access-credentials
            sudo chown root:www-data /etc/nginx/.htpasswd-gravitas-staging
            sudo chmod 640 /etc/nginx/.htpasswd-gravitas-staging
          fi
          sudo tee /etc/systemd/system/gravitas-backend-staging.service >/dev/null <<EOF
          [Unit]
          Description=Gravitas staging backend
          After=postgresql.service
          [Service]
          User=gravitas
          Group=gravitas
          WorkingDirectory=$APP
          EnvironmentFile=/etc/gravitas/staging.env
          Environment=DJANGO_SETTINGS_MODULE=gravitas_backend.settings
          ExecStart=$APP/.venv/bin/gunicorn --workers 2 --bind 127.0.0.1:$PORT django.core.wsgi:get_wsgi_application()
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          REMOTE

      - name: Deploy code and migrate staging DB
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_HOST }}"
          rsync -az --delete --delete-excluded --exclude '.git/' --exclude '.github/' --exclude 'backend/' -e "ssh -i ~/.ssh/key -p $DEPLOY_PORT" ./ "$DEPLOY_USER@$HOST:$DEPLOY_PATH/"
          rsync -az --delete --exclude '.venv/' --exclude 'staticfiles/' --rsync-path='sudo rsync' -e "ssh -i ~/.ssh/key -p $DEPLOY_PORT" ./backend/ "$DEPLOY_USER@$HOST:$BACKEND_PATH/"
          ssh -i ~/.ssh/key -p "$DEPLOY_PORT" "$DEPLOY_USER@$HOST" bash -s -- "$BACKEND_PATH" <<'REMOTE'
          set -euo pipefail
          APP="$1"
          sudo chown -R gravitas:gravitas "$APP"
          [ -x "$APP/.venv/bin/python" ] || sudo -u gravitas python3 -m venv "$APP/.venv"
          sudo -u gravitas "$APP/.venv/bin/pip" install -q --disable-pip-version-check -r "$APP/requirements.txt"
          set -a; . /etc/gravitas/staging.env; set +a
          export DJANGO_SETTINGS_MODULE=gravitas_backend.settings PYTHONPATH="$APP"
          cd "$APP"
          sudo -u gravitas --preserve-env "$APP/.venv/bin/django-admin" migrate --noinput
          sudo -u gravitas --preserve-env "$APP/.venv/bin/django-admin" collectstatic --noinput
          sudo systemctl enable --now gravitas-backend-staging
          sudo systemctl restart gravitas-backend-staging
          REMOTE

      - name: Configure protected staging vhost
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_HOST }}"
          ssh -i ~/.ssh/key -p "$DEPLOY_PORT" "$DEPLOY_USER@$HOST" bash -s -- "$DOMAIN" "$DEPLOY_PATH" "$BACKEND_PORT" "$HOST" <<'REMOTE'
          set -euo pipefail
          DOMAIN="$1"; WEB="$2"; PORT="$3"; SERVER_IP="$4"; CERT="/etc/letsencrypt/live/$DOMAIN"
          sudo tee /etc/nginx/sites-available/gravitas-staging >/dev/null <<NGINX
          server {
            listen 80;
            server_name $DOMAIN;
            root $WEB;
            index index.html;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            location ^~ /.well-known/acme-challenge/ { auth_basic off; try_files \$uri =404; }
            location ^~ /api/ { auth_basic "Gravitas Staging"; auth_basic_user_file /etc/nginx/.htpasswd-gravitas-staging; proxy_pass http://127.0.0.1:$PORT; proxy_set_header Host \$host; proxy_set_header X-Forwarded-Proto \$scheme; }
            location ^~ /admin/ { auth_basic "Gravitas Staging"; auth_basic_user_file /etc/nginx/.htpasswd-gravitas-staging; proxy_pass http://127.0.0.1:$PORT; proxy_set_header Host \$host; proxy_set_header X-Forwarded-Proto \$scheme; }
            location ^~ /django-static/ { auth_basic "Gravitas Staging"; auth_basic_user_file /etc/nginx/.htpasswd-gravitas-staging; proxy_pass http://127.0.0.1:$PORT; }
            location / { auth_basic "Gravitas Staging"; auth_basic_user_file /etc/nginx/.htpasswd-gravitas-staging; try_files \$uri \$uri/ /index.html; }
          }
          NGINX
          sudo ln -sfn /etc/nginx/sites-available/gravitas-staging /etc/nginx/sites-enabled/gravitas-staging
          sudo nginx -t && sudo systemctl reload nginx
          RESOLVED="$(getent ahostsv4 "$DOMAIN" | awk 'NR==1{print $1}')"
          if [ "$RESOLVED" = "$SERVER_IP" ] && [ ! -f "$CERT/fullchain.pem" ]; then
            sudo certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --register-unsafely-without-email --redirect || true
          fi
          sudo nginx -t && sudo systemctl reload nginx
          USERNAME="$(sudo awk -F= '/^username=/{print $2}' /etc/gravitas/staging-access-credentials)"
          PASSWORD="$(sudo awk -F= '/^password=/{print $2}' /etc/gravitas/staging-access-credentials)"
          sudo systemctl is-active gravitas-backend-staging
          curl -fsS "http://127.0.0.1:$PORT/api/health/" -H "Host: $DOMAIN" | grep -q '"status": "ok"'
          curl -fsS -u "$USERNAME:$PASSWORD" -H "Host: $DOMAIN" http://127.0.0.1/ >/dev/null
          echo staging-stack-ok
          REMOTE
