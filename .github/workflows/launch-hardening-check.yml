name: Gravitas Backend Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'workspace.html'
      - 'assets/platform-v2*.js'
      - 'assets/platform-v2*.css'
      - 'assets/platform-v3*.js'
      - 'assets/platform-v3*.css'
      - 'assets/core-team.js'
      - 'assets/core-team.css'
      - '.github/workflows/launch-hardening-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gravitas_ci
          POSTGRES_USER: gravitas_ci
          POSTGRES_PASSWORD: gravitas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gravitas_ci -d gravitas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DJANGO_DEBUG: '0'
      DJANGO_SETTINGS_MODULE: gravitas_backend.settings
      PYTHONPATH: backend
      DJANGO_DB_NAME: gravitas_ci
      DJANGO_DB_USER: gravitas_ci
      DJANGO_DB_PASSWORD: gravitas_ci
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: '5432'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate workspace JavaScript
        run: |
          node --check assets/platform-v2.js
          node --check assets/platform-v2-patches.js
          node --check assets/platform-v2-ux.js
          node --check assets/platform-v3-navigation.js
          node --check assets/core-team.js
      - name: Install backend dependencies
        run: python -m pip install -q -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Check migration drift
        run: django-admin makemigrations core --check --dry-run --noinput
      - name: Apply migrations to PostgreSQL
        run: django-admin migrate --noinput
      - name: Check Django configuration
        run: django-admin check
      - name: Run Gravitas workspace role and team tests
        run: django-admin test core.test_operating core.test_platform_v2 core.test_platform_v3_roles core.test_team_api --noinput
      - name: Verify CMS translations Community and Lab schema
        run: |
          python - <<'PY'
          import django
          django.setup()

          from django.contrib.auth import get_user_model
          from django.test import Client
          from django.utils import timezone
          from core.models import Comment, ContentItem, ContentTranslation, LabProgress

          item = ContentItem.objects.create(
              kind=ContentItem.Kind.DOSSIER,
              status=ContentItem.Status.PUBLISHED,
              slug='ci-language-check',
              title='English base',
              summary='English summary',
              body='English body',
              published_at=timezone.now(),
          )
          ContentTranslation.objects.create(
              content=item,
              locale=ContentTranslation.Locale.GERMAN,
              status=ContentTranslation.Status.PUBLISHED,
              title='Deutscher Titel',
              summary='Deutsche Zusammenfassung',
              body='Deutscher Inhalt',
              published_at=timezone.now(),
          )

          user = get_user_model().objects.create_user(
              username='ci-schema@example.com',
              email='ci-schema@example.com',
              password='ci-schema-password',
          )
          Comment.objects.create(
              content_key='community',
              author=user,
              body='Schema check',
              status=Comment.Status.PUBLISHED,
          )
          LabProgress.objects.create(
              user=user,
              lab_key='schema-check',
              completed=True,
              score=1,
          )

          client = Client(HTTP_HOST='localhost')
          response = client.get('/content/ci-language-check/?lang=de')
          assert response.status_code == 200, response.content
          assert 'Deutscher Titel' in response.content.decode('utf-8')
          assert Comment.objects.filter(content_key='community').exists()
          assert LabProgress.objects.filter(user=user, lab_key='schema-check').exists()
          PY
