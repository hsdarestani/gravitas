name: Cleanup Gravitas Production E2E Users

on:
  workflow_run:
    workflows:
      - 'Gravitas Production Auth E2E'
      - 'Gravitas Operating Production E2E'
      - 'Gravitas Workspace Production E2E'
    types: [completed]
  workflow_dispatch:
    inputs:
      scope:
        description: E2E account family to clean
        required: true
        default: all
        type: choice
        options: [all, auth, workspace, operating]

permissions:
  contents: read

# Auth, Workspace and Operating use disjoint, strictly matched account patterns.
# Do not serialize these cleanup runs: GitHub may cancel a queued workflow_run
# when multiple upstream E2E workflows finish at nearly the same time.

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve cleanup scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SCOPE="${{ inputs.scope }}"
          else
            case "${{ github.event.workflow_run.name }}" in
              'Gravitas Production Auth E2E') SCOPE=auth ;;
              'Gravitas Operating Production E2E') SCOPE=operating ;;
              'Gravitas Workspace Production E2E') SCOPE=workspace ;;
              *) echo 'Unknown upstream workflow'; exit 1 ;;
            esac
          fi
          echo "CLEANUP_SCOPE=$SCOPE" >> "$GITHUB_ENV"

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}" || { echo 'Missing DEPLOY_HOST'; exit 1; }
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || { echo 'Missing DEPLOY_SSH_KEY'; exit 1; }
          USERNAME="${{ secrets.DEPLOY_USER }}"
          PORT="${{ secrets.DEPLOY_PORT }}"
          [ -n "$USERNAME" ] || USERNAME=deploy
          [ -n "$PORT" ] || PORT=22
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/gravitas_deploy
          chmod 600 ~/.ssh/gravitas_deploy
          ssh-keyscan -p "$PORT" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/gravitas_deploy -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10)
          if ssh "${OPTS[@]}" "$USERNAME@${{ secrets.DEPLOY_HOST }}" true 2>/dev/null; then
            EFFECTIVE_USER="$USERNAME"
          elif [ "$USERNAME" != root ] && ssh "${OPTS[@]}" "root@${{ secrets.DEPLOY_HOST }}" true 2>/dev/null; then
            EFFECTIVE_USER=root
          else
            echo 'SSH authentication failed'; exit 1
          fi
          echo "DEPLOY_USER=$EFFECTIVE_USER" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Delete completed production test accounts
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/gravitas_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@${{ secrets.DEPLOY_HOST }}" \
            bash -s -- "$CLEANUP_SCOPE" <<'REMOTE'
          set -euo pipefail
          SCOPE="$1"
          sudo -u gravitas bash -c '
            set -a
            . /etc/gravitas/backend.env
            set +a
            export DJANGO_SETTINGS_MODULE=gravitas_backend.settings
            export PYTHONPATH=/opt/gravitas-backend
            cd /opt/gravitas-backend
            exec .venv/bin/django-admin cleanup_production_e2e_users --scope "$1"
          ' _ "$SCOPE"
          REMOTE
