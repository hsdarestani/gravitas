name: Sync Kiarash frontend now

on:
  push:
    branches: [main]
    paths:
      - '.sync-k-now'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gravitas-k-sync-now
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest upstream fix and normalize production HTML
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gravitasplus-upstream
          git clone -q https://github.com/desdevrad/gravitasplus.git /tmp/gravitasplus-upstream
          UPSTREAM_SHA="$(git -C /tmp/gravitasplus-upstream rev-parse HEAD)"
          test "$UPSTREAM_SHA" = "9f54828feea451883cde90d50c8199dd9748b5a9" || {
            echo "Upstream moved again to $UPSTREAM_SHA; refusing a partial one-file sync."; exit 1;
          }
          cp /tmp/gravitasplus-upstream/assets/site.css assets/site.css
          printf '%s\n' "$UPSTREAM_SHA" > .upstream-gravitasplus

          python3 - "$UPSTREAM_SHA" <<'PY'
          from pathlib import Path
          import re, sys
          sha = sys.argv[1]
          token = 'up-' + sha[:12]
          for p in Path('.').glob('*.html'):
              s = p.read_text()
              s = re.sub(
                  r'assets/(gravitas|site|hero|chat|brand)\.(css|js)(?:\?v=[^"\']*)?',
                  lambda m: f'assets/{m.group(1)}.{m.group(2)}?v={token}', s)
              s = re.sub(r'assets/local-fonts\.css(?:\?v=[^"\']*)?', f'assets/local-fonts.css?v={token}', s)
              s = re.sub(r'assets/production-bridge\.js(?:\?v=[^"\']*)?', f'assets/production-bridge.js?v={token}', s)
              p.write_text(s)

          index = Path('index.html')
          s = index.read_text()
          old = re.compile(
              r'<p class="lp-hero__credit">\s*'
              r'<span>New topic monthly</span>\s*'
              r'<span><span class="g-nums">312K</span> subscribers</span>\s*'
              r'<span><a href="community\.html#join">4,100 members</a></span>\s*'
              r'</p>', re.S)
          new = '''<p class="lp-hero__credit">
          <span>New topic monthly</span>
          <span><span class="lp-hero__literal-sep" aria-hidden="true">•</span><span class="g-nums">312K</span> subscribers</span>
          <span><span class="lp-hero__literal-sep" aria-hidden="true">•</span><a href="community.html#join">4,100 members</a></span>
        </p>'''
          s, n = old.subn(new, s, count=1)
          if n == 0 and 'lp-hero__literal-sep' not in s:
              raise SystemExit('hero stats row not found')
          style = '''<style id="production-hero-stat-parity">
.lp-hero__credit > span + span::before { content: none !important; }
.lp-hero__credit .lp-hero__literal-sep { color: var(--g-border-strong); font-size: .65em; line-height: 1; flex: none; }
.lp-hero__credit a { text-decoration-line: underline; text-underline-offset: .2em; }
</style>'''
          s = re.sub(r'\s*<style id="production-hero-stat-parity">.*?</style>\s*', '\n', s, flags=re.S)
          s = s.replace('</head>', style + '\n</head>', 1)
          index.write_text(s)
          PY

          grep -q 'margin-top: 0' assets/site.css
          grep -q 'lp-hero__literal-sep' index.html
          grep -q 'production-hero-stat-parity' index.html
          grep -q 'up-9f54828feea4' index.html

          git config user.name 'Hossein Darestani'
          git config user.email '45485005+hsdarestani@users.noreply.github.com'
          git add .upstream-gravitasplus assets/site.css '*.html'
          git commit -m 'Sync Kiarash fix 9f54828feea4 and lock hero stats parity'
          git push origin HEAD:main

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}"
          test -n "${{ secrets.DEPLOY_SSH_KEY }}"
          USERNAME="${{ secrets.DEPLOY_USER }}"
          PORT="${{ secrets.DEPLOY_PORT }}"
          [ -n "$USERNAME" ] || USERNAME=deploy
          [ -n "$PORT" ] || PORT=22
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/gravitas_deploy
          chmod 600 ~/.ssh/gravitas_deploy
          ssh-keyscan -p "$PORT" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/gravitas_deploy -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10)
          if ssh "${OPTS[@]}" "$USERNAME@${{ secrets.DEPLOY_HOST }}" true 2>/dev/null; then
            EFFECTIVE_USER="$USERNAME"
          elif [ "$USERNAME" != root ] && ssh "${OPTS[@]}" "root@${{ secrets.DEPLOY_HOST }}" true 2>/dev/null; then
            EFFECTIVE_USER=root
          else
            echo 'SSH authentication failed'; exit 1
          fi
          echo "DEPLOY_USER=$EFFECTIVE_USER" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Push synchronized frontend directly to production
        shell: bash
        run: |
          set -euo pipefail
          HOST="${{ secrets.DEPLOY_HOST }}"
          rsync -az -e "ssh -i ~/.ssh/gravitas_deploy -p $DEPLOY_PORT" assets/site.css "$DEPLOY_USER@$HOST:/var/www/gravitas/assets/site.css"
          rsync -az -e "ssh -i ~/.ssh/gravitas_deploy -p $DEPLOY_PORT" ./*.html "$DEPLOY_USER@$HOST:/var/www/gravitas/"

      - name: Verify live domain and record success
        shell: bash
        run: |
          set -euo pipefail
          URL="https://gravitasplus.com/?sync=9f54828feea4-${GITHUB_RUN_ID}"
          HTML="$(curl -4 -fsS --retry 8 --retry-delay 3 --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' "$URL")"
          printf '%s' "$HTML" | grep -q 'up-9f54828feea4'
          printf '%s' "$HTML" | grep -q 'production-hero-stat-parity'
          printf '%s' "$HTML" | grep -q 'lp-hero__literal-sep'
          curl -4 -fsS --retry 5 --retry-delay 2 "https://gravitasplus.com/assets/site.css?v=up-9f54828feea4" | grep -q 'margin-top: 0'
          printf 'status=live\nupstream=9f54828feea451883cde90d50c8199dd9748b5a9\nhero_stats=literal-separators-and-underlined-members\nverified_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .kiarash-sync-status
          git add .kiarash-sync-status
          git commit -m 'Record verified Kiarash frontend sync'
          git push origin HEAD:main
