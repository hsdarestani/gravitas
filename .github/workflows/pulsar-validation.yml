name: Pulsar Validation

on:
  pull_request:
    paths:
      - 'backend/core/pulsar.py'
      - 'backend/core/pulsar_api.py'
      - 'backend/core/pulsar_profile_api.py'
      - 'backend/core/pulsar_memory_api.py'
      - 'backend/core/pulsar_agent_api.py'
      - 'backend/core/pulsar_runtime/**'
      - 'backend/core/pulsar_evalset.py'
      - 'backend/core/management/commands/evaluate_pulsar_v1.py'
      - 'backend/core/management/commands/report_pulsar_metrics.py'
      - 'backend/core/management/commands/benchmark_pulsar_models.py'
      - 'backend/core/assistant_api.py'
      - 'backend/core/lms_extended_api.py'
      - 'backend/core/models.py'
      - 'backend/core/migrations/0056_pulsar_user_memory_profile.py'
      - 'backend/core/migrations/0057_pulsar_memory_thread_run.py'
      - 'backend/core/telegram_pulsar.py'
      - 'backend/core/test_pulsar_*.py'
      - 'backend/core/test_assistant_api.py'
      - 'backend/core/test_lms_advanced_capabilities.py'
      - 'backend/gravitas_backend/settings.py'
      - 'backend/gravitas_backend/urls.py'
      - '.github/workflows/pulsar-validation.yml'
  push:
    branches: [main]
    paths:
      - 'backend/core/pulsar.py'
      - 'backend/core/pulsar_api.py'
      - 'backend/core/pulsar_profile_api.py'
      - 'backend/core/pulsar_runtime/**'
      - 'backend/core/assistant_api.py'
      - 'backend/core/lms_extended_api.py'
      - 'backend/core/models.py'
      - 'backend/core/migrations/0056_pulsar_user_memory_profile.py'
      - 'backend/core/telegram_pulsar.py'
      - 'backend/core/test_pulsar_*.py'
      - 'backend/core/test_assistant_api.py'
      - 'backend/core/test_lms_advanced_capabilities.py'
      - 'backend/gravitas_backend/settings.py'
      - 'backend/gravitas_backend/urls.py'
      - '.github/workflows/pulsar-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gravitas-pulsar-tests"
          "$RUNNER_TEMP/gravitas-pulsar-tests/bin/pip" install --disable-pip-version-check -q -r backend/requirements.txt

      - name: Django and migration checks
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          export DJANGO_SETTINGS_MODULE=gravitas_backend.test_settings
          PY="$RUNNER_TEMP/gravitas-pulsar-tests/bin/python"
          "$PY" -m django check
          "$PY" -m django makemigrations --check --dry-run
          "$PY" -m django benchmark_pulsar_decisions --provider deterministic
          "$PY" -m django evaluate_pulsar_v1 --provider deterministic

      - name: Pulsar unit and regression tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          export DJANGO_SETTINGS_MODULE=gravitas_backend.test_settings
          PY="$RUNNER_TEMP/gravitas-pulsar-tests/bin/python"
          "$PY" -m django test \
            core.test_pulsar_runtime \
            core.test_pulsar_context_profile \
            core.test_pulsar_memory \
            core.test_pulsar_evalset \
            core.test_pulsar_v1_runtime \
            core.test_pulsar_multi_provider \
            core.test_pulsar_agent \
            core.test_pulsar_agent_api \
            core.test_telegram_pulsar \
            core.test_assistant_api \
            core.test_lms_advanced_capabilities \
            core.test_lms_openedx_refactor
