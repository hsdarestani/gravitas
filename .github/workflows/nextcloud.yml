name: Provision Gravitas Nextcloud

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nextcloud.yml'
      - 'ops/nextcloud/ensure.sh'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Gravitas to Strato']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: gravitas-nextcloud
  cancel-in-progress: false

env:
  DOMAIN: gravitasplus.com

jobs:
  nextcloud:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}" || { echo 'Missing DEPLOY_HOST'; exit 1; }
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || { echo 'Missing DEPLOY_SSH_KEY'; exit 1; }
          USERNAME="${{ secrets.DEPLOY_USER }}"
          PORT="${{ secrets.DEPLOY_PORT }}"
          [ -n "$USERNAME" ] || USERNAME=deploy
          [ -n "$PORT" ] || PORT=22
          echo "CONFIGURED_USER=$USERNAME" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/gravitas_deploy
          chmod 600 ~/.ssh/gravitas_deploy
          ssh-keygen -y -f ~/.ssh/gravitas_deploy >/dev/null
          ssh-keyscan -p "$DEPLOY_PORT" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/gravitas_deploy -p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=10)
          HOST="${{ secrets.DEPLOY_HOST }}"
          if ssh "${OPTS[@]}" "$CONFIGURED_USER@$HOST" true 2>/dev/null; then
            EFFECTIVE_USER="$CONFIGURED_USER"
          elif [ "$CONFIGURED_USER" != root ] && ssh "${OPTS[@]}" "root@$HOST" true 2>/dev/null; then
            EFFECTIVE_USER=root
          else
            echo 'SSH authentication failed'
            exit 1
          fi
          echo "DEPLOY_USER=$EFFECTIVE_USER" >> "$GITHUB_ENV"

      - name: Provision or repair Nextcloud
        shell: bash
        run: |
          set -euo pipefail
          MODE=install
          if [ "${{ github.event_name }}" = workflow_run ]; then MODE=repair; fi
          scp -i ~/.ssh/gravitas_deploy -P "$DEPLOY_PORT" ops/nextcloud/ensure.sh \
            "$DEPLOY_USER@${{ secrets.DEPLOY_HOST }}:/tmp/gravitas-nextcloud-ensure"
          ssh -i ~/.ssh/gravitas_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@${{ secrets.DEPLOY_HOST }}" \
            "sudo install -m 750 /tmp/gravitas-nextcloud-ensure /usr/local/sbin/gravitas-nextcloud-ensure && sudo /usr/local/sbin/gravitas-nextcloud-ensure '$DOMAIN' '$MODE'"

      - name: Verify public endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -4 -fsS --retry 15 --retry-delay 4 --connect-timeout 8 --max-time 25 \
            "https://$DOMAIN/nextcloud/status.php" | tee /tmp/status.json
          grep -q '"installed":true' /tmp/status.json

      - name: Record live status
        if: github.event_name != 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(ssh -i ~/.ssh/gravitas_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@${{ secrets.DEPLOY_HOST }}" \
            "sudo docker exec -u www-data gravitas-nextcloud php occ status" | sed -n 's/^  - versionstring: //p' | head -n1)
          [ -n "$VERSION" ] || VERSION=unknown
          printf 'status=live\nurl=https://%s/nextcloud/\nversion=%s\nverified_at=%s\n' \
            "$DOMAIN" "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .nextcloud-status
          git config user.name 'gravitas-nextcloud-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .nextcloud-status
          git commit -m 'Record live Nextcloud status' || exit 0
          git push origin HEAD:main

      - name: Export one-day admin credentials
        if: github.event_name != 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/gravitas_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@${{ secrets.DEPLOY_HOST }}" \
            'sudo cat /etc/gravitas/nextcloud-admin-credentials' > nextcloud-admin-credentials.txt

      - name: Upload one-day admin credentials
        if: github.event_name != 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-admin-credentials
          path: nextcloud-admin-credentials.txt
          retention-days: 1
          if-no-files-found: error
