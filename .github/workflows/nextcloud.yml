name: Provision Gravitas Nextcloud

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nextcloud.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Gravitas to Strato']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: gravitas-nextcloud
  cancel-in-progress: false

env:
  DOMAIN: gravitasplus.com

jobs:
  nextcloud:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve SSH configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}" || { echo 'Missing DEPLOY_HOST'; exit 1; }
          test -n "${{ secrets.DEPLOY_SSH_KEY }}" || { echo 'Missing DEPLOY_SSH_KEY'; exit 1; }
          USERNAME="${{ secrets.DEPLOY_USER }}"
          PORT="${{ secrets.DEPLOY_PORT }}"
          [ -n "$USERNAME" ] || USERNAME=deploy
          [ -n "$PORT" ] || PORT=22
          echo "CONFIGURED_USER=$USERNAME" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/gravitas_deploy
          chmod 600 ~/.ssh/gravitas_deploy
          ssh-keygen -y -f ~/.ssh/gravitas_deploy >/dev/null
          ssh-keyscan -p "$DEPLOY_PORT" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/gravitas_deploy -p "$DEPLOY_PORT" -o BatchMode=yes -o ConnectTimeout=10)
          HOST="${{ secrets.DEPLOY_HOST }}"
          if ssh "${OPTS[@]}" "$CONFIGURED_USER@$HOST" true 2>/dev/null; then
            EFFECTIVE_USER="$CONFIGURED_USER"
          elif [ "$CONFIGURED_USER" != root ] && ssh "${OPTS[@]}" "root@$HOST" true 2>/dev/null; then
            EFFECTIVE_USER=root
          else
            echo 'SSH authentication failed'
            exit 1
          fi
          echo "DEPLOY_USER=$EFFECTIVE_USER" >> "$GITHUB_ENV"

      - name: Install or repair Nextcloud
        shell: bash
        run: |
          set -euo pipefail
          MODE=install
          if [ "${{ github.event_name }}" = workflow_run ]; then MODE=repair; fi
          ssh -i ~/.ssh/gravitas_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@${{ secrets.DEPLOY_HOST }}" \
            bash -s -- "$DOMAIN" "$MODE" <<'REMOTE'
          set -euo pipefail
          DOMAIN="$1"
          MODE="$2"
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO=sudo; fi

          install_script() {
            cat > /tmp/gravitas-nextcloud-ensure <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          DOMAIN="${1:-gravitasplus.com}"
          MODE="${2:-repair}"
          BASE=/opt/gravitas-nextcloud
          ENV_FILE=/etc/gravitas/nextcloud.env
          CREDS=/etc/gravitas/nextcloud-admin-credentials
          mkdir -p "$BASE" /etc/gravitas /var/backups/gravitas-nextcloud

          if [ "$MODE" = install ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y docker.io ca-certificates curl openssl python3
            systemctl enable --now docker
          else
            systemctl is-active --quiet docker || systemctl start docker
          fi

          if [ ! -f "$ENV_FILE" ]; then
            DB_PASS="$(openssl rand -hex 24)"
            ADMIN_PASS="$(openssl rand -hex 18)"
            cat > "$ENV_FILE" <<EOF
          NC_DB_PASSWORD=$DB_PASS
          NC_ADMIN_USER=gravitascloud
          NC_ADMIN_PASSWORD=$ADMIN_PASS
          EOF
            chmod 600 "$ENV_FILE"
            printf 'url=https://%s/nextcloud/\nusername=gravitascloud\npassword=%s\n' "$DOMAIN" "$ADMIN_PASS" > "$CREDS"
            chmod 600 "$CREDS"
          fi
          # shellcheck disable=SC1090
          . "$ENV_FILE"

          docker network inspect gravitas-nextcloud >/dev/null 2>&1 || docker network create gravitas-nextcloud >/dev/null
          docker volume inspect gravitas_nextcloud_db >/dev/null 2>&1 || docker volume create gravitas_nextcloud_db >/dev/null
          docker volume inspect gravitas_nextcloud_html >/dev/null 2>&1 || docker volume create gravitas_nextcloud_html >/dev/null

          if [ "$MODE" = install ]; then
            docker pull postgres:16-alpine >/dev/null
            docker pull redis:7-alpine >/dev/null
            docker pull nextcloud:stable-apache >/dev/null
          fi

          ensure_container() {
            name="$1"
            shift
            if docker container inspect "$name" >/dev/null 2>&1; then
              docker start "$name" >/dev/null 2>&1 || true
            else
              docker run -d --name "$name" --restart unless-stopped "$@" >/dev/null
            fi
          }

          ensure_container gravitas-nextcloud-db \
            --network gravitas-nextcloud \
            -e POSTGRES_DB=nextcloud \
            -e POSTGRES_USER=nextcloud \
            -e POSTGRES_PASSWORD="$NC_DB_PASSWORD" \
            -v gravitas_nextcloud_db:/var/lib/postgresql/data \
            postgres:16-alpine

          ensure_container gravitas-nextcloud-redis \
            --network gravitas-nextcloud \
            redis:7-alpine redis-server --appendonly yes

          ensure_container gravitas-nextcloud \
            --network gravitas-nextcloud \
            -p 127.0.0.1:8081:80 \
            -e POSTGRES_HOST=gravitas-nextcloud-db \
            -e POSTGRES_DB=nextcloud \
            -e POSTGRES_USER=nextcloud \
            -e POSTGRES_PASSWORD="$NC_DB_PASSWORD" \
            -e REDIS_HOST=gravitas-nextcloud-redis \
            -e NEXTCLOUD_ADMIN_USER="$NC_ADMIN_USER" \
            -e NEXTCLOUD_ADMIN_PASSWORD="$NC_ADMIN_PASSWORD" \
            -e NEXTCLOUD_TRUSTED_DOMAINS="$DOMAIN" \
            -e TRUSTED_PROXIES=172.16.0.0/12 \
            -e OVERWRITEHOST="$DOMAIN" \
            -e OVERWRITEPROTOCOL=https \
            -e OVERWRITEWEBROOT=/nextcloud \
            -e OVERWRITECLIURL="https://$DOMAIN/nextcloud" \
            -v gravitas_nextcloud_html:/var/www/html \
            nextcloud:stable-apache

          # The deploy workflow rewrites this Nginx file on every release. Reinsert
          # the proxy block idempotently after every successful Gravitas deploy.
          python3 - "$DOMAIN" <<'PY'
          from pathlib import Path
          import re, sys
          domain = sys.argv[1]
          p = Path('/etc/nginx/sites-available/gravitas')
          if not p.exists():
              raise SystemExit('Gravitas nginx config is missing')
          s = p.read_text()
          s = re.sub(r'\n\s*# BEGIN GRAVITAS NEXTCLOUD.*?# END GRAVITAS NEXTCLOUD\s*\n', '\n', s, flags=re.S)
          block = r'''
              # BEGIN GRAVITAS NEXTCLOUD
              location = /nextcloud { return 301 /nextcloud/; }
              location = /.well-known/carddav { return 301 /nextcloud/remote.php/dav; }
              location = /.well-known/caldav { return 301 /nextcloud/remote.php/dav; }
              location ^~ /nextcloud/ {
                  proxy_pass http://127.0.0.1:8081/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header X-Forwarded-Host $host;
                  proxy_set_header X-Forwarded-Prefix /nextcloud;
                  proxy_request_buffering off;
                  proxy_buffering off;
                  client_max_body_size 2G;
                  proxy_connect_timeout 60s;
                  proxy_send_timeout 3600s;
                  proxy_read_timeout 3600s;
              }
              # END GRAVITAS NEXTCLOUD
          '''
          needle = '              location / {'
          pos = s.find(needle)
          if pos < 0:
              raise SystemExit('Could not find Gravitas frontend location in nginx config')
          s = s[:pos] + block + '\n' + s[pos:]
          p.write_text(s)
          PY
          nginx -t
          systemctl reload nginx

          # Wait for the app and finish the server-side configuration.
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8081/status.php >/tmp/nc-status.json 2>/dev/null; then
              break
            fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:8081/status.php >/tmp/nc-status.json

          # occ may need a few extra seconds after the HTTP endpoint appears.
          for i in $(seq 1 30); do
            if docker exec -u www-data gravitas-nextcloud php occ status >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec -u www-data gravitas-nextcloud php occ config:system:set overwrite.cli.url --value="https://$DOMAIN/nextcloud" >/dev/null
          docker exec -u www-data gravitas-nextcloud php occ config:system:set overwritewebroot --value=/nextcloud >/dev/null
          docker exec -u www-data gravitas-nextcloud php occ config:system:set overwriteprotocol --value=https >/dev/null
          docker exec -u www-data gravitas-nextcloud php occ config:system:set default_phone_region --value=DE >/dev/null
          docker exec -u www-data gravitas-nextcloud php occ background:cron >/dev/null
          docker exec -u www-data gravitas-nextcloud php occ config:system:set maintenance_window_start --type=integer --value=1 >/dev/null || true

          cat > /etc/systemd/system/gravitas-nextcloud-cron.service <<'EOF'
          [Unit]
          Description=Nextcloud background jobs for Gravitas
          Requires=docker.service
          After=docker.service
          [Service]
          Type=oneshot
          ExecStart=/usr/bin/docker exec -u www-data gravitas-nextcloud php -f /var/www/html/cron.php
          EOF
          cat > /etc/systemd/system/gravitas-nextcloud-cron.timer <<'EOF'
          [Unit]
          Description=Run Gravitas Nextcloud background jobs every 5 minutes
          [Timer]
          OnBootSec=3min
          OnUnitActiveSec=5min
          Persistent=true
          [Install]
          WantedBy=timers.target
          EOF
          systemctl daemon-reload
          systemctl enable --now gravitas-nextcloud-cron.timer

          cat > /usr/local/sbin/gravitas-nextcloud-backup <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR=/var/backups/gravitas-nextcloud
          STAMP=$(date +%Y%m%d-%H%M%S)
          mkdir -p "$DIR"
          docker exec -u www-data gravitas-nextcloud php occ maintenance:mode --on >/dev/null || true
          trap 'docker exec -u www-data gravitas-nextcloud php occ maintenance:mode --off >/dev/null 2>&1 || true' EXIT
          docker exec gravitas-nextcloud-db pg_dump -U nextcloud -Fc nextcloud > "$DIR/db-$STAMP.dump"
          docker run --rm -v gravitas_nextcloud_html:/source:ro -v "$DIR":/backup alpine:3.20 \
            sh -c "tar -czf /backup/html-$STAMP.tar.gz -C /source config custom_apps data 2>/dev/null || tar -czf /backup/html-$STAMP.tar.gz -C /source config data"
          find "$DIR" -type f -mtime +7 -delete
          EOF
          chmod 750 /usr/local/sbin/gravitas-nextcloud-backup
          cat > /etc/systemd/system/gravitas-nextcloud-backup.service <<'EOF'
          [Unit]
          Description=Backup Gravitas Nextcloud
          Requires=docker.service
          After=docker.service
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/gravitas-nextcloud-backup
          EOF
          cat > /etc/systemd/system/gravitas-nextcloud-backup.timer <<'EOF'
          [Unit]
          Description=Daily Gravitas Nextcloud backup
          [Timer]
          OnCalendar=*-*-* 04:15:00
          Persistent=true
          RandomizedDelaySec=15m
          [Install]
          WantedBy=timers.target
          EOF
          systemctl daemon-reload
          systemctl enable --now gravitas-nextcloud-backup.timer

          docker exec -u www-data gravitas-nextcloud php occ status
          curl -fsS "https://$DOMAIN/nextcloud/status.php"
          SCRIPT
            install -m 750 /tmp/gravitas-nextcloud-ensure /usr/local/sbin/gravitas-nextcloud-ensure
          }

          if [ "$MODE" = install ] || [ ! -x /usr/local/sbin/gravitas-nextcloud-ensure ]; then
            $SUDO bash -c "$(declare -f install_script); install_script"
          fi
          $SUDO /usr/local/sbin/gravitas-nextcloud-ensure "$DOMAIN" "$MODE"
          REMOTE

      - name: Verify public endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -4 -fsS --retry 12 --retry-delay 5 --connect-timeout 8 --max-time 25 \
            "https://$DOMAIN/nextcloud/status.php" | tee /tmp/status.json
          grep -q '"installed":true' /tmp/status.json
          echo "Nextcloud is live at https://$DOMAIN/nextcloud/"

      - name: Export one-day admin credential artifact
        if: github.event_name != 'workflow_run'
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/gravitas_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@${{ secrets.DEPLOY_HOST }}" \
            'sudo cat /etc/gravitas/nextcloud-admin-credentials' > nextcloud-admin-credentials.txt

      - name: Upload one-day credential artifact
        if: github.event_name != 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-admin-credentials
          path: nextcloud-admin-credentials.txt
          retention-days: 1
          if-no-files-found: error
