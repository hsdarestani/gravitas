name: Verify Gravitas SEO Output

on:
  workflow_run:
    workflows: ["Deploy Gravitas to Strato"]
    types: [completed]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify public prelaunch SEO and privacy output
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://gravitasplus.com
          curl -4 -fsSL "$BASE/" > "$RUNNER_TEMP/home.html"
          curl -4 -fsSL "$BASE/dossiers.html" > "$RUNNER_TEMP/dossiers.html"
          curl -4 -fsSL "$BASE/robots.txt" > "$RUNNER_TEMP/robots.txt"
          curl -4 -fsSL "$BASE/sitemap.xml" > "$RUNNER_TEMP/sitemap.xml"
          curl -4 -fsSI "$BASE/" > "$RUNNER_TEMP/headers.txt"

          grep -Fq '<link rel="canonical" href="https://gravitasplus.com/">' "$RUNNER_TEMP/home.html"
          grep -Fq '<link rel="canonical" href="https://gravitasplus.com/dossiers.html">' "$RUNNER_TEMP/dossiers.html"
          grep -Fq '<meta name="robots" content="noindex, nofollow">' "$RUNNER_TEMP/home.html"
          tr -d '\r' < "$RUNNER_TEMP/headers.txt" | grep -qi '^X-Robots-Tag: noindex, nofollow$'

          grep -Fq 'Sitemap: https://gravitasplus.com/sitemap.xml' "$RUNNER_TEMP/robots.txt"
          grep -Fq 'Disallow: /admin/' "$RUNNER_TEMP/robots.txt"
          grep -Fq 'Disallow: /api/' "$RUNNER_TEMP/robots.txt"
          grep -Fq '<loc>https://gravitasplus.com/</loc>' "$RUNNER_TEMP/sitemap.xml"
          ! grep -q '/admin/' "$RUNNER_TEMP/sitemap.xml"
          ! grep -q '/api/' "$RUNNER_TEMP/sitemap.xml"
          ! grep -q '/account' "$RUNNER_TEMP/sitemap.xml"

          ! grep -q '312K' "$RUNNER_TEMP/home.html"
          ! grep -q '418K views' "$RUNNER_TEMP/home.html"
          ! grep -q 'fonts.googleapis.com' "$RUNNER_TEMP/home.html"
          ! grep -q 'fonts.gstatic.com' "$RUNNER_TEMP/home.html"

          echo gravitas-prelaunch-seo-gate-passed
