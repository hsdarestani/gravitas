name: Verify Gravitas SEO Output

on:
  pull_request:
    paths:
      - 'index.html'
      - 'dossiers.html'
      - 'topics.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'ops/verify_seo_output.sh'
      - '.github/workflows/verify-seo-output.yml'
  workflow_run:
    workflows: ["Deploy Gravitas to Strato"]
    types: [completed]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current public metadata and verification script
        run: |
          set -euo pipefail
          bash -n ops/verify_seo_output.sh
          grep -Fq '<link rel="canonical" href="https://graviquest.com/">' index.html
          grep -Fq '<link rel="canonical" href="https://graviquest.com/topics.html">' dossiers.html
          grep -Fq '<meta name="robots" content="noindex, follow">' dossiers.html
          grep -Fq 'Sitemap: https://graviquest.com/sitemap.xml' robots.txt

  verify:
    if: >-
      ${{ github.event_name != 'pull_request' &&
          (github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify published canonical URLs and privacy gates
        shell: bash
        run: bash ops/verify_seo_output.sh
