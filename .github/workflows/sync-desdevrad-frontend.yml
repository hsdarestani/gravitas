name: Sync frontend from Kiarash

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-desdevrad-frontend.yml'
      - '.sync-desdevrad-trigger'

permissions:
  contents: write
  actions: write

concurrency:
  group: gravitas-upstream-frontend-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mirror latest Kiarash frontend and preserve production integrations
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_REPO='kiaa-raad/gravitasplus'
          UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}.git"
          PREVIOUS="$(cat .upstream-gravitasplus 2>/dev/null || true)"
          [ -n "$PREVIOUS" ] || PREVIOUS='4cb9c0ed0f12bcdc8b3277deadde1b818dd5d72f'

          rm -rf /tmp/gravitasplus-upstream
          git clone -q "$UPSTREAM_URL" /tmp/gravitasplus-upstream
          UPSTREAM_SHA="$(git -C /tmp/gravitasplus-upstream rev-parse HEAD)"

          echo "Previous upstream: $PREVIOUS"
          echo "Latest upstream:   $UPSTREAM_SHA"

          if ! git -C /tmp/gravitasplus-upstream cat-file -e "${PREVIOUS}^{commit}" 2>/dev/null; then
            echo "Recorded upstream revision $PREVIOUS is unavailable; refusing unsafe sync."
            exit 1
          fi

          # Apply only frontend files changed since the recorded upstream revision.
          # Thumbnails are mirrored separately below because they may pre-date the
          # recorded baseline and therefore never appear in a later delta.
          mapfile -t CHANGED < <(
            git -C /tmp/gravitasplus-upstream diff --name-only "$PREVIOUS" "$UPSTREAM_SHA" -- '*.html' 'assets/**' \
            | grep -Ev '^assets/(production-bridge\.js|local-fonts\.css|fonts/|thumbnails/|upstream-[^/]+\.css$)' || true
          )

          if [ "${#CHANGED[@]}" -gt 0 ]; then
            printf 'Frontend changes from Kiarash:\n'
            printf ' - %s\n' "${CHANGED[@]}"

            # The public frontend is Kiarash's source of truth. Copy every changed
            # frontend file exactly, while never touching our backend, workflows,
            # self-hosted fonts or production API bridge. Deletions are mirrored too.
            for f in "${CHANGED[@]}"; do
              case "$f" in
                *.html|assets/*)
                  if [ -e "/tmp/gravitasplus-upstream/$f" ]; then
                    mkdir -p "$(dirname "$f")"
                    cp -a "/tmp/gravitasplus-upstream/$f" "$f"
                  else
                    rm -f "$f"
                  fi
                  ;;
              esac
            done
          else
            echo 'No text/frontend delta since the recorded upstream revision.'
          fi

          # Binary artwork must be repaired even when PREVIOUS == UPSTREAM_SHA.
          # These posters were added before one of our old sync baselines, which is
          # why a perfectly valid delta sync could still leave the folder absent.
          rm -rf assets/thumbnails
          if [ -d /tmp/gravitasplus-upstream/assets/thumbnails ]; then
            mkdir -p assets
            cp -a /tmp/gravitasplus-upstream/assets/thumbnails assets/thumbnails
          fi

          printf '%s\n' "$UPSTREAM_SHA" > .upstream-gravitasplus

          # Keep production-only functionality without changing Kiarash's visual
          # system: local fonts, cache-busting and the real API bridge.
          python3 - "$UPSTREAM_SHA" <<'PY'
          from pathlib import Path
          import re, sys

          sha = sys.argv[1]
          token = 'up-' + sha[:12]

          for p in Path('.').glob('*.html'):
              s = p.read_text()

              # Retire old emergency parity stylesheet if it is still referenced.
              s = re.sub(r'\s*<link[^>]+href=["\']assets/upstream-[^"\']+\.css(?:\?[^"\']*)?["\'][^>]*>\s*', '\n', s)

              # The production server must not depend on Google Fonts being
              # reachable. DM Sans / DM Mono are self-hosted locally.
              s = re.sub(r'\s*<link[^>]+href=["\']https://fonts\.googleapis\.com/[^"\']+["\'][^>]*>\s*', '\n', s)
              s = re.sub(r'\s*<link[^>]+href=["\']https://fonts\.gstatic\.com[^"\']*["\'][^>]*>\s*', '\n', s)
              s = re.sub(r'\s*<link[^>]+rel=["\']preconnect["\'][^>]+fonts\.(?:googleapis|gstatic)\.com[^>]*>\s*', '\n', s)

              if 'assets/gravitas.css' in s and 'assets/local-fonts.css' not in s:
                  s = re.sub(
                      r'(<link[^>]+href=["\']assets/gravitas\.css(?:\?[^"\']*)?["\'][^>]*>)',
                      f'<link rel="stylesheet" href="assets/local-fonts.css?v={token}">\n\\1',
                      s, count=1
                  )

              # Cache-bust every shared frontend asset changed by Kiarash, plus
              # our local font/parity layer so production cannot keep its previous
              # copy when the upstream SHA itself did not change.
              s = re.sub(
                  r'assets/(gravitas|site|hero|chat|brand)\.(css|js)(?:\?v=[^"\']*)?',
                  lambda m: f'assets/{m.group(1)}.{m.group(2)}?v={token}',
                  s
              )
              s = re.sub(
                  r'assets/local-fonts\.css(?:\?v=[^"\']*)?',
                  f'assets/local-fonts.css?v={token}',
                  s
              )

              # All public app pages use our real backend bridge. brand.html is
              # documentation and intentionally remains a pure frontend page.
              if p.name != 'brand.html':
                  s = re.sub(r'\s*<script[^>]+src=["\']assets/production-bridge\.js(?:\?v=[^"\']*)?["\'][^>]*></script>\s*', '\n', s)
                  s = s.replace('</body>', f'<script src="assets/production-bridge.js?v={token}" defer></script>\n</body>', 1)

              p.write_text(s)

          # Production password policy is 10 chars even if the visual prototype
          # is looser. This changes validation only, not layout.
          account = Path('account.html')
          if account.exists():
              s = account.read_text()
              s = s.replace('minlength="8"', 'minlength="10"')
              s = s.replace('at least eight characters', 'at least ten characters')
              s = s.replace('at least 8 characters', 'at least 10 characters')
              account.write_text(s)

          # The live domain has repeatedly served the hero stat row without the
          # generated separator dots even though hero.css itself matches upstream.
          # Make the two separators literal children of their facts so wrapping can
          # never strand them, disable the generated copies, and explicitly retain
          # the members underline. This is a tiny production parity guard and is
          # re-applied after every upstream sync without changing Kiarash's files.
          index = Path('index.html')
          if index.exists():
              s = index.read_text()
              old = re.compile(
                  r'<p class="lp-hero__credit">\s*'
                  r'<span>New topic monthly</span>\s*'
                  r'<span><span class="g-nums">312K</span> subscribers</span>\s*'
                  r'<span><a href="community\.html#join">4,100 members</a></span>\s*'
                  r'</p>', re.S
              )
              new = '''<p class="lp-hero__credit">
          <span>New topic monthly</span>
          <span><span class="lp-hero__literal-sep" aria-hidden="true">•</span><span class="g-nums">312K</span> subscribers</span>
          <span><span class="lp-hero__literal-sep" aria-hidden="true">•</span><a href="community.html#join">4,100 members</a></span>
        </p>'''
              s, n = old.subn(new, s, count=1)
              if n == 0 and 'lp-hero__literal-sep' not in s:
                  raise SystemExit('Could not locate hero stat row for production parity guard')

              style = '''<style id="production-hero-stat-parity">
.lp-hero__credit > span + span::before { content: none !important; }
.lp-hero__credit .lp-hero__literal-sep { color: var(--g-border-strong); font-size: .65em; line-height: 1; flex: none; }
.lp-hero__credit a { text-decoration-line: underline; text-underline-offset: .2em; }
</style>'''
              s = re.sub(r'\s*<style id="production-hero-stat-parity">.*?</style>\s*', '\n', s, flags=re.S)
              s = s.replace('</head>', style + '\n</head>', 1)
              index.write_text(s)
          PY

          # Smoke checks for the current upstream generation and the homepage
          # details that previously drifted on production.
          grep -q -- '--g-ic-dim' assets/gravitas.css
          grep -q 'g-nav__ic' assets/site.css
          grep -q 'space__ic' index.html
          grep -q 'Reading time' index.html
          grep -q 'lp-hero__credit' assets/hero.css
          grep -q 'lp-hero__literal-sep' index.html
          grep -q 'production-hero-stat-parity' index.html
          test -f assets/icons/topics.svg
          test -f assets/icons/signin.svg
          test -f assets/thumbnails/topic-computable-universe.webp
          test -f assets/thumbnails/topic-machine-hypothesis.webp
          test -f assets/production-bridge.js
          test -f assets/local-fonts.css
          grep -q 'assets/production-bridge.js?v=up-' index.html

          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo 'No repository changes after normalization.'
            exit 0
          fi

          git config user.name 'Hossein Darestani'
          git config user.email '45485005+hsdarestani@users.noreply.github.com'
          git add -- '*.html' assets .upstream-gravitasplus
          git commit -m "Sync frontend from kiaa-raad/gravitasplus ${UPSTREAM_SHA:0:12}"
          git push origin HEAD:main

      - name: Deploy synchronized production revision
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
          echo 'Production deployment dispatched.'

          SHA="$(cat .upstream-gravitasplus)"
          TOKEN="up-${SHA:0:12}"
          URL="https://gravitasplus.com/?sync=${SHA:0:12}-${GITHUB_RUN_ID}"
          echo "Waiting for production to serve $TOKEN and hero parity guard..."
          ok=0
          for attempt in $(seq 1 72); do
            HTML="$(curl -4 -fsS --connect-timeout 8 --max-time 20 -H 'Cache-Control: no-cache' "$URL" || true)"
            if printf '%s' "$HTML" | grep -q "$TOKEN" \
              && printf '%s' "$HTML" | grep -q 'production-hero-stat-parity' \
              && printf '%s' "$HTML" | grep -q 'lp-hero__literal-sep'; then
              ok=1
              echo "Production frontend verified on attempt $attempt."
              break
            fi
            sleep 10
          done
          [ "$ok" -eq 1 ] || { echo 'Production did not converge to the synchronized hero/frontend revision in time.'; exit 1; }
