name: Sync frontend from desdevrad

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-desdevrad-frontend.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: gravitas-upstream-frontend-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply latest desdevrad frontend delta without touching backend
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_REPO='desdevrad/gravitasplus'
          UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}.git"
          PREVIOUS="$(cat .upstream-gravitasplus 2>/dev/null || true)"
          [ -n "$PREVIOUS" ] || PREVIOUS='8f1a959841403f6563000a5ef6a086aed8eab7d2'

          rm -rf /tmp/gravitasplus-upstream
          git clone -q "$UPSTREAM_URL" /tmp/gravitasplus-upstream
          UPSTREAM_SHA="$(git -C /tmp/gravitasplus-upstream rev-parse HEAD)"

          echo "Previous upstream: $PREVIOUS"
          echo "Latest upstream:   $UPSTREAM_SHA"

          if [ "$PREVIOUS" = "$UPSTREAM_SHA" ]; then
            echo 'Already synchronized.'
            exit 0
          fi

          if ! git -C /tmp/gravitasplus-upstream cat-file -e "${PREVIOUS}^{commit}" 2>/dev/null; then
            echo "Recorded upstream revision $PREVIOUS is not available; refusing an unsafe full overwrite."
            exit 1
          fi

          # Build a patch containing only public frontend files. This deliberately
          # excludes upstream workflows/README and never touches backend/, our
          # production bridge, deployment config, legal files, or local fonts.
          mapfile -t CHANGED < <(
            git -C /tmp/gravitasplus-upstream diff --name-only "$PREVIOUS" "$UPSTREAM_SHA" -- \
              '*.html' 'assets/**' \
            | grep -Ev '^assets/(production-bridge\.js|local-fonts\.css|fonts/)' || true
          )

          if [ "${#CHANGED[@]}" -eq 0 ]; then
            printf '%s\n' "$UPSTREAM_SHA" > .upstream-gravitasplus
          else
            printf 'Frontend files changed upstream:\n'
            printf ' - %s\n' "${CHANGED[@]}"

            git -C /tmp/gravitasplus-upstream diff --binary --full-index "$PREVIOUS" "$UPSTREAM_SHA" -- "${CHANGED[@]}" > /tmp/upstream-frontend.patch

            # Apply only the delta, not whole upstream pages. That preserves our
            # real auth/newsletter/community/backend wiring while taking Kiarash's
            # visual/content fixes exactly where he changed them.
            if ! git apply --check --whitespace=nowarn /tmp/upstream-frontend.patch; then
              echo 'Upstream frontend patch conflicts with a local production edit.'
              git apply --check --verbose --whitespace=nowarn /tmp/upstream-frontend.patch || true
              exit 1
            fi
            git apply --whitespace=nowarn /tmp/upstream-frontend.patch

            printf '%s\n' "$UPSTREAM_SHA" > .upstream-gravitasplus
          fi

          # Production invariants: keep self-hosted fonts and real API bridge even
          # when an upstream hunk changes adjacent head/footer markup.
          python3 - "$UPSTREAM_SHA" <<'PY'
          from pathlib import Path
          import re, sys

          sha = sys.argv[1]
          token = 'up-' + sha[:12]

          for p in Path('.').glob('*.html'):
              s = p.read_text()

              if 'assets/gravitas.css' in s and 'assets/local-fonts.css' not in s:
                  s = re.sub(
                      r'(<link[^>]+href=["\']assets/gravitas\.css(?:\?[^"\']*)?["\'][^>]*>)',
                      '<link rel="stylesheet" href="assets/local-fonts.css?v=local1">\n\\1',
                      s, count=1
                  )

              # Keep Kiarash's frontend files fresh on production after every sync.
              s = re.sub(
                  r'assets/(gravitas|site|hero|chat)\.(css|js)(?:\?v=[^"\']*)?',
                  lambda m: f'assets/{m.group(1)}.{m.group(2)}?v={token}',
                  s
              )

              # brand.html is documentation only; public app pages retain the
              # bridge that turns demo forms/account interactions into real APIs.
              if p.name != 'brand.html' and 'assets/production-bridge.js' not in s:
                  s = s.replace('</body>', f'<script src="assets/production-bridge.js?v={token}" defer></script>\n</body>', 1)

              p.write_text(s)

          # Keep the post-deploy parity helper from pinning an obsolete cache key.
          p = Path('.github/workflows/fix-frontend-parity-after-deploy.yml')
          if p.exists():
              s = p.read_text()
              s = re.sub(r"TOKEN='[^']+'", 'TOKEN="${{ github.event.workflow_run.head_sha }}"', s)
              s = re.sub(
                  r"grep -q ['\"]assets/hero\.css\?v=[^'\"]+['\"] index\.html",
                  'grep -q "assets/hero.css?v=${TOKEN}" index.html',
                  s
              )
              p.write_text(s)
          PY

          # Sanity checks for the latest upstream pass.
          grep -q 'gh-nav-signin' index.html
          grep -q -- '--gh-control' assets/site.css
          grep -q 'Layer 01.*Video\|Video' topic-computable-universe.html
          test -f assets/production-bridge.js
          test -f assets/local-fonts.css

          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo 'No repository changes after normalization.'
            exit 0
          fi

          git config user.name 'Hossein Darestani'
          git config user.email '45485005+hsdarestani@users.noreply.github.com'
          git add -- '*.html' assets .upstream-gravitasplus .github/workflows/fix-frontend-parity-after-deploy.yml
          git commit -m "Sync frontend from desdevrad/gravitasplus ${UPSTREAM_SHA:0:12}"
          git push origin HEAD:main

      - name: Deploy synchronized production revision
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
          echo 'Production deployment dispatched.'
