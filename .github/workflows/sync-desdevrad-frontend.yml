name: Sync frontend from desdevrad

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-desdevrad-frontend.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: gravitas-upstream-frontend-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mirror latest Kiarash frontend and preserve production integrations
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_REPO='desdevrad/gravitasplus'
          UPSTREAM_URL="https://github.com/${UPSTREAM_REPO}.git"
          PREVIOUS="$(cat .upstream-gravitasplus 2>/dev/null || true)"
          [ -n "$PREVIOUS" ] || PREVIOUS='4cb9c0ed0f12bcdc8b3277deadde1b818dd5d72f'

          rm -rf /tmp/gravitasplus-upstream
          git clone -q "$UPSTREAM_URL" /tmp/gravitasplus-upstream
          UPSTREAM_SHA="$(git -C /tmp/gravitasplus-upstream rev-parse HEAD)"

          echo "Previous upstream: $PREVIOUS"
          echo "Latest upstream:   $UPSTREAM_SHA"

          if [ "$PREVIOUS" = "$UPSTREAM_SHA" ]; then
            echo 'Already synchronized.'
            exit 0
          fi

          if ! git -C /tmp/gravitasplus-upstream cat-file -e "${PREVIOUS}^{commit}" 2>/dev/null; then
            echo "Recorded upstream revision $PREVIOUS is unavailable; refusing unsafe sync."
            exit 1
          fi

          mapfile -t CHANGED < <(
            git -C /tmp/gravitasplus-upstream diff --name-only "$PREVIOUS" "$UPSTREAM_SHA" -- '*.html' 'assets/**' \
            | grep -Ev '^assets/(production-bridge\.js|local-fonts\.css|fonts/|upstream-[^/]+\.css$)' || true
          )

          printf 'Frontend changes from Kiarash:\n'
          printf ' - %s\n' "${CHANGED[@]}"

          # The public frontend is Kiarash's source of truth. Copy every changed
          # frontend file exactly, while never touching our backend, workflows,
          # self-hosted fonts or production API bridge. Deletions are mirrored too.
          for f in "${CHANGED[@]}"; do
            case "$f" in
              *.html|assets/*)
                if [ -e "/tmp/gravitasplus-upstream/$f" ]; then
                  mkdir -p "$(dirname "$f")"
                  cp -a "/tmp/gravitasplus-upstream/$f" "$f"
                else
                  rm -f "$f"
                fi
                ;;
            esac
          done

          printf '%s\n' "$UPSTREAM_SHA" > .upstream-gravitasplus

          # Keep production-only functionality without changing Kiarash's visual
          # system: local fonts, cache-busting and the real API bridge.
          python3 - "$UPSTREAM_SHA" <<'PY'
          from pathlib import Path
          import re, sys

          sha = sys.argv[1]
          token = 'up-' + sha[:12]

          for p in Path('.').glob('*.html'):
              s = p.read_text()

              # Retire old emergency parity stylesheet if it is still referenced.
              s = re.sub(r'\s*<link[^>]+href=["\']assets/upstream-[^"\']+\.css(?:\?[^"\']*)?["\'][^>]*>\s*', '\n', s)

              # The production server must not depend on Google Fonts being
              # reachable. DM Sans / DM Mono are self-hosted locally.
              s = re.sub(r'\s*<link[^>]+href=["\']https://fonts\.googleapis\.com/[^"\']+["\'][^>]*>\s*', '\n', s)
              s = re.sub(r'\s*<link[^>]+href=["\']https://fonts\.gstatic\.com[^"\']*["\'][^>]*>\s*', '\n', s)
              s = re.sub(r'\s*<link[^>]+rel=["\']preconnect["\'][^>]+fonts\.(?:googleapis|gstatic)\.com[^>]*>\s*', '\n', s)

              if 'assets/gravitas.css' in s and 'assets/local-fonts.css' not in s:
                  s = re.sub(
                      r'(<link[^>]+href=["\']assets/gravitas\.css(?:\?[^"\']*)?["\'][^>]*>)',
                      f'<link rel="stylesheet" href="assets/local-fonts.css?v={token}">\n\\1',
                      s, count=1
                  )

              # Cache-bust every shared frontend asset changed by Kiarash.
              s = re.sub(
                  r'assets/(gravitas|site|hero|chat|brand)\.(css|js)(?:\?v=[^"\']*)?',
                  lambda m: f'assets/{m.group(1)}.{m.group(2)}?v={token}',
                  s
              )

              # All public app pages use our real backend bridge. brand.html is
              # documentation and intentionally remains a pure frontend page.
              if p.name != 'brand.html':
                  s = re.sub(r'\s*<script[^>]+src=["\']assets/production-bridge\.js(?:\?[^"\']*)?["\'][^>]*></script>\s*', '\n', s)
                  s = s.replace('</body>', f'<script src="assets/production-bridge.js?v={token}" defer></script>\n</body>', 1)

              p.write_text(s)

          # Production password policy is 10 chars even if the visual prototype
          # is looser. This changes validation only, not layout.
          account = Path('account.html')
          if account.exists():
              s = account.read_text()
              s = s.replace('minlength="8"', 'minlength="10"')
              s = s.replace('at least eight characters', 'at least ten characters')
              s = s.replace('at least 8 characters', 'at least 10 characters')
              account.write_text(s)
          PY

          # Smoke checks for the current upstream generation: new icon system,
          # full-size logo rules and the production bridge must all be present.
          grep -q -- '--g-ic-dim' assets/gravitas.css
          grep -q 'g-nav__ic' assets/site.css
          grep -q 'space__ic' index.html
          test -f assets/icons/topics.svg
          test -f assets/icons/signin.svg
          test -f assets/production-bridge.js
          test -f assets/local-fonts.css
          grep -q 'assets/production-bridge.js?v=up-' index.html

          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo 'No repository changes after normalization.'
            exit 0
          fi

          git config user.name 'Hossein Darestani'
          git config user.email '45485005+hsdarestani@users.noreply.github.com'
          git add -- '*.html' assets .upstream-gravitasplus
          git commit -m "Sync frontend from desdevrad/gravitasplus ${UPSTREAM_SHA:0:12}"
          git push origin HEAD:main

      - name: Deploy synchronized production revision
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
          echo 'Production deployment dispatched.'
