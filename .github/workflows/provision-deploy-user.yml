name: Provision Gravitas deploy user

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || '22' }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Provision deploy account
        shell: bash
        run: |
          set -euo pipefail
          PORT="${{ secrets.DEPLOY_PORT || '22' }}"
          HOST="${{ secrets.DEPLOY_HOST }}"
          PUBKEY="$(ssh-keygen -y -f ~/.ssh/key)"
          PUBKEY_B64="$(printf '%s' "$PUBKEY" | base64 -w0)"
          scp -i ~/.ssh/key -P "$PORT" infra/provision-deploy-user.sh "root@$HOST:/tmp/provision-deploy-user.sh"
          ssh -i ~/.ssh/key -p "$PORT" "root@$HOST" "PUBKEY=\$(printf '%s' '$PUBKEY_B64' | base64 -d); bash /tmp/provision-deploy-user.sh \"\$PUBKEY\""
          ssh -i ~/.ssh/key -p "$PORT" -o BatchMode=yes "deploy@$HOST" 'sudo -n true && echo deploy-user-ok'
