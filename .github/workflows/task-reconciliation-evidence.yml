name: Read-only Team Task Reconciliation Evidence
# Refresh production evidence during the approved migration.

on:
  push:
    branches: [codex/team-task-reconciliation-20261015]
    paths:
      - 'backend/core/task_reconciliation_export.py'
      - 'backend/core/test_task_reconciliation_export.py'
      - 'ops/export_task_reconciliation.py'
      - 'ops/reconciliation_transport.py'
      - '.github/workflows/task-reconciliation-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test exporter
        run: |
          python3 -m venv "$RUNNER_TEMP/tests"
          "$RUNNER_TEMP/tests/bin/pip" install -q -r backend/requirements.txt
          cd backend
          "$RUNNER_TEMP/tests/bin/python" -m django test core.test_task_reconciliation_export --settings=gravitas_backend.test_settings --noinput
      - name: Collect authorized read-only evidence without deploying
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST"
          PORT="${SSH_PORT:-22}"
          REMOTE_USER="${SSH_USER:-deploy}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/reconciliation
          chmod 600 ~/.ssh/reconciliation
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/reconciliation -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10)
          if ! ssh "${OPTS[@]}" "$REMOTE_USER@$SSH_HOST" true 2>/dev/null; then
            if [ "$REMOTE_USER" != root ] && ssh "${OPTS[@]}" "root@$SSH_HOST" true 2>/dev/null; then
              REMOTE_USER=root
            else
              echo 'Production SSH authentication failed' >&2
              exit 1
            fi
          fi
          STEM="/tmp/graviquest-reconciliation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'ssh "${OPTS[@]}" "$REMOTE_USER@$SSH_HOST" "rm -f $STEM-run.py $STEM-module.py" || true' EXIT
          scp -i ~/.ssh/reconciliation -P "$PORT" ops/export_task_reconciliation.py "$REMOTE_USER@$SSH_HOST:$STEM-run.py"
          scp -i ~/.ssh/reconciliation -P "$PORT" backend/core/task_reconciliation_export.py "$REMOTE_USER@$SSH_HOST:$STEM-module.py"
          ssh "${OPTS[@]}" "$REMOTE_USER@$SSH_HOST" "bash -s -- '$STEM'" > task-reconciliation.json <<'REMOTE'
          set -euo pipefail
          STEM="$1"
          SECRET="$(sudo awk -F= '/^DJANGO_SECRET_KEY=/{print $2}' /etc/gravitas/backend.env)"
          cd /opt/gravitas-backend
          sudo -u gravitas env DJANGO_SECRET_KEY="$SECRET" DJANGO_DEBUG=0 \
            DJANGO_SETTINGS_MODULE=gravitas_backend.settings PYTHONPATH=/opt/gravitas-backend \
            /opt/gravitas-backend/.venv/bin/python "$STEM-run.py" --module "$STEM-module.py"
          REMOTE
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('task-reconciliation.json').read_text())
          assert data['read_only'] is True
          print(f"Evidence: {data['count']} tasks, {len(data['projects'])} projects")
          PY
          scp -i ~/.ssh/reconciliation -P "$PORT" ops/reconciliation_transport.py "$REMOTE_USER@$SSH_HOST:$STEM-transport.py"
          ssh "${OPTS[@]}" "$REMOTE_USER@$SSH_HOST" "sudo install -d -o gravitas -g gravitas -m 700 /var/lib/gravitas-source-migrations; sudo -u gravitas /opt/gravitas-backend/.venv/bin/python '$STEM-transport.py' public-key; rm -f '$STEM-transport.py'" > migration-transport-public.pem
      - uses: actions/upload-artifact@v4
        with:
          name: team-task-reconciliation-production
          path: |
            task-reconciliation.json
            migration-transport-public.pem
          retention-days: 1
          if-no-files-found: error
