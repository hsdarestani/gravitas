name: Gravitas Demo Readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate workspace JavaScript
        shell: bash
        run: |
          set -euo pipefail
          files=(
            assets/workspace.js
            assets/platform-v2.js
            assets/platform-v2-patches.js
            assets/platform-v2-ux.js
            assets/research-v5.js
            assets/mindmap-editor-v2.js
            assets/platform-v3-navigation.js
            assets/nextcloud-native.js
            assets/workspace-visuals.js
            assets/core-team.js
            assets/core-team-registered.js
            assets/core-team-storage.js
            assets/operating.js
            assets/operating-enhancements.js
            assets/operating-core-shell.js
            assets/roadmap-okr-sync.js
            assets/initiative-planner.js
            assets/initiative-task-editor.js
            assets/initiative-task-reorder.js
          )
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate Research V5 cockpit contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "platform/projects/<int:project_id>/cockpit/" backend/core/urls.py
          grep -q "platform/projects/<int:project_id>/access-candidates/" backend/core/urls.py
          grep -q "ProjectAuditEvent" backend/core/project_cockpit.py
          grep -q "EntityLink" backend/core/project_cockpit.py
          grep -q "connections','Connections" assets/research-v5.js
          grep -q "ctrlKey" assets/research-v5.js
          grep -q "research-v5.js" workspace.html
          grep -q "research-v5.css" workspace.html
          python -m py_compile backend/core/project_cockpit.py backend/core/test_project_cockpit.py

      - name: Validate AI mind-map editor contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "mindmap-editor-v2.js" workspace.html
          grep -q "mindmap-editor.css" workspace.html
          grep -q "Generate with AI" assets/mindmap-editor-v2.js
          grep -q "node.update" assets/mindmap-editor-v2.js
          grep -q "CLOUDFLARE_AI_ACCOUNT_ID" backend/gravitas_backend/settings.py
          grep -q "generate_mindmap_ai" backend/gravitas_backend/urls.py
          python -m py_compile backend/core/mindmap_ai.py

      - name: Validate Nextcloud provisioning scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/nextcloud/ensure.sh
          bash -n ops/nextcloud/apps.sh
          grep -q 'groupfolders required' ops/nextcloud/apps.sh
          grep -q 'Nextcloud Apps' assets/platform-v3-navigation.js
          grep -q 'project_membership_required' backend/core/nextcloud_api.py

      - name: Check Registered Users tab render contract
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('assets/core-team-registered.js', 'utf8');
          const checks = [
            ["var selected='core'", 'tab selection state must be persisted'],
            ["selected==='registered'?'':'hidden'", 'registered section visibility must follow selection'],
            ["selected=regular.getAttribute('data-ct-tab')||'core'", 'switching back to native tabs must update selection'],
            ["if(!root.querySelector('[data-ct-registered-tab]')||!root.querySelector('[data-ct-section=\"registered\"]'))schedule()", 'observer must reload only when the extension DOM is missing']
          ];
          for (const [needle, message] of checks) {
            if (!src.includes(needle)) throw new Error(message);
          }
          if (/new MutationObserver\s*\(\s*schedule\s*\)/.test(src)) {
            throw new Error('registered users observer must not self-trigger on every render');
          }
          console.log('Registered Users render-state regression contract passed.');
          NODE

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --disable-pip-version-check -q -r backend/requirements.txt

      - name: Check migrations and Django configuration
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DJANGO_SETTINGS_MODULE: gravitas_backend.test_settings
        run: |
          python -m django makemigrations --check --dry-run
          python -m django check

      - name: Run complete workspace test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DJANGO_SETTINGS_MODULE: gravitas_backend.test_settings
        run: |
          python -m django test core --verbosity 2
