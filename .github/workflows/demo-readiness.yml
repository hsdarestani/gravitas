name: Gravitas Demo Readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate workspace JavaScript
        shell: bash
        run: |
          set -euo pipefail
          # The workspace ships as ES modules under assets/ws. Older Node
          # releases parse a bare `node --check file.js` as CommonJS, so the
          # source is fed through stdin with an explicit module type instead.
          shopt -s nullglob
          modules=(assets/ws/*.js)
          if [ "${#modules[@]}" -eq 0 ]; then
            echo "No workspace modules found under assets/ws/"
            exit 1
          fi
          for file in "${modules[@]}"; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done

      - name: Validate site JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/site.js assets/space-managed-v1.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Validate workspace shell contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "assets/ws/ws.css" workspace.html
          grep -q "assets/ws/ws-app.js" workspace.html
          grep -q "assets/local-fonts.css" workspace.html

      - name: Validate Research V5 cockpit contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "platform/projects/<int:project_id>/cockpit/" backend/core/urls.py
          grep -q "platform/projects/<int:project_id>/access-candidates/" backend/core/urls.py
          grep -q "ProjectAuditEvent" backend/core/project_cockpit.py
          grep -q "EntityLink" backend/core/project_cockpit.py
          python -m py_compile backend/core/project_cockpit.py backend/core/test_project_cockpit.py

      - name: Validate AI mind-map contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "CLOUDFLARE_AI_ACCOUNT_ID" backend/gravitas_backend/settings.py
          grep -q "generate_mindmap_ai" backend/gravitas_backend/urls.py
          python -m py_compile backend/core/mindmap_ai.py

      - name: Validate Nextcloud provisioning scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n ops/nextcloud/ensure.sh
          bash -n ops/nextcloud/apps.sh
          grep -q 'groupfolders required' ops/nextcloud/apps.sh
          grep -q 'Nextcloud' assets/ws/ws-views.js
          grep -q 'project_membership_required' backend/core/nextcloud_api.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install --disable-pip-version-check -q -r backend/requirements.txt

      - name: Check migrations and Django configuration
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DJANGO_SETTINGS_MODULE: gravitas_backend.test_settings
        run: |
          python -m django makemigrations --check --dry-run
          python -m django check

      - name: Run complete workspace test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DJANGO_SETTINGS_MODULE: gravitas_backend.test_settings
        run: |
          python -m django test core --verbosity 2
