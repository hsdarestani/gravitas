name: One-time sync Kiarash frontend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-kia-frontend.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Kiarash frontend
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/desdevrad/gravitasplus.git /tmp/gravitasplus-source
          echo "SOURCE_SHA=$(git -C /tmp/gravitasplus-source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Sync frontend while preserving production backend and ops
        shell: bash
        run: |
          set -euo pipefail

          # Kiarash's repository is the frontend source of truth. Do not copy its
          # GitHub Pages workflow, README or robots.txt over the production repo.
          for f in /tmp/gravitasplus-source/*.html; do
            cp "$f" ./
          done
          mkdir -p assets
          cp -a /tmp/gravitasplus-source/assets/. assets/

          # Bridge the new static UI back to the production Django APIs.
          cat > assets/production-bridge.js <<'JS'
          (function () {
            'use strict';

            function cookie(name) {
              var prefix = name + '=';
              var parts = document.cookie ? document.cookie.split(';') : [];
              for (var i = 0; i < parts.length; i++) {
                var value = parts[i].trim();
                if (value.indexOf(prefix) === 0) return decodeURIComponent(value.slice(prefix.length));
              }
              return '';
            }

            function csrfToken() {
              return fetch('/api/auth/csrf/', {
                method: 'GET',
                credentials: 'same-origin',
                headers: { 'Accept': 'application/json' }
              }).then(function (res) {
                if (!res.ok) throw new Error('csrf');
                return cookie('csrftoken') || cookie('gravitas_staging_csrftoken');
              });
            }

            function apiPost(url, payload) {
              return csrfToken().then(function (token) {
                return fetch(url, {
                  method: 'POST',
                  credentials: 'same-origin',
                  headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                    'X-CSRFToken': token
                  },
                  body: JSON.stringify(payload || {})
                });
              }).then(function (res) {
                return res.json().catch(function () { return {}; }).then(function (data) {
                  if (!res.ok) throw data;
                  return data;
                });
              });
            }

            function noteFor(form) {
              if (!form) return null;
              if (form.id === 'p-up' || form.id === 'p-in' || form.id === 'p-reset') {
                return document.querySelector('.auth__note[data-form-note]');
              }
              return (form.parentElement && form.parentElement.querySelector('[data-form-note]')) || form.querySelector('[data-form-note]');
            }

            function setNote(form, text) {
              var note = noteFor(form);
              if (note) note.textContent = text;
            }

            function setBusy(form, busy) {
              var button = form && form.querySelector('button[type="submit"]');
              if (button) button.disabled = !!busy;
            }

            function errorText(err) {
              if (!err) return 'Something went wrong. Please try again.';
              if (err.error === 'invalid_email') return 'Please enter a valid email address.';
              if (err.error === 'account_exists') return 'An account with this email already exists.';
              if (err.error === 'invalid_credentials') return 'Email or password is incorrect.';
              if (err.error === 'invalid_or_expired_link') return 'This reset link is invalid or has expired.';
              if (err.error === 'password_invalid' && Array.isArray(err.messages) && err.messages.length) return err.messages.join(' ');
              if (err.error === 'email_delivery_failed') return 'Email delivery is temporarily unavailable. Please try again shortly.';
              return 'Something went wrong. Please try again.';
            }

            function markAccount(email) {
              var signIn = document.querySelector('.gh-signin');
              if (signIn) {
                signIn.textContent = 'Account';
                signIn.href = 'account.html';
              }
              var note = document.querySelector('.auth__note[data-form-note]');
              if (note && email) note.textContent = 'Signed in as ' + email + '.';
            }

            var params = new URLSearchParams(location.search);
            var resetUid = params.get('reset_uid') || '';
            var resetToken = params.get('reset_token') || '';
            var resetForm = document.getElementById('p-reset');
            if (resetForm && resetUid && resetToken) {
              resetForm.innerHTML =
                '<button class="auth__back" type="button" data-tab="in">' +
                  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>' +
                  'Back to sign in</button>' +
                '<h1 class="auth__h">Choose a new password.</h1>' +
                '<p class="auth__lede">Use at least ten characters.</p>' +
                '<label class="g-field"><span class="g-label">New password</span>' +
                  '<input class="g-input" name="new_password" type="password" autocomplete="new-password" minlength="10" required></label>' +
                '<button class="g-btn g-btn--primary g-btn--lg g-full" type="submit">Set new password</button>';
              resetForm.hidden = false;
            }

            document.addEventListener('submit', function (e) {
              var form = e.target;
              if (!form || form.nodeType !== 1) return;

              var isSignup = form.id === 'p-up';
              var isLogin = form.id === 'p-in';
              var isReset = form.id === 'p-reset';
              var isNewsletter = form.matches && form.matches('.g-inline-form[data-demo-form]');
              if (!isSignup && !isLogin && !isReset && !isNewsletter) return;

              // Kiarash's site.js intentionally treats these as demo forms. In
              // production this capture handler wins before that demo listener.
              e.preventDefault();
              e.stopImmediatePropagation();
              setBusy(form, true);

              var job;
              if (isSignup) {
                setNote(form, 'Creating your account…');
                job = apiPost('/api/auth/signup/', {
                  name: (form.elements.name && form.elements.name.value || '').trim(),
                  email: (form.elements.email && form.elements.email.value || '').trim(),
                  password: form.elements.password && form.elements.password.value || '',
                  newsletter: !!(form.elements.news && form.elements.news.checked)
                }).then(function (data) {
                  markAccount(data.user && data.user.email);
                  setNote(form, data.newsletter_pending
                    ? 'Account created. Check your inbox to confirm the newsletter subscription.'
                    : 'Account created. You are signed in.');
                });
              } else if (isLogin) {
                setNote(form, 'Signing in…');
                job = apiPost('/api/auth/login/', {
                  email: (form.elements.email && form.elements.email.value || '').trim(),
                  password: form.elements.password && form.elements.password.value || '',
                  keep: !!(form.elements.keep && form.elements.keep.checked)
                }).then(function (data) {
                  markAccount(data.user && data.user.email);
                  setNote(form, 'Signed in as ' + (data.user && data.user.email || 'your account') + '.');
                });
              } else if (isReset && resetUid && resetToken) {
                setNote(form, 'Updating your password…');
                job = apiPost('/api/auth/password-reset/confirm/', {
                  uid: resetUid,
                  token: resetToken,
                  password: form.elements.new_password && form.elements.new_password.value || ''
                }).then(function () {
                  setNote(form, 'Password updated. You can sign in now.');
                  history.replaceState({}, '', 'account.html#in');
                  window.setTimeout(function () { location.hash = 'in'; }, 100);
                });
              } else if (isReset) {
                setNote(form, 'Sending the reset link…');
                var resetEmail = (form.elements.email && form.elements.email.value || '').trim();
                job = apiPost('/api/auth/password-reset/request/', { email: resetEmail }).then(function () {
                  setNote(form, 'If that address has an account, a reset link has been sent.');
                  form.reset();
                });
              } else {
                var input = form.querySelector('input[type="email"]');
                var email = input && input.value.trim();
                if (!email) {
                  setNote(form, 'Add an email address and we will send a confirmation link.');
                  if (input) input.focus();
                  setBusy(form, false);
                  return;
                }
                setNote(form, 'Sending confirmation email…');
                job = fetch('/api/newsletter/subscribe/', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                  body: JSON.stringify({ email: email, source: 'website' })
                }).then(function (res) {
                  return res.json().catch(function () { return {}; }).then(function (data) {
                    if (!res.ok) throw data;
                    return data;
                  });
                }).then(function (data) {
                  setNote(form, data.already_confirmed
                    ? 'This email is already confirmed and subscribed.'
                    : 'Check your inbox and click the confirmation link to finish subscribing.');
                  if (!data.already_confirmed) form.reset();
                });
              }

              Promise.resolve(job).catch(function (err) {
                setNote(form, errorText(err));
              }).finally(function () {
                setBusy(form, false);
              });
            }, true);

            fetch('/api/auth/me/', { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
              .then(function (res) { return res.ok ? res.json() : null; })
              .then(function (data) { if (data && data.authenticated) markAccount(data.user && data.user.email); })
              .catch(function () {});

            if (params.get('confirmed') === '1') {
              var n1 = document.querySelector('[data-form-note]');
              if (n1) n1.textContent = 'Subscription confirmed. Welcome to the newsletter.';
            } else if (params.get('confirmed') === '0') {
              var n0 = document.querySelector('[data-form-note]');
              if (n0) n0.textContent = 'That confirmation link is invalid or has expired.';
            }
          })();
          JS

          python3 <<'PY'
          from pathlib import Path
          import re

          skip = {'impressum.html', 'privacy.html'}
          for path in Path('.').glob('*.html'):
              if path.name in skip:
                  continue
              text = path.read_text(encoding='utf-8')

              # Keep the production forms live while using Kiarash's new UI.
              if 'assets/production-bridge.js' not in text:
                  text = text.replace('</body>', '<script src="assets/production-bridge.js" defer></script>\n</body>')

              # Brand book was intentionally orphaned in the source repo. Make it
              # discoverable from the site without putting it in search results.
              text = text.replace(
                  '<a href="about.html">About</a></div>',
                  '<a href="about.html">About</a><a href="brand.html">Brand</a></div>'
              )

              # The production site already has legal/privacy pages. Preserve the
              # legal navigation that is absent from the static source repo.
              legal_anchor = '<span>Curiosity brings people in. Capability keeps them here.</span>'
              if legal_anchor in text and 'href="impressum.html"' not in text:
                  text = text.replace(
                      legal_anchor,
                      legal_anchor + '\n      <span><a href="impressum.html">Legal Notice</a> · <a href="privacy.html">Privacy</a></span>'
                  )

              if path.name == 'account.html':
                  text = text.replace('minlength="8"', 'minlength="10"')
                  text = text.replace('Eight characters or more.', 'Ten characters or more.')
                  text = text.replace('one edition, every other week.', 'one edition, every week.')
                  text = text.replace(
                      'Front-end only. Wire the form action to your auth\n        provider to go live. Nothing is sent anywhere from this page.',
                      'Your account is connected to the live Gravitas+ service. Passwords require at least ten characters.'
                  )

              # Reconnect production community moderation and saved Lab progress.
              if path.name in {'community.html', 'game-hypothesis-machine.html'} and 'community-lab-live.js' not in text:
                  text = text.replace('</body>', '<script src="assets/community-lab-live.js" defer></script>\n</body>')

              path.write_text(text, encoding='utf-8')

          def redirect(path, destination, label):
              Path(path).write_text(f'''<!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Moved · Gravitas+</title><meta name="robots" content="noindex, follow">
          <link rel="canonical" href="https://gravitasplus.com/{destination}">
          <meta http-equiv="refresh" content="0; url=/{destination}"></head>
          <body><p>This page has moved to <a href="/{destination}">{label}</a>.</p>
          <script>location.replace('/{destination}');</script></body></html>\n''', encoding='utf-8')

          redirect('dossiers.html', 'topics.html', 'Gravitas+ Topics')
          redirect('dossier-computable-universe.html', 'topic-computable-universe.html', 'Is the universe computable?')
          redirect('dossier-machine-hypothesis.html', 'topic-machine-hypothesis.html', 'Can a machine form a hypothesis?')

          Path('sitemap.xml').write_text('''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://gravitasplus.com/</loc></url>
            <url><loc>https://gravitasplus.com/about.html</loc></url>
            <url><loc>https://gravitasplus.com/topics.html</loc></url>
            <url><loc>https://gravitasplus.com/topic-computable-universe.html</loc></url>
            <url><loc>https://gravitasplus.com/topic-machine-hypothesis.html</loc></url>
            <url><loc>https://gravitasplus.com/magazine.html</loc></url>
            <url><loc>https://gravitasplus.com/lab.html</loc></url>
            <url><loc>https://gravitasplus.com/learn.html</loc></url>
            <url><loc>https://gravitasplus.com/community.html</loc></url>
            <url><loc>https://gravitasplus.com/newsletter.html</loc></url>
          </urlset>
          ''', encoding='utf-8')
          PY

          # This workflow is deliberately one-shot. Remove it from the synced tree.
          rm -f .github/workflows/sync-kia-frontend.yml

      - name: Commit synced frontend
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to sync.'
            exit 0
          fi
          git commit -m "Sync frontend from desdevrad/gravitasplus@${SOURCE_SHA}"
          git push origin HEAD:main
