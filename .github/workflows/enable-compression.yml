name: Enable Gravitas Compression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-compression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Nginx gzip types safely
        shell: bash
        run: |
          set -euo pipefail
          USER="${{ secrets.DEPLOY_USER }}"; [ -n "$USER" ] || USER=deploy
          PORT="${{ secrets.DEPLOY_PORT }}"; [ -n "$PORT" ] || PORT=22
          HOST="${{ secrets.DEPLOY_HOST }}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/key -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          TMP=/tmp/gravitas-compression.conf
          : > "$TMP"

          if ! sudo nginx -T 2>/dev/null | grep -Eq '^[[:space:]]*gzip[[:space:]]+on;'; then
            echo 'gzip on;' >> "$TMP"
          fi
          cat >> "$TMP" <<'EOF'
          gzip_vary on;
          gzip_proxied any;
          gzip_comp_level 6;
          gzip_min_length 512;
          gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;
          EOF

          sudo mv "$TMP" /etc/nginx/conf.d/gravitas-compression.conf
          sudo chmod 644 /etc/nginx/conf.d/gravitas-compression.conf
          sudo nginx -t
          sudo systemctl reload nginx
          REMOTE

      - name: Verify compressed CSS from public production
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          curl -4 -fsS -D "$RUNNER_TEMP/headers" -o /dev/null \
            -H 'Accept-Encoding: gzip' \
            https://gravitasplus.com/assets/site.css
          tr -d '\r' < "$RUNNER_TEMP/headers" | grep -qi '^content-encoding: gzip'
          echo gravitas-gzip-enabled
