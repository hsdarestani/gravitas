name: Complete Gravitas Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gravitas-staging-complete
  cancel-in-progress: true

env:
  DOMAIN: staging.gravitasplus.com
  WEB: /var/www/gravitas-staging
  APP: /opt/gravitas-backend-staging
  PORT: '8001'

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and finish staging
        shell: bash
        run: |
          set -euo pipefail
          USER="${{ secrets.DEPLOY_USER }}"; [ -n "$USER" ] || USER=deploy
          SSH_PORT="${{ secrets.DEPLOY_PORT }}"; [ -n "$SSH_PORT" ] || SSH_PORT=22
          HOST="${{ secrets.DEPLOY_HOST }}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$SSH_PORT" -H "$HOST" >> ~/.ssh/known_hosts

          rsync -az --delete --delete-excluded --exclude '.git/' --exclude '.github/' --exclude 'backend/' -e "ssh -i ~/.ssh/key -p $SSH_PORT" ./ "$USER@$HOST:$WEB/"
          rsync -az --delete \
            --exclude '.venv/' \
            --exclude 'staticfiles/' \
            --exclude 'core/migrations/0*.py' \
            --rsync-path='sudo rsync' \
            -e "ssh -i ~/.ssh/key -p $SSH_PORT" \
            ./backend/ "$USER@$HOST:$APP/"

          ssh -i ~/.ssh/key -p "$SSH_PORT" "$USER@$HOST" bash -s -- "$DOMAIN" "$WEB" "$APP" "$PORT" "$HOST" <<'REMOTE'
          set -euo pipefail
          DOMAIN="$1"; WEB="$2"; APP="$3"; PORT="$4"; SERVER_IP="$5"
          STAGING_DB=gravitas_staging_v2

          if ! sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='$STAGING_DB'" | grep -q 1; then
            sudo -u postgres createdb -O gravitas "$STAGING_DB"
          fi
          if grep -q '^DJANGO_DB_NAME=' /etc/gravitas/staging.env; then
            sudo sed -i "s/^DJANGO_DB_NAME=.*/DJANGO_DB_NAME=$STAGING_DB/" /etc/gravitas/staging.env
          else
            printf 'DJANGO_DB_NAME=%s\n' "$STAGING_DB" | sudo tee -a /etc/gravitas/staging.env >/dev/null
          fi

          sudo chown -R gravitas:gravitas "$APP"
          [ -x "$APP/.venv/bin/python" ] || sudo -u gravitas python3 -m venv "$APP/.venv"
          sudo -u gravitas "$APP/.venv/bin/pip" install -q --disable-pip-version-check -r "$APP/requirements.txt"

          set -a
          . /etc/gravitas/staging.env
          set +a
          export DJANGO_SETTINGS_MODULE=gravitas_backend.settings PYTHONPATH="$APP"
          KEEP_ENV=DJANGO_SECRET_KEY,DJANGO_DEBUG,DJANGO_DB_NAME,DJANGO_DB_USER,DJANGO_DB_PASSWORD,DJANGO_ALLOWED_HOSTS,DJANGO_CSRF_TRUSTED_ORIGINS,DJANGO_SESSION_COOKIE_NAME,DJANGO_CSRF_COOKIE_NAME,DJANGO_SETTINGS_MODULE,PYTHONPATH
          cd "$APP"
          sudo -u gravitas --preserve-env="$KEEP_ENV" "$APP/.venv/bin/django-admin" migrate --noinput
          sudo -u gravitas --preserve-env="$KEEP_ENV" "$APP/.venv/bin/django-admin" collectstatic --noinput

          HAS_SUPERUSER="$(sudo -u gravitas --preserve-env="$KEEP_ENV" "$APP/.venv/bin/python" - <<'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'gravitas_backend.settings')
          import django
          django.setup()
          from django.contrib.auth import get_user_model
          print('1' if get_user_model().objects.filter(is_superuser=True, is_active=True).exists() else '0')
          PY
          )"
          if [ "$HAS_SUPERUSER" != "1" ]; then
            HQ_PASS="$(openssl rand -base64 24 | tr -d '\n')"
            sudo -u gravitas --preserve-env="$KEEP_ENV" HQ_BOOTSTRAP_PASSWORD="$HQ_PASS" "$APP/.venv/bin/python" - <<'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'gravitas_backend.settings')
          import django
          django.setup()
          from django.contrib.auth import get_user_model
          User = get_user_model()
          if not User.objects.filter(username='gravitas-hq-admin').exists():
              User.objects.create_superuser('gravitas-hq-admin', 'admin@gravitasplus.com', os.environ['HQ_BOOTSTRAP_PASSWORD'])
          PY
            printf 'username=gravitas-hq-admin\npassword=%s\n' "$HQ_PASS" | sudo tee /etc/gravitas/hq-staging-credentials >/dev/null
            sudo chmod 600 /etc/gravitas/hq-staging-credentials
          fi

          HAS_ROADMAP="$(sudo -u gravitas --preserve-env="$KEEP_ENV" "$APP/.venv/bin/python" - <<'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'gravitas_backend.settings')
          import django
          django.setup()
          from hq.models import StrategyDocument
          print('1' if StrategyDocument.objects.filter(slug='gravitas-strategy-roadmap').exists() else '0')
          PY
          )"
          if [ "$HAS_ROADMAP" != "1" ]; then
            sudo -u gravitas --preserve-env="$KEEP_ENV" "$APP/.venv/bin/django-admin" bootstrap_hq
          fi

          sudo systemctl enable --now gravitas-backend-staging
          sudo systemctl restart gravitas-backend-staging

          sudo tee /etc/nginx/sites-available/gravitas-staging >/dev/null <<NGINX
          server {
            listen 80;
            server_name $DOMAIN;
            root $WEB;
            index index.html;
            add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
            location ^~ /.well-known/acme-challenge/ { auth_basic off; try_files \$uri =404; }
            location ^~ /api/ { auth_basic "Gravitas Staging"; auth_basic_user_file /etc/nginx/.htpasswd-gravitas-staging; proxy_pass http://127.0.0.1:$PORT; proxy_set_header Host \$host; proxy_set_header X-Forwarded-Proto \$scheme; }
            location ^~ /admin/ { auth_basic "Gravitas Staging"; auth_basic_user_file /etc/nginx/.htpasswd-gravitas-staging; proxy_pass http://127.0.0.1:$PORT; proxy_set_header Host \$host; proxy_set_header X-Forwarded-Proto \$scheme; }
            location ^~ /hq/ { auth_basic "Gravitas Staging"; auth_basic_user_file /etc/nginx/.htpasswd-gravitas-staging; proxy_pass http://127.0.0.1:$PORT; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto \$scheme; }
            location ^~ /django-static/ { auth_basic "Gravitas Staging"; auth_basic_user_file /etc/nginx/.htpasswd-gravitas-staging; proxy_pass http://127.0.0.1:$PORT; }
            location / { auth_basic "Gravitas Staging"; auth_basic_user_file /etc/nginx/.htpasswd-gravitas-staging; try_files \$uri \$uri/ /index.html; }
          }
          NGINX
          sudo ln -sfn /etc/nginx/sites-available/gravitas-staging /etc/nginx/sites-enabled/gravitas-staging
          sudo nginx -t
          sudo systemctl reload nginx

          RESOLVED="$(getent ahostsv4 "$DOMAIN" 2>/dev/null | awk 'NR==1{print $1}' || true)"
          if [ -n "$RESOLVED" ] && [ "$RESOLVED" = "$SERVER_IP" ] && [ ! -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ]; then
            sudo certbot --nginx -d "$DOMAIN" --non-interactive --agree-tos --register-unsafely-without-email --redirect || true
          else
            echo "Staging DNS is not pointed at this server yet; local staging stack will still be verified."
          fi

          sudo systemctl is-active gravitas-backend-staging
          curl -fsS "http://127.0.0.1:$PORT/api/health/" -H "Host: $DOMAIN" | grep -q '"status": "ok"'
          curl -fsSI "http://127.0.0.1:$PORT/hq/" -H "Host: $DOMAIN" | grep -qi '^location: /hq/login/'
          U="$(sudo awk -F= '/^username=/{print $2}' /etc/gravitas/staging-access-credentials)"
          P="$(sudo awk -F= '/^password=/{print $2}' /etc/gravitas/staging-access-credentials)"
          curl -fsS -u "$U:$P" -H "Host: $DOMAIN" http://127.0.0.1/ >/dev/null
          curl -fsS -u "$U:$P" -H "Host: $DOMAIN" http://127.0.0.1/hq/login/ | grep -q 'Gravitas HQ'
          echo staging-ready
          REMOTE
