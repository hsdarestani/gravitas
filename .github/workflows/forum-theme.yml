name: Deploy and verify the GraviQuest Forum theme

on:
  push:
    branches: ['main', 'feat/discourse-*']
    paths: ['discourse/theme/**', 'ops/discourse/**', 'backend/core/forum_rooms.json', '.github/workflows/forum-theme.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theme:
    if: github.repository == 'hsdarestani/gravitas' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[deploy-forum-theme]'))
    # Pinned (2026-11-18): on ubuntu-latest, now Ubuntu 26, installing the
    # browsers' system packages stalled for the whole 10-minute limit twice.
    runs-on: ubuntu-24.04
    # 2026-11-18: the browser install below hung for the whole 15 minutes
    # (it usually takes under a minute), so the run was cancelled before the
    # theme step. The install now has its own limit and the job more room, so
    # a stuck install fails fast with its own name and a normal run still has
    # time to apply the theme and test three browsers.
    timeout-minutes: 25
    concurrency:
      group: gravitas-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Assemble theme and install browser dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail
          ruby -c ops/discourse/deploy_theme.rb
          ruby -c ops/discourse/rooms.rb
          python3 -c 'import json; json.load(open("backend/core/forum_rooms.json"))'
          python3 ops/discourse/assemble_theme.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/forum-theme/candidate"
          npm install --prefix "$RUNNER_TEMP/forum-browser" --no-audit --no-fund playwright@1.65.0
          # 2026-11-18: installing the browsers' system packages from the
          # runner's Ubuntu mirror stalled past ten minutes four runs in a row.
          # The browsers now run in Playwright's own image, which carries them
          # and every library they need, so no apt step is left to stall.
          docker pull --quiet mcr.microsoft.com/playwright:v1.65.0-noble
      - name: Apply theme and verify the public thread on three browsers
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/forum-theme
          chmod 600 ~/.ssh/forum-theme
          PORT="${SSH_PORT:-22}"
          LOGIN="${SSH_USER:-deploy}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/forum-theme -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10)
          if ! ssh "${OPTS[@]}" "$LOGIN@$SSH_HOST" true; then LOGIN=root; fi
          TARGET="$LOGIN@$SSH_HOST"
          RELEASE="theme-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE="/tmp/graviquest-$RELEASE"
          SHARED="/var/discourse/shared/graviquest/graviquest-integration/$RELEASE"
          CONTAINER="/shared/graviquest-integration/$RELEASE"
          cp ops/discourse/deploy_theme.rb ops/discourse/rooms.rb backend/core/forum_rooms.json "$RUNNER_TEMP/forum-theme/"
          tar -C "$RUNNER_TEMP/forum-theme" -czf "$RUNNER_TEMP/forum-theme.tgz" candidate deploy_theme.rb rooms.rb forum_rooms.json
          ssh "${OPTS[@]}" "$TARGET" "umask 077 && mkdir '$REMOTE'"
          scp -i ~/.ssh/forum-theme -P "$PORT" "$RUNNER_TEMP/forum-theme.tgz" "$TARGET:$REMOTE/source.tgz"
          ssh "${OPTS[@]}" "$TARGET" "sudo install -d -m 700 '$SHARED' &&
            sudo tar -xzf '$REMOTE/source.tgz' -C '$SHARED' &&
            sudo chown -R 1000:1000 '$SHARED' &&
            rm '$REMOTE/source.tgz' && rmdir '$REMOTE'"
          run_theme() {
            ssh "${OPTS[@]}" "$TARGET" "sudo docker exec -u discourse -w /var/www/discourse               -e GQ_THEME_RELEASE='$CONTAINER' -e GQ_THEME_MODE='$1'               graviquest bundle exec rails runner '$CONTAINER/deploy_theme.rb'"
          }
          rollback() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo 'Theme acceptance failed. Restoring the previous theme.'
              run_theme rollback
            fi
          }
          trap rollback EXIT
          # Room metadata and permissions are managed in native Discourse admin.
          # The room seed is intentionally a no-op during routine theme deployments.
          ssh "${OPTS[@]}" "$TARGET" "sudo docker exec -u discourse -w /var/www/discourse -e GQ_THEME_RELEASE='$CONTAINER' graviquest bundle exec rails runner '$CONTAINER/rooms.rb'"
          run_theme apply
          mkdir -p "$RUNNER_TEMP/forum-theme-screenshots"
          docker run --rm --ipc=host             -v "$GITHUB_WORKSPACE:/work:ro" -v "$RUNNER_TEMP/forum-browser:/forum-browser:ro"             -v "$RUNNER_TEMP/forum-theme-screenshots:/out" -w /work             -e PLAYWRIGHT_MODULE=/forum-browser/node_modules/playwright/index.mjs             -e GQ_BROWSER_OUTPUT=/out             mcr.microsoft.com/playwright:v1.65.0-noble node ops/discourse/thread-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-thread-design
          path: ${{ runner.temp }}/forum-theme-screenshots
          if-no-files-found: ignore
          retention-days: 14
