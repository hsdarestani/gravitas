name: Normalize Gravitas public language

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize visible legal labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = [
              'Datenschutz', 'Datenschutzerklärung', 'Zum Inhalt springen',
              'Startseite', 'aria-label="Primär"', 'Rechtliche Angaben',
              'Angaben zum Anbieter', 'Verantwortlich für', 'Deutschland'
          ]
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('>Impressum</a>', '>Legal Notice</a>')
              text = text.replace('>Datenschutz</a>', '>Privacy</a>')
              path.write_text(text, encoding='utf-8')
          bad = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              for token in forbidden:
                  if token in text:
                      bad.append(f'{path}: {token}')
          if bad:
              raise SystemExit('German public UI remains:\n' + '\n'.join(bad))
          PY
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Public UI is already English-only.'
            exit 0
          fi
          git config user.name 'Gravitas Language Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html'
          git commit -m 'Keep Gravitas public UI English-only'
          git pull --rebase origin main
          git push origin HEAD:main
