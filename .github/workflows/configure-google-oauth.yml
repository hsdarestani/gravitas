name: Configure Gravitas Google OAuth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-google-oauth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      CONFIGURED_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Check Google OAuth secrets
        id: oauth
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_CLIENT_ID:-}" ] || [ -z "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Add GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET, then run this workflow again."
            exit 0
          fi
          test -n "${DEPLOY_HOST:-}" || { echo "Missing DEPLOY_HOST"; exit 1; }
          test -n "${DEPLOY_SSH_KEY:-}" || { echo "Missing DEPLOY_SSH_KEY"; exit 1; }
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Configure production backend
        if: steps.oauth.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          USER_NAME="${CONFIGURED_USER:-deploy}"
          PORT="${DEPLOY_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/gravitas_deploy
          chmod 600 ~/.ssh/gravitas_deploy
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          SSH_OPTS=(-i ~/.ssh/gravitas_deploy -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10)

          if ssh "${SSH_OPTS[@]}" "$USER_NAME@$DEPLOY_HOST" true 2>/dev/null; then
            EFFECTIVE_USER="$USER_NAME"
          elif [ "$USER_NAME" != "root" ] && ssh "${SSH_OPTS[@]}" "root@$DEPLOY_HOST" true 2>/dev/null; then
            EFFECTIVE_USER="root"
          else
            echo "SSH authentication failed."
            exit 1
          fi

          ID_B64="$(printf '%s' "$GOOGLE_CLIENT_ID" | base64 -w0)"
          SECRET_B64="$(printf '%s' "$GOOGLE_CLIENT_SECRET" | base64 -w0)"
          ssh "${SSH_OPTS[@]}" "$EFFECTIVE_USER@$DEPLOY_HOST" bash -s -- "$ID_B64" "$SECRET_B64" <<'REMOTE'
          set -euo pipefail
          CLIENT_ID="$(printf '%s' "$1" | base64 -d)"
          CLIENT_SECRET="$(printf '%s' "$2" | base64 -d)"
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi
          ENV_FILE=/etc/gravitas/backend.env
          TMP="$(mktemp)"
          $SUDO touch "$ENV_FILE"
          $SUDO grep -vE '^GOOGLE_OAUTH_(CLIENT_ID|CLIENT_SECRET|REDIRECT_URI)=' "$ENV_FILE" > "$TMP" || true
          printf 'GOOGLE_OAUTH_CLIENT_ID=%s\n' "$CLIENT_ID" >> "$TMP"
          printf 'GOOGLE_OAUTH_CLIENT_SECRET=%s\n' "$CLIENT_SECRET" >> "$TMP"
          printf 'GOOGLE_OAUTH_REDIRECT_URI=https://gravitasplus.com/api/auth/google/callback/\n' >> "$TMP"
          $SUDO install -o root -g gravitas -m 640 "$TMP" "$ENV_FILE"
          rm -f "$TMP"
          $SUDO systemctl restart gravitas-backend
          $SUDO systemctl is-active --quiet gravitas-backend
          REMOTE

      - name: Summary
        shell: bash
        run: |
          if [ "${{ steps.oauth.outputs.configured }}" = "true" ]; then
            echo "### Google OAuth connected to Gravitas+" >> "$GITHUB_STEP_SUMMARY"
            echo "Authorized redirect URI: https://gravitasplus.com/api/auth/google/callback/" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Google OAuth code is ready, credentials are missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Add repository secrets GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET, then run this workflow manually." >> "$GITHUB_STEP_SUMMARY"
          fi
