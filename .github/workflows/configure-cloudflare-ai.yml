name: Configure Gravitas Cloudflare AI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-cloudflare-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      CONFIGURED_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check Cloudflare AI secrets
        id: ai
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CF_ACCOUNT_ID:-}" ] || [ -z "${CF_AI_TOKEN:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare AI secrets are not configured. Add CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_AI_API_TOKEN (or CLOUDFLARE_API_TOKEN), then run this workflow again."
            exit 0
          fi
          test -n "${DEPLOY_HOST:-}" || { echo "Missing DEPLOY_HOST"; exit 1; }
          test -n "${DEPLOY_SSH_KEY:-}" || { echo "Missing DEPLOY_SSH_KEY"; exit 1; }
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Configure production backend
        if: steps.ai.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          USER_NAME="${CONFIGURED_USER:-deploy}"
          PORT="${DEPLOY_PORT:-22}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/gravitas_deploy
          chmod 600 ~/.ssh/gravitas_deploy
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          SSH_OPTS=(-i ~/.ssh/gravitas_deploy -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10)

          if ssh "${SSH_OPTS[@]}" "$USER_NAME@$DEPLOY_HOST" true 2>/dev/null; then
            EFFECTIVE_USER="$USER_NAME"
          elif [ "$USER_NAME" != "root" ] && ssh "${SSH_OPTS[@]}" "root@$DEPLOY_HOST" true 2>/dev/null; then
            EFFECTIVE_USER="root"
          else
            echo "SSH authentication failed."
            exit 1
          fi

          ACCOUNT_B64="$(printf '%s' "$CF_ACCOUNT_ID" | base64 -w0)"
          TOKEN_B64="$(printf '%s' "$CF_AI_TOKEN" | base64 -w0)"
          ssh "${SSH_OPTS[@]}" "$EFFECTIVE_USER@$DEPLOY_HOST" bash -s -- "$ACCOUNT_B64" "$TOKEN_B64" <<'REMOTE'
          set -euo pipefail
          ACCOUNT_ID="$(printf '%s' "$1" | base64 -d)"
          API_TOKEN="$(printf '%s' "$2" | base64 -d)"
          if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi
          ENV_FILE=/etc/gravitas/backend.env
          TMP="$(mktemp)"
          $SUDO touch "$ENV_FILE"
          $SUDO grep -vE '^CLOUDFLARE_AI_(ACCOUNT_ID|API_TOKEN|MODEL|TIMEOUT)=' "$ENV_FILE" > "$TMP" || true
          printf 'CLOUDFLARE_AI_ACCOUNT_ID=%s\n' "$ACCOUNT_ID" >> "$TMP"
          printf 'CLOUDFLARE_AI_API_TOKEN=%s\n' "$API_TOKEN" >> "$TMP"
          printf 'CLOUDFLARE_AI_MODEL=@cf/meta/llama-3.3-70b-instruct-fp8-fast\n' >> "$TMP"
          printf 'CLOUDFLARE_AI_TIMEOUT=45\n' >> "$TMP"
          $SUDO install -o root -g gravitas -m 640 "$TMP" "$ENV_FILE"
          rm -f "$TMP"
          $SUDO systemctl restart gravitas-backend
          $SUDO systemctl is-active --quiet gravitas-backend
          REMOTE

      - name: Summary
        shell: bash
        run: |
          if [ "${{ steps.ai.outputs.configured }}" = "true" ]; then
            echo "### Cloudflare Workers AI connected to Gravitas" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Cloudflare Workers AI code is ready, but credentials are still missing" >> "$GITHUB_STEP_SUMMARY"
            echo "Add repository secrets \`CLOUDFLARE_ACCOUNT_ID\` and \`CLOUDFLARE_AI_API_TOKEN\`, then run this workflow manually." >> "$GITHUB_STEP_SUMMARY"
          fi
