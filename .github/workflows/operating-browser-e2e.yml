name: Gravitas Operating Browser E2E

on:
  workflow_run:
    workflows: ["Gravitas Operating Production E2E"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operating-browser:
    name: operating-browser-visual-smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOMAIN: gravitasplus.com
      E2E_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      E2E_SSH_HOST: ${{ secrets.DEPLOY_HOST }}
      E2E_SSH_USER: ${{ secrets.DEPLOY_USER }}
      E2E_SSH_PORT: ${{ secrets.DEPLOY_PORT }}
      BROWSER_EMAIL: operating-e2e-${{ github.run_id }}-${{ github.run_attempt }}@example.com

    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified disposable Core member
        shell: bash
        run: |
          set -euo pipefail
          PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(64) + "-aA1!")')"
          echo "::add-mask::$PASSWORD"
          printf 'BROWSER_PASSWORD=%s\n' "$PASSWORD" >> "$GITHUB_ENV"
          source ops/e2e-identity.sh
          LINK="$(prepare_e2e_identity "$BROWSER_EMAIL" "$PASSWORD")"
          echo "::add-mask::$LINK"
          curl -4 -fsS -o /dev/null "$LINK"
          grant_e2e_core_access "$BROWSER_EMAIL"
      - name: Install Chromium browser harness
        shell: bash
        run: |
          set -euo pipefail
          HARNESS="$RUNNER_TEMP/gravitas-operating-browser"
          mkdir -p "$HARNESS"
          cd "$HARNESS"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify rendered Operating Workspace
        shell: bash
        run: |
          set -euo pipefail
          HARNESS="$RUNNER_TEMP/gravitas-operating-browser"
          ARTIFACTS="$RUNNER_TEMP/gravitas-operating-browser-artifacts"
          mkdir -p "$ARTIFACTS"
          cat > "$HARNESS/smoke.mjs" <<'EOF'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import path from 'node:path';

          const base = `https://${process.env.DOMAIN}`;
          const email = process.env.BROWSER_EMAIL;
          const password = process.env.BROWSER_PASSWORD;
          const artifacts = path.join(process.env.RUNNER_TEMP, 'gravitas-operating-browser-artifacts');
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1000 },
            colorScheme: 'dark',
            reducedMotion: 'reduce'
          });
          const page = await context.newPage();
          const pageErrors = [];
          const failedSameOriginRequests = [];

          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('requestfailed', request => {
            try {
              const target = new URL(request.url());
              if (target.origin === base) {
                if (request.resourceType() === 'font' && request.failure()?.errorText === 'net::ERR_ABORTED') return;
                failedSameOriginRequests.push(`${request.method()} ${target.pathname}: ${request.failure()?.errorText || 'failed'}`);
              }
            } catch (_) {}
          });

          async function settle() {
            await page.waitForLoadState('domcontentloaded');
            await page.evaluate(async () => {
              if (document.fonts && document.fonts.ready) await document.fonts.ready;
            });
          }

          async function visible(selector, timeout = 15000) {
            const locator = page.locator(selector);
            await locator.waitFor({ state: 'visible', timeout });
            const box = await locator.boundingBox();
            assert(box && box.width > 15 && box.height > 15, `${selector} has no rendered box`);
            return locator;
          }

          async function waitOperating(title) {
            await visible('#ws-main');
            await visible('#ws-view');
            await page.locator('#ws-view h1').filter({ hasText: title }).waitFor({ state: 'visible', timeout: 20000 });
            await page.waitForFunction(() => {
              const text = document.querySelector('#ws-view')?.innerText || '';
              return !/Loading your work|Reading accessible|Loading projects/.test(text);
            }, null, { timeout: 20000 });
            assert(!/http_50[0-9]|service did not answer/.test(await page.locator('#ws-view').innerText()));
          }

          async function assertNoHorizontalBreakage(tolerance = 24) {
            const dimensions = await page.evaluate(() => ({
              viewport: window.innerWidth,
              body: document.body.scrollWidth,
              root: document.documentElement.scrollWidth
            }));
            assert(Math.max(dimensions.body, dimensions.root) <= dimensions.viewport + tolerance,
              `unexpected horizontal overflow: viewport=${dimensions.viewport}, body=${dimensions.body}, root=${dimensions.root}`);
          }

          async function openSection(pathname, title) {
            await page.goto(`${base}${pathname}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await settle();
            await waitOperating(title);
            await assertNoHorizontalBreakage();
          }

          try {
            await page.goto(`${base}/login`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.locator('#in-mail').fill(email);
            await page.locator('#in-pass').fill(password);
            await page.locator('#p-in button[type="submit"]').click();
            await page.waitForURL(url => url.origin === base && url.pathname.startsWith('/workspace'), { timeout: 20000 });

            await openSection('/workspace/core', 'Core');
            await visible('#ws-rail');
            await page.screenshot({ path: path.join(artifacts, '01-core-desktop.png'), fullPage: true, animations: 'disabled' });
            await openSection('/workspace/core/tasks', 'Tasks');
            await openSection('/workspace/core/meetings', 'Meetings');
            await openSection('/workspace/core/work-reports', 'Daily Work Reports');
            await page.locator('textarea').first().waitFor({ state: 'visible', timeout: 15000 });
            await page.screenshot({ path: path.join(artifacts, '02-daily-reports-desktop.png'), fullPage: true, animations: 'disabled' });

            await page.setViewportSize({ width: 390, height: 844 });
            await openSection('/workspace/core', 'Core');
            await assertNoHorizontalBreakage(32);
            await page.screenshot({ path: path.join(artifacts, '03-core-mobile.png'), fullPage: true, animations: 'disabled' });

            assert.deepEqual(pageErrors, [], `browser page errors: ${pageErrors.join(' | ')}`);
            assert.deepEqual(failedSameOriginRequests, [], `failed production requests: ${failedSameOriginRequests.join(' | ')}`);
            console.log('operating-browser-visual-smoke-passed');
          } finally {
            await browser.close();
          }
          EOF
          cd "$HARNESS"
          node smoke.mjs

      - name: Upload Operating Workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operating-browser-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gravitas-operating-browser-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Remove browser test account
        if: always()
        shell: bash
        run: |
          set +e
          COOKIE_JAR="$RUNNER_TEMP/gravitas-operating-browser-cleanup.txt"
          curl -4 -fsS -c "$COOKIE_JAR" "https://$DOMAIN/api/auth/csrf/" >/dev/null || exit 0
          CSRF="$(awk '$6=="csrftoken" {print $7}' "$COOKIE_JAR" | tail -n1)"
          test -n "$CSRF" || exit 0
          LOGIN="$(curl -4 -sS -b "$COOKIE_JAR" -c "$COOKIE_JAR" \
            -X POST "https://$DOMAIN/api/auth/login/" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "X-CSRFToken: $CSRF" \
            -H "Referer: https://$DOMAIN/login" \
            --data "{\"email\":\"$BROWSER_EMAIL\",\"password\":\"$BROWSER_PASSWORD\",\"keep\":false}")"
          printf '%s' "$LOGIN" | grep -q '"ok": true' || exit 0
          CSRF="$(awk '$6=="csrftoken" {print $7}' "$COOKIE_JAR" | tail -n1)"
          curl -4 -fsS -b "$COOKIE_JAR" -c "$COOKIE_JAR" \
            -X POST "https://$DOMAIN/api/auth/delete/" \
            -H 'Content-Type: application/json' \
            -H "X-CSRFToken: $CSRF" \
            -H "Referer: https://$DOMAIN/login" \
            --data "{\"password\":\"$BROWSER_PASSWORD\",\"confirmation\":\"delete\"}" >/dev/null
