name: Enable Content Proxy

on:
  workflow_run:
    workflows: ["Deploy Gravitas to Strato"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gravitas-content-proxy
  cancel-in-progress: true

jobs:
  proxy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Add content proxy
        shell: bash
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          [ -n "$PORT" ] || PORT=22
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -p "$PORT" -o BatchMode=yes deploy@$HOST \
            "sudo bash /var/www/gravitas/ops/enable-content-proxy.txt"

      - name: Verify content routing
        shell: bash
        run: |
          set -euo pipefail
          sleep 2

          code="$(curl -4 -sS -o /tmp/content-check -w '%{http_code}' https://gravitasplus.com/content/definitely-not-published/)"
          test "$code" = "404"
          ! grep -q '<title>Gravitas+ — Science' /tmp/content-check

          CMS_JSON="$(curl -4 -fsSL 'https://gravitasplus.com/api/content/?limit=1')"
          SLUG="$(printf '%s' "$CMS_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); items=d.get("items") or []; print(items[0].get("slug", "") if items else "")')"
          if [ -n "$SLUG" ]; then
            curl -4 -fsSL "https://gravitasplus.com/content/$SLUG/" | grep -Fq '<meta name="robots" content="noindex, nofollow">'
            echo "Verified published SSR page: $SLUG"
          else
            echo 'No published CMS content yet; 404 route behavior verified.'
          fi

          echo gravitas-content-proxy-ready
