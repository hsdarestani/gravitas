name: One-time Lab directory visibility fix static release

on:
  push:
    branches: [fix/lab-index-always-visible-20261024]
    paths:
      - .github/workflows/one-time-lab-index-fix-release.yml

permissions:
  contents: read

concurrency:
  group: gravitas-lab-index-fix-static-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check expected Lab content before modifying production
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lab.html').read_text()
          assert 'class="games"' in p
          assert 'class="games rv"' not in p
          assert 'class="callout g-mt-xl rv"' not in p
          for link in ['lab-protein-stability.html','lab-prompt-bias.html','lab-scientific-visualization.html']:
              assert link in p
          print('Lab directory HTML contains 3 visible simulator links')
          PY
      - name: Install ONLY fixed lab.html atomically without restarting any service
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_SSH_KEY"
          HOST="$DEPLOY_HOST"; PORT="${DEPLOY_PORT:-22}"; USER="${DEPLOY_USER:-deploy}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/graviquest_lab_static"
          chmod 600 "$HOME/.ssh/graviquest_lab_static"
          ssh-keygen -y -f "$HOME/.ssh/graviquest_lab_static" >/dev/null
          ssh-keyscan -T 10 -p "$PORT" -H "$HOST" >> "$HOME/.ssh/known_hosts"
          SSH=(ssh -i "$HOME/.ssh/graviquest_lab_static" -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10)
          SCP=(scp -i "$HOME/.ssh/graviquest_lab_static" -P "$PORT" -o BatchMode=yes)
          FILE="/tmp/graviquest-lab-index-fix-$GITHUB_SHA.html"
          "${SCP[@]}" lab.html "$USER@$HOST:$FILE"
          "${SSH[@]}" "$USER@$HOST" bash -s -- "$FILE" "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          SOURCE="$1"; SHA="$2"; ROOT="/var/www/gravitas"
          test -s "$SOURCE" && test -s "$ROOT/lab.html" && test -w "$ROOT"
          test "$(sudo systemctl is-active gravitas-backend.service)" = active
          test "$(sudo systemctl is-active nginx.service)" = active
          cp -p "$ROOT/lab.html" "$ROOT/lab.html.backup.$SHA"
          install -m 644 "$SOURCE" "$ROOT/lab.html.new.$SHA"
          mv -f "$ROOT/lab.html.new.$SHA" "$ROOT/lab.html"
          rm -f "$SOURCE"
          echo "STATIC_HTML_INSTALLED: yes; backend_restart: no; backend_reload: no; database_migration: no"
          REMOTE
      - name: Check public Lab directory and API without backend changes
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          HOME_URL="https://graviquest.com/lab.html?gq_visibility_fix=$GITHUB_SHA"
          tmp="$(mktemp)"; trap 'rm -f "$tmp"' EXIT
          curl -4 -fsSL --retry 3 --retry-delay 2 --max-time 20 -o "$tmp" "$HOME_URL"
          if ! grep -q 'class="games"' "$tmp" || grep -q 'class="games rv"' "$tmp"; then
            echo 'Lab HTML not yet visible from public CDN; restore previous file'
            ssh -i "$HOME/.ssh/graviquest_lab_static" -p "${DEPLOY_PORT:-22}" -o BatchMode=yes "${DEPLOY_USER:-deploy}@$DEPLOY_HOST" \
              "cp -p '/var/www/gravitas/lab.html.backup.$GITHUB_SHA' '/var/www/gravitas/lab.html'"
            exit 1
          fi
          for target in lab-protein-stability.html lab-prompt-bias.html lab-scientific-visualization.html; do
            grep -q "$target" "$tmp"
          done
          curl -4 -fsSL --retry 3 --retry-delay 2 --max-time 20 \
            'https://graviquest.com/api/health/' | grep -Eq '"status" *: *"ok"'
          echo "LAB_INDEX_VISIBLE=YES BACKEND_HEALTH=OK"
