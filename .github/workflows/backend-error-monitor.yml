name: Gravitas Backend Error Monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-error-monitor.yml'
  schedule:
    - cron: '31 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  errors:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check backend service journal
        shell: bash
        run: |
          set -euo pipefail
          USER="${{ secrets.DEPLOY_USER }}"; [ -n "$USER" ] || USER=deploy
          PORT="${{ secrets.DEPLOY_PORT }}"; [ -n "$PORT" ] || PORT=22
          HOST="${{ secrets.DEPLOY_HOST }}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -p "$PORT" -o BatchMode=yes "$USER@$HOST" \
            "sudo systemctl is-active --quiet gravitas-backend.service && ! sudo journalctl -u gravitas-backend.service --since '70 minutes ago' --no-pager -o cat | grep -Eqi 'Traceback \\(most recent call last\\):|Internal Server Error:|Worker failed to boot|Unhandled exception|CRITICAL'"
