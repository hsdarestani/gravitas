name: Gravitas Five-Layer Platform Validation

on:
  pull_request:
    paths:
      - 'backend/core/layer_*.py'
      - 'backend/core/lms_*.py'
      - 'backend/core/member_api.py'
      - 'backend/core/core_links_api.py'
      - 'backend/core/research_*.py'
      - 'backend/core/platform_admin_extended.py'
      - 'backend/core/nextcloud_deck.py'
      - 'backend/core/site_admin_api.py'
      - 'backend/core/platform_runtime_v3.py'
      - 'backend/core/urls.py'
      - 'backend/core/apps.py'
      - 'backend/core/migrations/0014_five_layer_platform_foundation.py'
      - 'backend/core/migrations/0015_research_experiments_discussions.py'
      - 'backend/core/test_five_layer_*.py'
      - 'backend/core/test_research_project_tools.py'
      - 'backend/core/test_core_task_links.py'
      - 'backend/core/test_auth_logout_flow.py'
      - 'backend/core/test_site_layer_admin.py'
      - 'backend/core/test_platform_v3_roles.py'
      - 'assets/ws/ws-platform.js'
      - 'assets/ws/ws-five-layer.js'
      - 'assets/ws/ws-member-lms.js'
      - 'assets/ws/ws-member-progress.js'
      - 'assets/ws/ws-core-links.js'
      - 'assets/ws/ws-admin.js'
      - 'assets/ws/ws-project.js'
      - 'assets/ws/ws-five-layer.css'
      - 'workspace.html'
      - 'docs/five-layer-platform-architecture.md'
      - '.github/workflows/five-layer-platform-validation.yml'
  push:
    branches: [main]
    paths:
      - 'backend/core/layer_*.py'
      - 'backend/core/lms_*.py'
      - 'backend/core/member_api.py'
      - 'backend/core/core_links_api.py'
      - 'backend/core/research_*.py'
      - 'backend/core/platform_admin_extended.py'
      - 'backend/core/nextcloud_deck.py'
      - 'backend/core/site_admin_api.py'
      - 'backend/core/platform_runtime_v3.py'
      - 'backend/core/urls.py'
      - 'backend/core/apps.py'
      - 'backend/core/migrations/0014_five_layer_platform_foundation.py'
      - 'backend/core/migrations/0015_research_experiments_discussions.py'
      - 'backend/core/test_five_layer_*.py'
      - 'backend/core/test_research_project_tools.py'
      - 'backend/core/test_core_task_links.py'
      - 'backend/core/test_auth_logout_flow.py'
      - 'backend/core/test_site_layer_admin.py'
      - 'backend/core/test_platform_v3_roles.py'
      - 'assets/ws/ws-platform.js'
      - 'assets/ws/ws-five-layer.js'
      - 'assets/ws/ws-member-lms.js'
      - 'assets/ws/ws-member-progress.js'
      - 'assets/ws/ws-core-links.js'
      - 'assets/ws/ws-admin.js'
      - 'assets/ws/ws-project.js'
      - 'assets/ws/ws-five-layer.css'
      - 'workspace.html'
      - 'docs/five-layer-platform-architecture.md'
      - '.github/workflows/five-layer-platform-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Validate five-layer browser modules
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/ws/ws-platform.js
          node --check assets/ws/ws-five-layer.js
          node --check assets/ws/ws-member-lms.js
          node --check assets/ws/ws-member-progress.js
          node --check assets/ws/ws-core-links.js
          node --check assets/ws/ws-admin.js
          node --check assets/ws/ws-project.js

      - name: Set up five-layer test environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gravitas-five-layer-tests"
          "$RUNNER_TEMP/gravitas-five-layer-tests/bin/pip" install --disable-pip-version-check -q -r backend/requirements.txt

      - name: Django model and migration checks
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          export DJANGO_SETTINGS_MODULE=gravitas_backend.test_settings
          PY="$RUNNER_TEMP/gravitas-five-layer-tests/bin/python"
          "$PY" -m django check
          "$PY" -m django makemigrations --check --dry-run

      - name: Five-layer backend tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          export DJANGO_SETTINGS_MODULE=gravitas_backend.test_settings
          PY="$RUNNER_TEMP/gravitas-five-layer-tests/bin/python"
          "$PY" -m django test \
            core.test_five_layer_platform \
            core.test_five_layer_completion \
            core.test_research_project_tools \
            core.test_core_task_links \
            core.test_auth_logout_flow \
            core.test_site_layer_admin \
            core.test_platform_v3_roles
