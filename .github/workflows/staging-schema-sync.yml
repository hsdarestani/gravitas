name: Gravitas Staging Schema Sync

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gravitas-staging-schema
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for staging deploy
        run: sleep 30

      - name: Generate and apply staging migrations
        shell: bash
        run: |
          set -euo pipefail
          USER="${{ secrets.DEPLOY_USER }}"; [ -n "$USER" ] || USER=deploy
          PORT="${{ secrets.DEPLOY_PORT }}"; [ -n "$PORT" ] || PORT=22
          HOST="${{ secrets.DEPLOY_HOST }}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/key -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP=/opt/gravitas-backend-staging
          set -a
          . /etc/gravitas/staging.env
          set +a
          export DJANGO_SETTINGS_MODULE=gravitas_backend.settings PYTHONPATH="$APP"
          KEEP_ENV=DJANGO_SECRET_KEY,DJANGO_DEBUG,DJANGO_DB_NAME,DJANGO_DB_USER,DJANGO_ALLOWED_HOSTS,DJANGO_CSRF_TRUSTED_ORIGINS,DJANGO_SESSION_COOKIE_NAME,DJANGO_CSRF_COOKIE_NAME,DJANGO_SETTINGS_MODULE,PYTHONPATH
          cd "$APP"
          sudo -u gravitas --preserve-env="$KEEP_ENV" "$APP/.venv/bin/django-admin" makemigrations core --noinput
          sudo -u gravitas --preserve-env="$KEEP_ENV" "$APP/.venv/bin/django-admin" migrate --noinput
          sudo -u postgres psql -d gravitas_staging -tAc "SELECT to_regclass('public.core_comment')" | grep -q core_comment
          sudo systemctl restart gravitas-backend-staging
          echo staging-schema-synced
          REMOTE
