name: Cleanup Test Newsletter Subscribers Once

on:
  workflow_run:
    workflows: ["Deploy Gravitas to Strato"]
    types: [completed]

permissions:
  contents: read

jobs:
  cleanup:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}"
          test -n "${{ secrets.DEPLOY_SSH_KEY }}"
          USERNAME="${{ secrets.DEPLOY_USER }}"
          PORT="${{ secrets.DEPLOY_PORT }}"
          [ -n "$USERNAME" ] || USERNAME=deploy
          [ -n "$PORT" ] || PORT=22
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/gravitas_deploy
          chmod 600 ~/.ssh/gravitas_deploy
          ssh-keyscan -p "$PORT" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/gravitas_deploy -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10)
          if ssh "${OPTS[@]}" "$USERNAME@${{ secrets.DEPLOY_HOST }}" true 2>/dev/null; then
            EFFECTIVE_USER="$USERNAME"
          elif [ "$USERNAME" != root ] && ssh "${OPTS[@]}" "root@${{ secrets.DEPLOY_HOST }}" true 2>/dev/null; then
            EFFECTIVE_USER=root
          else
            echo 'SSH authentication failed'
            exit 1
          fi
          echo "DEPLOY_USER=$EFFECTIVE_USER" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=$PORT" >> "$GITHUB_ENV"

      - name: Remove stale auth E2E newsletter rows
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/gravitas_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -u gravitas bash -c '
            set -a
            . /etc/gravitas/backend.env
            set +a
            export DJANGO_SETTINGS_MODULE=gravitas_backend.settings
            export PYTHONPATH=/opt/gravitas-backend
            cd /opt/gravitas-backend
            exec .venv/bin/django-admin cleanup_production_e2e_users --scope auth
          '
          REMOTE
