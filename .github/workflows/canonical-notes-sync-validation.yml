name: Canonical Notes Sync Safety

on:
  pull_request:
    paths:
      - 'backend/core/nextcloud_notes.py'
      - 'backend/core/nextcloud_notes_fast_api.py'
      - 'backend/core/test_canonical_note_mirror.py'
      - 'assets/ws/ws-nextcloud-native.js'
      - 'assets/ws/ws-app.js'
      - 'workspace.html'
      - '.github/workflows/canonical-notes-sync-validation.yml'

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate notebook JavaScript syntax
        run: node --check --input-type=module < assets/ws/ws-nextcloud-native.js
      - name: Run notes storage and canonical journal regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/canonical-notes"
          "$RUNNER_TEMP/canonical-notes/bin/pip" install -q -r backend/requirements.txt
          export PYTHONPATH="$GITHUB_WORKSPACE/backend"
          export DJANGO_SETTINGS_MODULE=gravitas_backend.test_settings
          "$RUNNER_TEMP/canonical-notes/bin/python" -m django test core.test_canonical_note_mirror core.test_notes_save_safety core.test_note_async_sync core.test_fast_notes_listing core.test_canonical_journal --noinput
          "$RUNNER_TEMP/canonical-notes/bin/python" -m django check
