name: Gravitas Production Monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check public production surface
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN=gravitasplus.com
          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR"' EXIT

          curl -4 -fsS --retry 4 --retry-delay 3 --connect-timeout 8 --max-time 20 \
            -o "$TMPDIR/home.html" "https://$DOMAIN/"
          grep -qi 'Gravitas' "$TMPDIR/home.html"

          curl -4 -fsS --retry 4 --retry-delay 3 --connect-timeout 8 --max-time 20 \
            -o "$TMPDIR/health.json" "https://$DOMAIN/api/health/"
          grep -q '"status": "ok"' "$TMPDIR/health.json"

          curl -4 -fsS --retry 4 --retry-delay 3 --connect-timeout 8 --max-time 20 \
            -o "$TMPDIR/sitemap.xml" "https://$DOMAIN/sitemap.xml"
          grep -q '<urlset' "$TMPDIR/sitemap.xml"

          ROBOTS_STATUS="$(curl -4 -fsS --retry 4 --retry-delay 3 --connect-timeout 8 --max-time 20 \
            -o /dev/null -w '%{http_code}' "https://$DOMAIN/robots.txt")"
          test "$ROBOTS_STATUS" = "200"

          echo production-public-monitor-passed

      - name: Check TLS certificate lifetime
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN=gravitasplus.com
          EXPIRY="$(echo | openssl s_client -servername "$DOMAIN" -connect "$DOMAIN:443" 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2-)"
          test -n "$EXPIRY"
          EXPIRY_EPOCH="$(date -d "$EXPIRY" +%s)"
          NOW_EPOCH="$(date +%s)"
          DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))
          echo "TLS days remaining: $DAYS_LEFT"
          test "$DAYS_LEFT" -ge 14
