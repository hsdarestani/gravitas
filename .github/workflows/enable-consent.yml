name: Enable Gravitas Consent

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-consent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install persistent privacy and SEO injection
        shell: bash
        run: |
          set -euo pipefail
          USER="${{ secrets.DEPLOY_USER }}"; [ -n "$USER" ] || USER=deploy
          PORT="${{ secrets.DEPLOY_PORT }}"; [ -n "$PORT" ] || PORT=22
          HOST="${{ secrets.DEPLOY_HOST }}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/key -p "$PORT" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cat > /tmp/gravitas-consent.conf <<'EOF'
          map $host $gravitas_body_close {
              default "</body>";
              gravitasplus.com '<script src="/assets/consent.js"></script></body>';
          }

          map $uri $gravitas_head_close {
              default "</head>";
              / '<link rel="canonical" href="https://gravitasplus.com/"></head>';
              /about.html '<link rel="canonical" href="https://gravitasplus.com/about.html"></head>';
              /dossiers.html '<link rel="canonical" href="https://gravitasplus.com/dossiers.html"></head>';
              /magazine.html '<link rel="canonical" href="https://gravitasplus.com/magazine.html"></head>';
              /lab.html '<link rel="canonical" href="https://gravitasplus.com/lab.html"></head>';
              /learn.html '<link rel="canonical" href="https://gravitasplus.com/learn.html"></head>';
              /community.html '<link rel="canonical" href="https://gravitasplus.com/community.html"></head>';
              /dossier-machine-hypothesis.html '<link rel="canonical" href="https://gravitasplus.com/dossier-machine-hypothesis.html"></head>';
              /dossier-computable-universe.html '<link rel="canonical" href="https://gravitasplus.com/dossier-computable-universe.html"></head>';
              /article-hypothesis-or-sentence.html '<link rel="canonical" href="https://gravitasplus.com/article-hypothesis-or-sentence.html"></head>';
              /game-hypothesis-machine.html '<link rel="canonical" href="https://gravitasplus.com/game-hypothesis-machine.html"></head>';
          }

          sub_filter_once on;
          sub_filter '</body>' $gravitas_body_close;
          sub_filter '</head>' $gravitas_head_close;
          EOF
          sudo mv /tmp/gravitas-consent.conf /etc/nginx/conf.d/gravitas-consent.conf
          sudo chmod 644 /etc/nginx/conf.d/gravitas-consent.conf
          sudo nginx -t
          sudo systemctl reload nginx
          REMOTE

      - name: Verify privacy and canonical output
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          curl -4 -fsSL https://gravitasplus.com/assets/consent.js | grep -q 'gravitas:consent:v1'
          HOME_HTML="$(curl -4 -fsSL https://gravitasplus.com/)"
          printf '%s' "$HOME_HTML" | grep -q '/assets/consent.js'
          printf '%s' "$HOME_HTML" | grep -Fq '<link rel="canonical" href="https://gravitasplus.com/">'
          curl -4 -fsSL https://gravitasplus.com/dossiers.html | grep -Fq '<link rel="canonical" href="https://gravitasplus.com/dossiers.html">'
          echo gravitas-privacy-and-canonical-enabled
