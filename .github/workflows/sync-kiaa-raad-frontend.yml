name: Auto-sync Kiarash frontend

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-kiaa-raad-frontend.yml'
      - 'scripts/sync-kiaa-raad-frontend.sh'
      - '.sync-kiaa-raad-trigger'

permissions:
  contents: write
  actions: write

concurrency:
  group: gravitas-kiaa-raad-frontend-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove stale homepage metric cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('assets/production-cleanup.js')
          s = p.read_text()
          old = '''    var heroCredit = document.querySelector('.lp-hero__credit');
    cleanText(heroCredit, [
      [/\\s*·\\s*312K\\s+subscribers\\b/gi, '']
    ]);

'''
          if old in s:
              s = s.replace(old, '', 1)
          if '312K\\s+subscribers' in s:
              raise SystemExit('Stale hero subscriber cleanup is still present')
          p.write_text(s)
          PY

      - name: Prepare durable separator-aware sync
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/sync-kiaa-raad-frontend.sh /tmp/sync-kiaa-raad-frontend.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/sync-kiaa-raad-frontend.sh')
          s = p.read_text()
          old = '<i class="lp-hero__sep" aria-hidden="true"></i>'
          new = '<i class="lp-hero__sep" aria-hidden="true">·</i>'
          if old not in s and new not in s:
              raise SystemExit('Separator template not found in sync script')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          chmod +x /tmp/sync-kiaa-raad-frontend.sh

      - name: Sync latest Kiarash design
        id: sync
        shell: bash
        run: bash /tmp/sync-kiaa-raad-frontend.sh

      - name: Verify complete hero credit
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o 'class="lp-hero__sep"' index.html | wc -l | tr -d ' ')" = "2"
          test "$(grep -o '>·</i>' index.html | wc -l | tr -d ' ')" = "2"
          grep -Fq '<span>New topic monthly</span>' index.html
          grep -Fq '<span><span class="g-nums">312K</span> subscribers</span>' index.html
          grep -Fq '<span><a href="community.html#join">4,100 members</a></span>' index.html
          if grep -Fq '312K\s+subscribers' assets/production-cleanup.js; then
            echo 'production-cleanup.js still removes the subscriber stat' >&2
            exit 1
          fi
          grep -q 'lp-hero__sep' assets/production-overrides.css

      - name: Deploy when design changed
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run deploy.yml --ref main

      - name: Report
        if: always()
        shell: bash
        run: |
          echo '### Kiarash frontend auto-sync' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source: kiaa-raad/gravitasplus' >> "$GITHUB_STEP_SUMMARY"
          echo 'Schedule: every 15 minutes' >> "$GITHUB_STEP_SUMMARY"
          echo 'Hero credit: New topic monthly · 312K subscribers · 4,100 members' >> "$GITHUB_STEP_SUMMARY"
          echo 'Changed: ${{ steps.sync.outputs.changed }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Upstream SHA: ${{ steps.sync.outputs.sha }}' >> "$GITHUB_STEP_SUMMARY"
