name: Apply Approved Team Task Reconciliation
on:
  push:
    branches: [codex/team-task-reconciliation-20261015]
    paths: ['ops/private-plan.encrypted.json', 'ops/apply_task_reconciliation.py', '.github/workflows/apply-task-reconciliation.yml']
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed encrypted plan after deployed schema validation
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$SSH_HOST"
          PORT="${SSH_PORT:-22}"
          REMOTE_USER="${SSH_USER:-deploy}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/reconciliation
          chmod 600 ~/.ssh/reconciliation
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          OPTS=(-i ~/.ssh/reconciliation -p "$PORT" -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          if ! ssh "${OPTS[@]}" "$REMOTE_USER@$SSH_HOST" true 2>/dev/null; then
            if [ "$REMOTE_USER" != root ] && ssh "${OPTS[@]}" "root@$SSH_HOST" true 2>/dev/null; then
              REMOTE_USER=root
            else
              echo 'Production SSH authentication failed' >&2
              exit 1
            fi
          fi
          ROOT=/var/lib/gravitas-source-migrations/team-docs-20261015-v1
          STEM="/tmp/graviquest-approved-$GITHUB_RUN_ID"
          scp -i ~/.ssh/reconciliation -P "$PORT" ops/reconciliation_transport.py "$REMOTE_USER@$SSH_HOST:$STEM-transport.py"
          scp -i ~/.ssh/reconciliation -P "$PORT" ops/apply_task_reconciliation.py "$REMOTE_USER@$SSH_HOST:$STEM-apply.py"
          scp -i ~/.ssh/reconciliation -P "$PORT" ops/private-plan.encrypted.json "$REMOTE_USER@$SSH_HOST:$STEM-envelope.json"
          ssh "${OPTS[@]}" "$REMOTE_USER@$SSH_HOST" "bash -s -- '$STEM' '$ROOT'" <<'REMOTE'
          set -euo pipefail
          STEM="$1"
          ROOT="$2"
          test -f /opt/gravitas-backend/core/migrations/0067_historical_source_tasks_without_fake_deadlines.py
          SECRET="$(sudo awk -F= '/^DJANGO_SECRET_KEY=/{print $2}' /etc/gravitas/backend.env)"
          cd /opt/gravitas-backend
          sudo -u gravitas env DJANGO_SECRET_KEY="$SECRET" DJANGO_DEBUG=0 DJANGO_SETTINGS_MODULE=gravitas_backend.settings .venv/bin/python -m django migrate --check
          if ! sudo test -f "$ROOT/plan.json"; then
            sudo -u gravitas .venv/bin/python "$STEM-transport.py" decrypt --envelope "$STEM-envelope.json" --output "$ROOT/plan.json"
          fi
          sudo -u gravitas bash -c 'set -a; . /etc/gravitas/backend.env; set +a; export DJANGO_SETTINGS_MODULE=gravitas_backend.settings PYTHONPATH=/opt/gravitas-backend; exec /opt/gravitas-backend/.venv/bin/python "$@"' -- "$STEM-apply.py" --plan "$ROOT/plan.json" --expected-sha dd3040ab2e2370f7f9135e01ccbe0127a8fcef5b139e39177a0f67cc7eec316e
          rm -f "$STEM-transport.py" "$STEM-apply.py" "$STEM-envelope.json"
          REMOTE
          mkdir -m 700 results
          ssh "${OPTS[@]}" "$REMOTE_USER@$SSH_HOST" "sudo bash -c 'cd "$ROOT" && tar -czf - before-apply.json after-apply.json audit-*.json'" > results/migration-results.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: approved-migration-results
          path: results/
          retention-days: 1
          if-no-files-found: error
