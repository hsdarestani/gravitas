name: Diagnose live Lab catalog rendering (read only)
on:
  push:
    branches: [fix/lab-catalog-live-debug-20261024]
    paths:
      - ".github/workflows/live-lab-catalog-diagnostic.yml"
      - "scripts/test-live-lab-catalog.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver only in disposable CI temp
        run: npm install --prefix "$RUNNER_TEMP/gq-browser" --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Inspect published production DOM and screenshots
        env:
          NODE_PATH: ${{ runner.temp }}/gq-browser/node_modules
        run: node scripts/test-live-lab-catalog.cjs
      - name: Save screenshots and computed styles for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graviquest-live-lab-dom-diagnostic
          path: qa-artifacts/live-lab-catalog/
          if-no-files-found: warn
          retention-days: 5
