<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Gravitas</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06141b;color:#f5f7f8;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(760px,92vw);padding:48px;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));box-shadow:0 24px 80px rgba(0,0,0,.35)}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.62}h1{margin:12px 0 10px;font-size:clamp(44px,8vw,86px);line-height:.95}p{margin:0;color:rgba(255,255,255,.72);font-size:18px;line-height:1.6}.status{margin-top:30px;display:inline-flex;gap:10px;align-items:center;padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.07);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#76e0a5;box-shadow:0 0 20px #76e0a5}</style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">Gravitas / Production</div>
    <h1>Infrastructure online.</h1>
    <p>The production server is connected. The full Gravitas experience will replace this deployment check page.</p>
    <div class="status"><span class="dot"></span> Deployment ready</div>
  </main>
</body>
</html>
