<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#01121c">
<title>GraviQuest &middot; Logo Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,100..1000&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   GRAVIQUEST · LOGO MOTION
   Idea: the mark is not drawn, it is DERIVED. Two masses sit on opposite
   corners of a square and each sends out a field of rings. The mark is two
   neighbouring rings of each field, kept where they fall inside the square.
   The band width is the diagonal divided by seven, and the bands run from two
   to three widths out: radii 40.41 and 60.61 on a 100-unit side. That leaves
   a gap of exactly one width between them on the diagonal, which is why the
   mark reads as two arcs passing rather than one shape, and it puts both
   masses and every ring on one lattice, so the grid of tangents behind the
   mark can be even. The logo was first published with radii 39.64 and 60.36: centred on
   half the side, but 39.64 is not a whole number of widths, so no even grid
   could pass through the masses and touch every ring at once. The difference
   is under a unit in a hundred. The wordmark is the real path data from
   assets/logos.
   ========================================================================= */
:root{
  --cosmos:#003049; --cosmos-900:#01121c; --cosmos-800:#011f30; --cosmos-700:#00263a;
  --sisal:#d4c9be; --white:#f1efec; --black:#030303;
  --sans:"DM Sans",system-ui,-apple-system,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cosmos-900);color:var(--white);font-family:var(--sans);
  display:grid;place-items:center;overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-bottom:4rem}
.stage{position:relative;width:min(94vw,1180px,150vh);aspect-ratio:16/9;
  isolation:isolate}
.stage__bg{position:absolute;inset:0;border-radius:14px;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 44%,#003049 0%,#011f30 52%,#01121c 100%)}
canvas.grid{position:absolute;inset:0;width:100%;height:100%;display:block}
.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;border-radius:50%;background:var(--white)}
svg.art{position:absolute;inset:0;z-index:2;width:100%;height:100%;overflow:hidden;border-radius:14px}
/* the mark: stroked while it constructs, filled once it resolves */
/* Strokes are in the mark's own units, not screen pixels. The draw-ons dash
   each path by its length in those units, and non-scaling-stroke measures a
   dash in screen pixels instead, so a hidden line showed through in pieces.
   Every stroked guide has retired before the camera pulls back, so a width
   fixed in user space never gets the chance to thin out. */
.mk-stroke{fill:none;stroke:var(--white);stroke-width:.62;
  stroke-linejoin:round;stroke-linecap:round}
.mk-fill{fill:var(--white);opacity:0}
.guide{fill:none;stroke:var(--sisal);stroke-width:.34}
.guide--frame{stroke-dasharray:1.2 1.6;opacity:0}
.anchor{fill:none;stroke:var(--sisal);stroke-width:.4;opacity:0}
.anchor__dot{fill:var(--sisal);opacity:0}
.glyph{fill:var(--white);opacity:0}
/* caption + controls */
.hud{position:absolute;left:0;right:0;bottom:-2.6rem;display:flex;align-items:center;
  justify-content:space-between;gap:1rem;z-index:5;font-family:var(--mono);font-size:.72rem;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(212,201,190,.55)}
.phase{transition:opacity .4s var(--ease)}
.ctrls{display:flex;gap:.5rem}
.btn{font:inherit;letter-spacing:.14em;text-transform:uppercase;color:rgba(241,239,236,.8);
  background:transparent;border:1px solid rgba(212,201,190,.28);border-radius:99px;
  padding:.42rem .9rem;cursor:pointer;transition:.25s var(--ease)}
.btn:hover{color:var(--white);border-color:var(--sisal);background:rgba(212,201,190,.08)}
.btn[aria-pressed="true"]{background:var(--white);color:var(--cosmos);border-color:var(--white)}
:focus-visible{outline:2px solid var(--sisal);outline-offset:3px}
@media (max-width:640px){
  body{padding-bottom:6.5rem}
  .hud{font-size:.62rem;bottom:-3.4rem;flex-direction:column;gap:.6rem}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="stage__bg"></div>
  <canvas class="grid" id="grid"></canvas>

  <svg class="art" id="art" viewBox="-45 -45 190 190" preserveAspectRatio="xMidYMid meet"
       role="img" aria-label="The GraviQuest mark derived from the fields of two masses on opposite corners of a square, then resolving into the GraviQuest wordmark">
    <!-- construction, in the logotype's own units: the mark is the square 0..100 -->
    <g id="guides">
      <rect class="guide guide--frame" id="frame" x="0" y="0" width="100" height="100"/>
      <circle class="guide guide--ring" cx="0" cy="0" r="40.41"/>

      <path d="M151.36,58.91h16.35v5.26c-1.17,1.42-2.65,2.64-4.45,3.65-2.85,1.6-6.22,2.4-10.1,2.4-2.91,0-5.55-.48-7.92-1.45-2.37-.97-4.35-2.35-5.95-4.15-1.6-1.8-2.81-3.94-3.64-6.42-.83-2.48-1.24-5.24-1.24-8.26s.39-5.58,1.16-8c.77-2.43,1.91-4.52,3.42-6.29,1.51-1.77,3.34-3.14,5.48-4.11,2.14-.97,4.58-1.45,7.32-1.45s5.41.49,7.66,1.45c2.25.97,4.11,2.31,5.56,4.02,1.46,1.71,2.35,3.71,2.7,5.99h14.04c-.4-4.85-1.91-9.12-4.54-12.8-2.63-3.68-6.11-6.56-10.44-8.65-4.34-2.08-9.33-3.12-14.98-3.12-5.19,0-9.77.91-13.74,2.74-3.97,1.83-7.28,4.28-9.93,7.36-2.65,3.08-4.64,6.51-5.95,10.27-1.31,3.77-1.97,7.62-1.97,11.56v1.88c0,3.82.66,7.65,1.97,11.47,1.31,3.82,3.32,7.31,6.03,10.44,2.71,3.14,6.15,5.64,10.31,7.49,4.16,1.85,9.04,2.78,14.64,2.78,6.22,0,11.68-1.16,16.39-3.47,4.71-2.31,8.4-5.64,11.08-9.97v-10.62h5.14v-10.1h-34.41v10.1Z"/>
      <path d="M218.89,33.82h-1.8c-5.36,0-9.46,1.8-12.28,5.39-2.13,2.71-3.46,6.29-3.98,10.73v-15.53h-10.87v46.92h13.7v-23.89c0-3.82,1.03-6.75,3.08-8.78,2.05-2.03,4.96-3.04,8.73-3.04h3.42v-11.81Z"/>
      <polygon points="288.77 69.95 286.74 69.95 276.76 34.42 262.64 34.42 276.67 81.34 280.95 81.34 286 81.34 289.94 81.34 294.74 81.34 298.42 81.34 310.57 34.42 297.39 34.42 288.77 69.95"/>

      <polygon points="310.57 34.42 310.57 44.52 316.82 44.52 316.82 81.34 330.51 81.34 330.51 44.52 330.51 34.42 316.82 34.42 310.57 34.42"/>
      <path d="M394.71,27.14c-2.8-3.08-6.28-5.55-10.44-7.41-4.17-1.85-8.99-2.78-14.47-2.78s-10.3.93-14.47,2.78c-4.17,1.86-7.65,4.32-10.44,7.41-2.8,3.08-4.89,6.52-6.29,10.32-1.4,3.8-2.1,7.63-2.1,11.52v1.88c0,3.48.67,7.11,2.01,10.87,1.34,3.77,3.38,7.26,6.12,10.49,2.74,3.22,6.21,5.82,10.4,7.79,2.85,1.34,6.05,2.21,9.57,2.64,4.32,10.19,14.42,17.35,26.17,17.35v-10.87c-5.61,0-10.6-2.66-13.81-6.77,2.75-.49,5.3-1.26,7.61-2.35,4.19-1.97,7.66-4.57,10.4-7.79,2.74-3.22,4.79-6.72,6.16-10.49,1.37-3.77,2.05-7.39,2.05-10.87v-1.88c0-3.88-.71-7.72-2.14-11.52-1.43-3.8-3.54-7.23-6.33-10.32ZM387.69,57.71c-.86,2.4-2.13,4.51-3.81,6.34-1.68,1.83-3.71,3.25-6.08,4.28-2.37,1.03-5.04,1.54-8,1.54s-5.62-.51-7.96-1.54c-2.34-1.03-4.35-2.45-6.03-4.28-1.68-1.83-2.95-3.94-3.81-6.34-.86-2.4-1.28-4.96-1.28-7.7,0-2.91.43-5.58,1.28-8,.86-2.43,2.13-4.54,3.81-6.34,1.68-1.8,3.69-3.18,6.03-4.15,2.34-.97,4.99-1.45,7.96-1.45s5.62.49,7.96,1.45c2.34.97,4.35,2.35,6.03,4.15,1.68,1.8,2.97,3.91,3.85,6.34.88,2.43,1.33,5.09,1.33,8,0,2.74-.43,5.31-1.28,7.7Z"/>
      <path d="M437.77,61.99c0,2.63-.77,4.71-2.31,6.25-1.54,1.54-3.54,2.31-5.99,2.31s-4.31-.74-5.74-2.23c-1.43-1.48-2.14-3.48-2.14-5.99v-27.91h-13.7v27.23c0,7.08,1.45,12.37,4.37,15.88,2.91,3.51,7.08,5.26,12.5,5.26h.6c3.54,0,6.51-.77,8.9-2.31s4.21-3.9,5.44-7.06c.35-.91.65-1.89.9-2.93v10.85h10.87v-46.92h-13.7v27.57Z"/>
      <path d="M493.71,36.18c-3.45-2.25-7.69-3.38-12.71-3.38-3.82,0-7.23.67-10.23,2.01-3,1.34-5.49,3.15-7.49,5.44-2,2.28-3.52,4.87-4.58,7.75-1.06,2.88-1.58,5.89-1.58,9.03v1.71c0,3.03.53,5.98,1.58,8.86,1.06,2.88,2.6,5.48,4.62,7.79,2.03,2.31,4.56,4.15,7.62,5.52,3.05,1.37,6.58,2.05,10.57,2.05s7.42-.68,10.44-2.05c3.02-1.37,5.53-3.28,7.53-5.74,2-2.45,3.34-5.25,4.02-8.39h-12.58c-.57,1.43-1.66,2.63-3.25,3.59-1.6.97-3.65,1.46-6.16,1.46-2.74,0-4.96-.57-6.68-1.71-1.71-1.14-2.97-2.75-3.77-4.84-.44-1.16-.75-2.43-.95-3.81h34.25v-4.62c0-4.28-.91-8.23-2.74-11.86-1.83-3.62-4.47-6.56-7.92-8.82ZM471.15,50.3c.86-2.08,2.11-3.67,3.77-4.75,1.65-1.08,3.68-1.63,6.08-1.63s4.29.53,5.86,1.58c1.57,1.06,2.75,2.58,3.55,4.58.43,1.08.74,2.28.93,3.59h-21.14c.21-1.24.52-2.37.94-3.38Z"/>

  <div class="hud">
    <span class="phase" id="phase">The field</span>

      <button class="btn" id="sound" aria-pressed="false">Sound off</button>
      <button class="btn" id="replay">Replay</button>
    </div>

</div>
<script>
(function () {
  'use strict';
  // The two masses, and the ring step of their fields. Both bounding radii of
  // the mark are rings of the same field, two and three steps out, and the
  // diagonal between the masses is seven steps.
  var MASSES = [[0, 0], [100, 100]];
  var STEP = Math.hypot(100, 100) / 7, R_IN = 2 * STEP, R_OUT = 3 * STEP;

  var art    = document.getElementById('art');
  var guides = document.getElementById('guides');
  var frameEl= document.getElementById('frame');
  var rings  = Array.prototype.slice.call(document.querySelectorAll('.guide--ring'));
  var strokes= Array.prototype.slice.call(document.querySelectorAll('.mk-stroke'));
  var fills  = Array.prototype.slice.call(document.querySelectorAll('.mk-fill'));
  var word   = document.getElementById('word');
  var phaseEl= document.getElementById('phase');
  var cv     = document.getElementById('grid');
  var ctx    = cv.getContext('2d');
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // order the wordmark glyphs left to right so they reveal like writing
  var glyphs = Array.prototype.slice.call(word.children);
  glyphs.forEach(function (g) { g.classList.add('glyph'); });
  glyphs.sort(function (a, b) { return a.getBBox().x - b.getBBox().x; });

  // ---- camera: tight on the mark, then pulls back to frame the whole word ---
  var CAM_IN  = { x: -45, y: -45, w: 190, h: 190 };
  var CAM_OUT = { x: -50, y: -65, w: 680.72, h: 230 };
  function camera(t) {                     // t: 0 = mark, 1 = wordmark
    var e = ease(t);
    var x = CAM_IN.x + (CAM_OUT.x - CAM_IN.x) * e;
    var y = CAM_IN.y + (CAM_OUT.y - CAM_IN.y) * e;
    var w = CAM_IN.w + (CAM_OUT.w - CAM_IN.w) * e;
    var h = CAM_IN.h + (CAM_OUT.h - CAM_IN.h) * e;
    art.setAttribute('viewBox', x + ' ' + y + ' ' + w + ' ' + h);
  }
  function ease(t){ return t<=0?0 : t>=1?1 : 1-Math.pow(1-t,3); }
  function clamp01(v){ return v<0?0:v>1?1:v; }
  function seg(now, a, b){ return clamp01((now-a)/(b-a)); }

  // ---- the two masses, as anchors on the corners ---------------------------
  var NS = 'http://www.w3.org/2000/svg';
  function mkAnchor(p) {
    var g = document.createElementNS(NS, 'g');
    var r = 6;
    ['M'+(p[0]-r)+' '+p[1]+'h'+(2*r), 'M'+p[0]+' '+(p[1]-r)+'v'+(2*r)].forEach(function (d) {
      var l = document.createElementNS(NS, 'path');
      l.setAttribute('d', d); l.setAttribute('class', 'anchor');
      g.appendChild(l);
    });
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', p[0]); c.setAttribute('cy', p[1]); c.setAttribute('r', 2.2);
    c.setAttribute('class', 'anchor__dot');
    g.appendChild(c);
    guides.appendChild(g);
    return g;
  }
  var massNodes = MASSES.map(mkAnchor);

  // ---- path lengths for the draw-ons --------------------------------------
  function prime(el) {
    var len = el.getTotalLength();
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
    el._len = len;
  }
  rings.forEach(prime);
  strokes.forEach(prime);

  // ---- starfield -----------------------------------------------------------
  (function stars(){
    var host = document.getElementById('stars'), frag = document.createDocumentFragment();
    for (var i = 0; i < 90; i++) {
      var s = document.createElement('span'); s.className = 'star';
      var sz = Math.random() < .85 ? Math.random()*1.3+.5 : Math.random()*1.6+1.9;
      s.style.cssText = 'left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;width:'+
        sz.toFixed(2)+'px;height:'+sz.toFixed(2)+'px;opacity:'+(Math.random()*.45+.15).toFixed(2);
      frag.appendChild(s);
    }
    host.appendChild(frag);
  })();

  // ---- sound: synthesised, spacious, entirely optional --------------------
  // Everything runs through a generated convolution reverb and a feedback delay,
  // so nothing lands dry. Tones are low sines with slow attacks and long tails,
  // pitched from a D minor pentatonic, an open and unresolved scale that invites
  // listening rather than announcing itself.
  var AC = null, master = null, revBus = null, dlyBus = null, soundOn = false;

  function impulse(seconds, decay) {          // a plausible hall, made from noise
    var n = Math.floor(AC.sampleRate * seconds);
    var buf = AC.createBuffer(2, n, AC.sampleRate);
    for (var ch = 0; ch < 2; ch++) {
      var d = buf.getChannelData(ch);
      for (var i = 0; i < n; i++) {
        var env = Math.pow(1 - i / n, decay);
        // sparse early reflections, then a smooth diffuse tail
        d[i] = (Math.random() * 2 - 1) * env * (i < n * 0.02 ? 0.6 : 1);
      }
    }
    return buf;
  }

  function audio() {
    if (AC) return AC;
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = new C();

    master = AC.createGain(); master.gain.value = 0.5;
    var lp = AC.createBiquadFilter();          // take the glare off everything
    lp.type = 'lowpass'; lp.frequency.value = 4200; lp.Q.value = 0.4;
    lp.connect(master); master.connect(AC.destination);

    var conv = AC.createConvolver();
    conv.buffer = impulse(4.2, 2.6);
    revBus = AC.createGain(); revBus.gain.value = 0.9;
    var revOut = AC.createGain(); revOut.gain.value = 0.85;
    revBus.connect(conv); conv.connect(revOut); revOut.connect(lp);

    var dly = AC.createDelay(1.5); dly.delayTime.value = 0.34;
    var fb  = AC.createGain(); fb.gain.value = 0.42;
    var dlyLp = AC.createBiquadFilter();
    dlyLp.type = 'lowpass'; dlyLp.frequency.value = 1800;
    dlyBus = AC.createGain(); dlyBus.gain.value = 0.5;
    dlyBus.connect(dly); dly.connect(dlyLp); dlyLp.connect(fb); fb.connect(dly);
    dlyLp.connect(revBus); dlyLp.connect(lp);

    audio.dry = lp;
    return AC;
  }

  // one voice: sine with a slow swell and a long tail, sent mostly to the room
  function tone(freq, dur, vol, opts) {
    if (!soundOn || !AC) return;
    opts = opts || {};
    var t = AC.currentTime + (opts.delay || 0);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = opts.type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (opts.glide) o.frequency.exponentialRampToValueAtTime(opts.glide, t + dur * 0.9);
    if (opts.detune) o.detune.setValueAtTime(opts.detune, t);

    var atk = opts.attack == null ? 0.06 : opts.attack;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0002), t + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    o.connect(g);
    var dryG = AC.createGain(); dryG.gain.value = opts.dry == null ? 0.30 : opts.dry;
    var wetG = AC.createGain(); wetG.gain.value = opts.wet == null ? 0.85 : opts.wet;
    var echoG = AC.createGain(); echoG.gain.value = opts.echo == null ? 0.30 : opts.echo;
    g.connect(dryG); dryG.connect(audio.dry);
    g.connect(wetG); wetG.connect(revBus);
    g.connect(echoG); echoG.connect(dlyBus);

    o.start(t); o.stop(t + dur + 0.1);
  }

  // a struck-bell shape: fundamental plus a quiet, slightly sharp partial
  function bell(freq, dur, vol) {
    tone(freq, dur, vol, { attack: 0.012, wet: 0.95, echo: 0.42, dry: 0.22 });
    tone(freq * 2.01, dur * 0.55, vol * 0.28,
         { attack: 0.008, wet: 0.9, echo: 0.3, dry: 0.12 });
  }

  function swell(dur, vol) {                   // filtered noise, far back in the room
    if (!soundOn || !AC) return;
    var t = AC.currentTime, n = Math.floor(AC.sampleRate * dur);
    var buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1);
    var src = AC.createBufferSource(); src.buffer = buf;
    var bp = AC.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.setValueAtTime(180, t);
    bp.frequency.exponentialRampToValueAtTime(900, t + dur);
    bp.Q.value = 2.2;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, t + dur * 0.55);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bp); bp.connect(g);
    var w = AC.createGain(); w.gain.value = 1.0; g.connect(w); w.connect(revBus);
    var dry = AC.createGain(); dry.gain.value = 0.18; g.connect(dry); dry.connect(audio.dry);
    src.start(t); src.stop(t + dur);
  }

  // ---- ambient bed --------------------------------------------------------
  // A slow drone under the whole piece: root, fifth and a detuned octave, with
  // the filter opening and closing on its own cycle so the pad breathes rather
  // than sits. Fades in over the opening beats and away again at the end, so it
  // frames the sequence instead of announcing itself.
  var pad = null;
  function padStart() {
    if (!soundOn || !AC || pad) return;
    var t = AC.currentTime;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.075, t + 3.0);      // long fade in

    var lp = AC.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = 3.0;

    // a slow sweep so the timbre keeps moving, which is what reads as "curious"
    var lfo = AC.createOscillator(), lfoAmt = AC.createGain();
    lfo.frequency.value = 0.055; lfoAmt.gain.value = 190;
    lfo.connect(lfoAmt); lfoAmt.connect(lp.frequency);
    lfo.start(t);

    var oscs = [];
    [[36.71, 0], [55.00, -6], [73.42, +7], [110.00, -4]].forEach(function (spec, i) {
      var o = AC.createOscillator();
      o.type = i === 3 ? 'triangle' : 'sine';
      o.frequency.setValueAtTime(spec[0], t);
      o.detune.setValueAtTime(spec[1], t);
      var vg = AC.createGain();
      vg.gain.value = i === 0 ? 1.0 : (i === 3 ? 0.16 : 0.34);
      o.connect(vg); vg.connect(lp);
      o.start(t); oscs.push(o);
    });

    lp.connect(g);
    var dryG = AC.createGain(); dryG.gain.value = 0.5;
    var wetG = AC.createGain(); wetG.gain.value = 0.9;
    g.connect(dryG); dryG.connect(audio.dry);
    g.connect(wetG); wetG.connect(revBus);

    pad = { g: g, oscs: oscs, lfo: lfo };
  }
  function padStop(fade) {
    if (!pad || !AC) return;
    var t = AC.currentTime, p = pad; pad = null;
    p.g.gain.cancelScheduledValues(t);
    p.g.gain.setValueAtTime(Math.max(p.g.gain.value, 0.0001), t);
    p.g.gain.exponentialRampToValueAtTime(0.0001, t + (fade || 2.4));
    p.oscs.forEach(function (o) { o.stop(t + (fade || 2.4) + 0.2); });
    p.lfo.stop(t + (fade || 2.4) + 0.2);
  }

  // D minor pentatonic, low register: open and unresolved
  var PENT = [146.83, 174.61, 196.00, 220.00, 261.63, 293.66, 349.23, 392.00];

  // ---- the field: tangents across the axis of the two masses ----------------
  // This used to be a family of concentric rings round each mass. Two such
  // families cross each other everywhere, and the grid read as a moire rather
  // than as the construction. The construction drawing in the brand process has
  // no crossings: its grid is a set of parallel lines square to the diagonal
  // that joins the masses, each one tangent to a ring where that ring meets the
  // diagonal. With the diagonal seven steps long and the rings at two and
  // three, every multiple of STEP along it is a mass or a tangent point, on
  // both sides of both masses, so one even set of lines does all of it. The
  // lines are drawn on the canvas in screen space, so they track the camera
  // exactly.
  var GW = 0, GH = 0, gdpr = 1;
  function sizeGrid() {
    var r = cv.getBoundingClientRect();
    if (!r.width) return;
    gdpr = Math.min(window.devicePixelRatio || 1, 2);
    GW = r.width; GH = r.height;
    cv.width  = Math.round(GW * gdpr);
    cv.height = Math.round(GH * gdpr);
    ctx.setTransform(gdpr, 0, 0, gdpr, 0, 0);
  }
  sizeGrid();

  function toScreen(x, y) {
    var m = art.getScreenCTM();
    if (!m) return null;
    var host = cv.getBoundingClientRect();
    return { x: m.a * x + m.e - host.left, y: m.d * y + m.f - host.top, k: m.a };
  }
  var pulse = -1;                       // shockwave progress, -1 = idle
  var lastField = [0, 0];               // what the canvas shows now, for a resize
  var AXIS = Math.hypot(MASSES[1][0] - MASSES[0][0], MASSES[1][1] - MASSES[0][1]);
  function drawField(reveal, alpha) {
    lastField = [reveal, alpha];
    ctx.clearRect(0, 0, GW, GH);
    if (alpha <= 0.001) return;
    var far = Math.hypot(GW, GH);
    var a = toScreen(MASSES[0][0], MASSES[0][1]);
    var b = toScreen(MASSES[1][0], MASSES[1][1]);
    if (!a || !b) return;
    // unit vector along the axis on screen, and the one square to it
    var ux = (b.x - a.x) / (AXIS * a.k), uy = (b.y - a.y) / (AXIS * a.k);
    var vx = -uy, vy = ux;
    var mid = AXIS / 2;
    // every multiple of STEP along the axis, enough to cover the stage,
    // revealed outward from the middle of the square
    var reach = far / a.k;
    var lines = [];
    for (var k = -Math.ceil((reach - mid) / STEP) - 1; k * STEP < mid + reach; k++) {
      lines.push(k * STEP);
    }
    lines.sort(function (p, q) { return Math.abs(p - mid) - Math.abs(q - mid); });
    var shown = reveal * (lines.length * 0.5 + 2);
    ctx.lineWidth = 1;
    lines.forEach(function (d, i) {
      var fade = clamp01(shown - i * 0.5);
      if (fade <= 0) return;
      var off = Math.abs(d - mid) / STEP;
      var falloff = 1 / (1 + Math.max(0, off - 1.5) * 0.28);
      var px = a.x + ux * d * a.k, py = a.y + uy * d * a.k;
      var len = far * ease(fade);          // each line grows out of its tangent point
      ctx.strokeStyle = 'rgba(241,239,236,' + (0.34 * alpha * fade * falloff).toFixed(3) + ')';
      ctx.beginPath();
      ctx.moveTo(px - vx * len, py - vy * len);
      ctx.lineTo(px + vx * len, py + vy * len);
      ctx.stroke();
    });
    MASSES.forEach(function (p) {
      var s = toScreen(p[0], p[1]);
      if (!s) return;
      if (pulse >= 0 && pulse <= 1) {
        var e = 1 - Math.pow(1 - pulse, 2.4);
        ctx.strokeStyle = 'rgba(241,239,236,' + (0.42 * (1 - pulse) * alpha).toFixed(3) + ')';
        ctx.lineWidth = 2.0 * (1 - pulse) + 0.4;
        ctx.beginPath(); ctx.arc(s.x, s.y, (R_OUT + e * 160) * s.k, 0, Math.PI * 2); ctx.stroke();
      }
    });
  }

  // ---- timeline ------------------------------------------------------------
  var T = {
    field:  [0.00, 1.30],
    radii:  [1.20, 2.20],
    outline:[2.10, 3.30],
    fill:   [3.30, 4.10],
    word:   [4.20, 5.50],
    settle: [5.50, 6.60]
  };
  var DUR = 6.8;
  var PHASES = [
    [0.00, 'The field'],
    [1.20, 'Two radii'],
    [2.10, 'Contour'],
    [3.30, 'Resolve'],
    [4.20, 'GraviQuest']
  ];
  var fired = {};
  function once(key, fn){ if(!fired[key]){ fired[key]=1; fn(); } }
  var t0 = null, raf = null;

  function reset(){
    fired = {};
    padStop(0.35);          // never let two beds overlap on replay
    rings.concat(strokes).forEach(function (el) { el.style.strokeDashoffset = el._len; el.style.opacity = 1; });
    fills.forEach(function (el) { el.style.opacity = 0; el.style.filter = 'none'; });
    frameEl.style.opacity = 0;
    guides.style.opacity = 0.9;
    massNodes.forEach(function (g) {
      g.querySelectorAll('.anchor,.anchor__dot').forEach(function (e) { e.style.opacity = 0; });
    });
    glyphs.forEach(function(g){ g.style.opacity=0; g.style.transform='translateY(6px)'; });
    pulse = -1; camera(0); drawField(0, 0);
    phaseEl.textContent = PHASES[0][1];
  }

  function frame(now){
    if (t0 === null) t0 = now;
    var t = (now - t0)/1000;

    // the masses land first, then their fields spread outward
    massNodes.forEach(function (g, i) {
      var f = seg(t, 0.05 + i * 0.25, 0.45 + i * 0.25), e = ease(f);
      g.querySelectorAll('.anchor').forEach(function (el) { el.style.opacity = 0.55 * e; });
      g.querySelector('.anchor__dot').style.opacity = e;
      if (f > 0.02) once('m' + i, function () { bell(PENT[i * 2], 3.0, 0.09); });
    });
    var fieldAlpha = 1 - seg(t, T.fill[0] + 0.30, T.word[0] - 0.05);
    drawField(ease(seg(t, T.field[0], T.field[1])), fieldAlpha);
    once('s_field', function(){ padStart(); swell(2.6, 0.075); tone(73.42, 6.0, 0.05, {attack:1.2, wet:1.0, dry:0.10, echo:0.12}); });

    // two rings of each field are picked out, and the square that will cut them
    var rp = seg(t, T.radii[0], T.radii[1]);
    rings.forEach(function (el, i) {
      var f = clamp01(rp * (rings.length + 1) - i), e = ease(f);
      el.style.strokeDashoffset = el._len * (1 - e);
      if (f > 0.02) once('r' + i, function () { bell(PENT[(i + 2) % PENT.length] * 2, 2.2, 0.06); });
    });
    frameEl.style.opacity = 0.7 * ease(seg(t, T.radii[0] + 0.3, T.radii[1]));

    // the band inside the square draws along the real path
    var op = seg(t, T.outline[0], T.outline[1]);
    strokes.forEach(function (el) { el.style.strokeDashoffset = el._len * (1 - ease(op)); });
    if (op > 0.01) once('s_out', function(){ tone(98, 3.2, 0.075, {attack:0.5, glide:146.83, wet:1.0, dry:0.16, echo:0.2}); });

    // resolve: stroke hands over to fill, guides retire
    pulse = t >= T.fill[0] ? (t - T.fill[0]) / 1.15 : -1;
    var fp = seg(t, T.fill[0], T.fill[1]);
    if (fp > 0) {
      var e = ease(fp);
      fills.forEach(function (el) {
        el.style.opacity = e;
        el.style.filter = 'drop-shadow(0 0 '+(10*e).toFixed(1)+'px rgba(241,239,236,'+(0.30*e).toFixed(2)+'))';
      });
      strokes.forEach(function (el) { el.style.opacity = 1 - e; });
      guides.style.opacity = 0.9 * (1 - e);
      once('s_fill', function(){ tone(73.42, 5.0, 0.16, {attack:0.10, wet:1.0, dry:0.30, echo:0.25}); tone(110, 4.2, 0.075, {attack:0.16, wet:1.0, dry:0.18}); });
    }

    // the camera pulls back and the wordmark arrives beside the mark
    var wp = seg(t, T.word[0], T.word[1]);
    camera(wp);
    if (wp > 0) {
      glyphs.forEach(function(g, i){
        var f = clamp01(wp*(glyphs.length+2) - i), e = ease(f);
        g.style.opacity = e;
        g.style.transform = 'translateY('+(6*(1-e)).toFixed(2)+'px)';
        if (f > 0.02) once('g'+i, function(){ bell(PENT[i % PENT.length] * 4, 1.5, 0.032); });
      });
      once('s_word', function(){ swell(0.7, 0.08); });
    }

    if (t > T.settle[0]) {
      once('s_end', function(){
        padStop(3.0);
        // an open fifth, left hanging in the room rather than resolved
        bell(293.66, 5.5, 0.085);
        tone(440.00, 5.0, 0.05, {attack:0.5, delay:0.32, wet:1.0, dry:0.14});
        tone(146.83, 6.5, 0.06, {attack:0.8, wet:1.0, dry:0.16, echo:0.1});
      });
    }

    for (var k = PHASES.length - 1; k >= 0; k--) {
      if (t >= PHASES[k][0]) {
        if (phaseEl.textContent !== PHASES[k][1]) phaseEl.textContent = PHASES[k][1];
        break;
      }
    }
    if (t < DUR) raf = requestAnimationFrame(frame);
    else raf = null;
  }

  function play(){
    if (raf) cancelAnimationFrame(raf);
    reset(); t0 = null;
    if (reduce) { showEndState(); return; }
    raf = requestAnimationFrame(frame);
  }
  function showEndState(){
    // reduced motion: present the resolved lock-up, no animation
    camera(1);
    drawField(1, 0.28);
    strokes.forEach(function (el) { el.style.opacity = 0; });
    fills.forEach(function (el) { el.style.opacity = 1; });
    guides.style.opacity = 0;
    glyphs.forEach(function(g){ g.style.opacity = 1; g.style.transform = 'none'; });
    phaseEl.textContent = 'GraviQuest';
  }

  document.getElementById('replay').addEventListener('click', function(){
    if (soundOn) audio() && AC.resume();
    play();
  });
  var sBtn = document.getElementById('sound');
  sBtn.addEventListener('click', function(){
    soundOn = !soundOn;
    sBtn.setAttribute('aria-pressed', String(soundOn));
    sBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
    if (soundOn) { audio(); if (AC && AC.state === 'suspended') AC.resume(); play(); }
  });
  // Resizing a canvas clears it. Mid-sequence the next frame repaints it, but a
  // finished sequence, a reduced-motion still or a ?t= frame has no next frame,
  // so the field it was showing is redrawn here at the new size.
  addEventListener('resize', function(){ sizeGrid(); drawField(lastField[0], lastField[1]); });

  // ?t=3.4 freezes the sequence at that second, silent: a still for a
  // thumbnail or a storyboard, and the only way to inspect a beat in a
  // headless browser, which does not run animation frames.
  var still = parseFloat(new URLSearchParams(location.search).get('t'));
  if (isFinite(still)) {
    reset(); t0 = 0; DUR = -1;          // DUR < t stops frame() rescheduling
    frame(Math.max(0, still) * 1000);
    return;
  }
  play();
})();
</script>
</body>
</html>
