<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Education production viewport check · GraviQuest</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee;font:14px/1.5 system-ui,sans-serif;color:#15252d}nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;flex-wrap:wrap;gap:12px;background:white;padding:12px 16px;border-bottom:1px solid #bbb}label{display:flex;align-items:center;gap:8px}select,button,a{min-height:40px;font:inherit}select{padding:6px 10px}p{margin:10px 16px}iframe{display:block;border:0;background:white;margin:16px;width:390px;height:844px;box-shadow:0 0 0 1px #aaa}a{display:inline-flex;align-items:center;color:#003049}output{font-variant-numeric:tabular-nums}
</style></head><body>
<nav aria-label="Production viewport controls"><label>Device size <select id="check-size"><option value="320,568">Narrow phone · 320 × 568</option><option value="360,800">Android · 360 × 800</option><option value="375,667">iPhone SE · 375 × 667</option><option value="390,844" selected>iPhone · 390 × 844</option><option value="412,915">Android · 412 × 915</option><option value="768,1024">Tablet · 768 × 1024</option><option value="1440,900">Desktop · 1440 × 900</option></select></label><label>Language <select id="check-language"><option value="en">English</option><option value="de">Deutsch</option></select></label><label>Model <select id="check-model"><option value="physics">Physics</option><option value="chemistry">Chemistry</option><option value="mathematics">Mathematics</option><option value="finance">Finance</option><option value="biology">Biology</option><option value="engineering">Engineering</option><option value="computing">Computer Science</option><option value="sociology">Sociology</option><option value="neuroscience">Neuroscience</option></select></label><a href="../../education.html">Open Education</a><output id="check-status" aria-live="polite">Loading published page…</output></nav>
<p>Loads the published Education pages from this origin. Frame sizes emulate layout; they do not emulate native Safari, Android browsers or a device keyboard. No learner text is collected by this check page.</p>
<iframe id="production-view" title="Published Education viewport" src="../../education.html?demo=physics#erleben"></iframe>
<script>
(function(){'use strict';const frame=document.getElementById('production-view'),size=document.getElementById('check-size'),language=document.getElementById('check-language'),model=document.getElementById('check-model'),status=document.getElementById('check-status');
function measure(){try{const d=frame.contentDocument;if(!d||d.readyState==='loading')return;status.textContent=frame.contentWindow.innerWidth+' × '+frame.contentWindow.innerHeight+' · document '+d.documentElement.clientWidth+' / '+d.documentElement.scrollWidth+' px';}catch(_){status.textContent='Unable to read the published frame.';}}
function resize(){const [width,height]=size.value.split(',').map(Number);frame.style.width=width+'px';frame.style.height=height+'px';requestAnimationFrame(measure);}
function navigate(){const file=language.value==='de'?'education-de.html':'education.html',url=new URL('../../'+file,location.href);url.searchParams.set('demo',model.value);url.hash='erleben';status.textContent='Loading published page…';frame.src=url.href;}
size.addEventListener('change',resize);language.addEventListener('change',navigate);model.addEventListener('change',navigate);frame.addEventListener('load',measure);resize();
})();
</script></body></html>
